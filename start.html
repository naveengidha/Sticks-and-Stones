<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Start Game</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Georgia','Times New Roman',serif;background:#080f0a;margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;}
.page-header{padding:16px 20px 8px;font-size:20px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;text-align:center;flex-shrink:0;}
.scroll-area{flex:1;overflow-y:auto;padding:8px 16px 110px;}
.hidden{display:none!important;}
.setup-section{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.setup-section-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.45);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,212,71,0.25);}
.name-input{width:100%;padding:7px 10px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#fff;font-size:14px;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;letter-spacing:.3px;box-sizing:border-box;}
.name-input::placeholder{color:rgba(255,255,255,0.25);}
.name-input:focus{outline:none;border-color:rgba(255,212,71,0.7);background:rgba(0,0,0,0.55);}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

/* Format selector — compact chips */
.format-chips{display:flex;gap:6px;}
.fmt-chip{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 2px;border-radius:8px;cursor:pointer;white-space:nowrap;
  background:rgba(0,0,0,0.3);border:1px solid rgba(255,212,71,0.15);
  color:rgba(255,255,255,0.35);font-size:9.5px;font-weight:bold;letter-spacing:.6px;
  text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;
  transition:all .15s;user-select:none;-webkit-user-select:none;
}
.fmt-chip:active{transform:scale(0.96);}
.fmt-chip.active{
  background:rgba(255,212,71,0.1);border-color:rgba(255,212,71,0.6);
  color:#ffd447;box-shadow:0 0 10px rgba(255,212,71,0.1);
}
.fmt-chip-suit{font-size:14px;line-height:1;}
.fmt-active-label{display:none;}

/* Settings rows */
.row-setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:8px;}
.row-setting:last-child{margin-bottom:0;}
.row-label{font-size:11px;color:rgba(255,212,71,0.55);text-transform:uppercase;letter-spacing:.8px;}
.row-control{display:flex;align-items:center;gap:6px;}
.select-input{padding:6px 8px;border-radius:4px;border:1px solid rgba(255,212,71,0.25);font-size:13px;background:rgba(0,0,0,0.4);color:#ffd447;font-family:'Courier New',monospace;-webkit-appearance:none;}
.num-input{width:64px;padding:6px 8px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);font-size:14px;background:rgba(0,0,0,0.4);color:#fff;font-family:'Courier New',monospace;text-align:center;}
.num-input:focus{outline:none;border-color:rgba(255,212,71,0.7);}
.currency{color:#a07840;font-size:14px;}
.divider{border:none;border-top:1px solid rgba(255,212,71,0.1);margin:8px 0;}
.error-msg{color:#ff6b6b;font-size:13px;display:none;margin-bottom:8px;}
.start-btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;margin-top:4px;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.start-btn:active{opacity:.85;}
.col-header{font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);}
.stroke-grid{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;margin-bottom:6px;}
.stroke-grid:last-child{margin-bottom:0;}
.score-input{padding:7px 6px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#ffd447;font-size:14px;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;text-align:center;width:100%;box-sizing:border-box;}
.score-input::placeholder{color:rgba(255,255,255,0.2);font-size:11px;}
.score-input:focus{outline:none;border-color:rgba(255,212,71,0.7);}

/* Scramble team assignment — tap to toggle */
.scr-player-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;margin-bottom:4px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.07);transition:background .12s;}
.scr-player-row:last-child{margin-bottom:0;}
.scr-player-name{font-size:12px;font-weight:bold;flex:1;font-family:'Courier New',monospace;letter-spacing:.3px;color:rgba(255,255,255,0.6);}
.scr-team-toggle{display:flex;gap:5px;flex-shrink:0;}
.scr-team-btn{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;background:transparent;transition:all .12s;padding:0;flex-shrink:0;}
.scr-team-btn.blue{background:rgba(255,212,71,0.2);border-color:rgba(255,212,71,0.3);}
.scr-team-btn.blue.active{background:#ffd447;border-color:#ffd447;box-shadow:0 0 6px rgba(255,212,71,0.5);}
.scr-team-btn.red{background:rgba(192,57,43,0.2);border-color:rgba(192,57,43,0.3);}
.scr-team-btn.red.active{background:#e74c3c;border-color:#e74c3c;box-shadow:0 0 6px rgba(192,57,43,0.5);}
.scr-player-row.blue{background:rgba(255,212,71,0.06);border-color:rgba(255,212,71,0.25);}
.scr-player-row.blue .scr-player-name{color:#ffd447;}
.scr-player-row.red{background:rgba(192,57,43,0.08);border-color:rgba(192,57,43,0.3);}
.scr-player-row.red .scr-player-name{color:#e74c3c;}
.team-card{border-radius:8px;padding:10px 10px 8px;flex:1;}
.team-card.a{border-left:3px solid rgba(255,212,71,0.6);background:rgba(255,212,71,0.04);}
.team-card.b{border-left:3px solid rgba(192,57,43,0.6);background:rgba(192,57,43,0.05);}
.team-card-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.55);margin-bottom:4px;}
.team-card.b .team-card-label{color:rgba(192,57,43,0.8);}
.team-card-names{font-size:12px;font-weight:bold;color:#fff;margin-bottom:6px;line-height:1.4;}
#scrambleTeamsBlock{display:flex;gap:8px;margin-bottom:8px;}
#scrambleTeamsBlock.hidden{display:none;}
.vspar-row{text-align:center;font-family:'Courier New',monospace;font-size:11px;font-weight:bold;margin-top:4px;min-height:14px;}
.vspar-under{color:#2ecc71;} .vspar-over{color:#ff6b6b;} .vspar-even{color:rgba(255,255,255,0.4);}
.set-teams-btn{width:100%;padding:8px;border:1px solid rgba(255,212,71,0.4);border-radius:8px;font-size:13px;font-weight:bold;background:rgba(255,212,71,0.07);color:#ffd447;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;margin-top:6px;}
.set-teams-btn:active{background:rgba(255,212,71,0.14);}
.big-score-input{width:100%;padding:9px 6px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#ffd447;font-size:20px;font-weight:bold;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;text-align:center;-webkit-appearance:none;box-sizing:border-box;}
.big-score-input.b-team{border-color:rgba(192,57,43,0.3);border-bottom-color:rgba(192,57,43,0.5);color:#e74c3c;}
.big-score-input:focus{outline:none;border-color:rgba(255,212,71,0.7);}
.big-score-input.b-team:focus{border-color:rgba(192,57,43,0.8);}

/* Stroke mode toggle */
.stroke-mode-toggle{display:flex;gap:6px;margin-bottom:8px;}
.smode-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 6px;border-radius:8px;border:1px solid rgba(255,212,71,0.15);background:rgba(0,0,0,0.3);color:rgba(255,255,255,0.35);cursor:pointer;font-family:'Georgia','Times New Roman',serif;transition:all .15s;-webkit-user-select:none;}
.smode-btn:active{transform:scale(0.97);}
.smode-btn.active{background:rgba(255,212,71,0.1);border-color:rgba(255,212,71,0.6);color:#ffd447;box-shadow:0 0 10px rgba(255,212,71,0.1);}
.smode-btn-title{font-size:11px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;}
.smode-btn-sub{font-size:9px;opacity:.65;letter-spacing:.3px;}

/* Confirm overlay */
.confirm-overlay{display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 24px 110px;text-align:center;}
.confirm-overlay.visible{display:flex;}
.confirm-icon{font-size:48px;margin-bottom:16px;}
.confirm-title{font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;margin-bottom:8px;}
.confirm-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:20px;}
.confirm-result{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:12px 16px;width:100%;max-width:360px;margin-bottom:24px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px;}
.result-row:last-child{border-bottom:none;}
.result-name{color:#fff;font-weight:bold;}
.result-score{font-family:'Courier New',monospace;color:#ffd447;font-weight:bold;font-size:16px;}
.done-btn{width:100%;max-width:360px;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.done-btn:active{opacity:.85;}

nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#080f0a 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(14,26,18,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active{color:#ffd447;}

</style>
</head>
<body>

<div class="page-header">Start Game</div>

<div class="scroll-area">
<div style="width:100%;max-width:480px;margin:0 auto;">

  <!-- Card 1: Date & Course -->
  <div class="setup-section">
    <div class="setup-section-label">Date &amp; Course</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="date" class="name-input" id="roundDate" style="-webkit-appearance:none;color-scheme:dark;flex-shrink:0;width:140px;">
      <input type="text" class="name-input" id="courseInput" placeholder="Course Name" autocomplete="off" style="flex:1;min-width:0;">
    </div>
  </div>

  <!-- Card 2: Players -->
  <div class="setup-section">
    <div class="setup-section-label">Players</div>
    <div class="player-grid">
      <input class="name-input" id="p0" placeholder="Player 1">
      <input class="name-input" id="p1" placeholder="Player 2">
      <input class="name-input" id="p2" placeholder="Player 3">
      <input class="name-input" id="p3" placeholder="Player 4">
    </div>
  </div>

  <!-- Card 3: Game Formats -->
  <div class="setup-section" style="padding:8px 12px 10px;">
    <div class="setup-section-label" style="margin-bottom:8px;">Game Formats</div>
    <div class="format-chips" style="display:flex;gap:6px;">
      <div class="fmt-chip active" id="btn-stroke" onclick="toggleFormat('stroke')">
        <span class="fmt-chip-suit">♠</span>Stroke Play
      </div>
      <div class="fmt-chip" id="btn-stableford" onclick="toggleFormat('stableford')">
        <span class="fmt-chip-suit">♦</span>Stableford
      </div>
      <div class="fmt-chip" id="btn-scramble" onclick="toggleFormat('scramble')">
        <span class="fmt-chip-suit">♣♥</span>Scramble
      </div>
    </div>

    <!-- Stroke mode toggle (Stroke Play only) -->
    <div id="strokeModeBlock" style="margin-top:8px;">
      <div style="font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:6px;padding-top:8px;border-top:1px solid rgba(255,212,71,0.1);">Scoring</div>
      <div class="stroke-mode-toggle">
        <div class="smode-btn active" id="smode-post" onclick="setStrokeMode('post')">
          <div class="smode-btn-title">Post Round</div>
          <div class="smode-btn-sub">Enter final scores now</div>
        </div>
        <div class="smode-btn" id="smode-live" onclick="setStrokeMode('live')">
          <div class="smode-btn-title">Live</div>
          <div class="smode-btn-sub">Track hole by hole</div>
        </div>
      </div>
    </div>

    <!-- Team Format toggle (Stableford + Stroke only) -->
    <div id="teamFormatBlock" style="display:none;margin-top:8px;">
      <div style="padding-top:8px;border-top:1px solid rgba(255,212,71,0.1);display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="toggleTeamFormat()">
        <div id="teamFormatCheck" style="width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,212,71,0.4);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;"></div>
        <div>
          <div style="font-size:11px;font-weight:bold;color:rgba(255,212,71,0.75);letter-spacing:.5px;">Team Format (2v2)</div>
          <div style="font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px;">Assign players to teams</div>
        </div>
      </div>
    </div>

    <!-- Buy In (Stableford only) -->
    <div id="buyInBlock" style="display:none;margin-top:8px;">
      <div style="padding-top:8px;border-top:1px solid rgba(255,212,71,0.1);" class="row-setting" style="margin-bottom:0;">
        <span class="row-label">Buy In <span style="font-size:8px;opacity:.6;letter-spacing:.3px;text-transform:none;">per player</span></span>
        <div class="row-control">
          <span class="currency">$</span>
          <input type="number" class="num-input" id="buyInInput" min="0" step="1" placeholder="0" inputmode="decimal" style="width:80px;">
        </div>
      </div>
    </div>
  </div>

  <!-- Card 5: Players (changes per format) -->
  <div class="setup-section" id="settingsCard">
    <div class="setup-section-label">Players</div>
    <div id="settingsBody"></div>
  </div>

  <div id="startError" class="error-msg"></div>
  <button class="start-btn" id="startBtn" onclick="startGame()">Start</button>

</div>
</div>

<!-- Confirmation overlay -->
<div class="scroll-area confirm-overlay" id="confirmOverlay" style="flex-direction:column;align-items:center;padding-top:60px;">
  <div class="confirm-icon">⛳</div>
  <div class="confirm-title">Round Saved</div>
  <div class="confirm-sub" id="confirmSub"></div>
  <div class="confirm-result" id="confirmResult"></div>
  <button class="done-btn" onclick="resetToStart()">New Round</button>
</div>

<!-- Pill nav -->
<nav class="bottom-nav">
  <div class="nav-pill">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/><line x1="4" y1="14" x2="20" y2="14" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
      Rounds
    </a>
    <a class="nav-item active" href="start.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="8.5" r=".8" fill="currentColor" stroke="none"/><circle cx="14.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/></svg>
      Play
    </a>
    <a class="nav-item" href="caddy.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      Caddy
    </a>
    <a class="nav-item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      Stats
    </a>
  </div>
</nav>

<script>
const selectedFormats = new Set(['stroke']);
let strokeMode = 'post'; // 'post' | 'live'
let teamFormat = false;

function setStrokeMode(mode){
  strokeMode = mode;
  document.getElementById('smode-post').classList.toggle('active', mode === 'post');
  document.getElementById('smode-live').classList.toggle('active', mode === 'live');
  // show/hide score inputs in settings
  buildAndRenderSettings('stroke');
  document.getElementById('startBtn').textContent = 'Start';
}

// selectedFormats: 'stroke' | 'stableford' | 'scramble' — mutually exclusive. Default: stroke.
function toggleFormat(f){
  selectedFormats.clear();
  selectedFormats.add(f);
  ['stroke','stableford','scramble'].forEach(k=>{
    document.getElementById('btn-'+k).classList.toggle('active', selectedFormats.has(k));
  });
  if(f === 'scramble') teamFormat = false;
  updateCards();
}

function effectiveMode(){
  if(selectedFormats.has('scramble')) return 'scramble';
  if(selectedFormats.has('stableford')) return 'stableford';
  return 'stroke';
}

function toggleTeamFormat(){
  teamFormat = !teamFormat;
  const check = document.getElementById('teamFormatCheck');
  check.innerHTML = teamFormat ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#ffd447" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
  check.style.background = teamFormat ? 'rgba(255,212,71,0.15)' : '';
  if(!teamFormat) scrTeamAssignment = null;
  updateCards();
}

function formatLabel(){
  const m = effectiveMode();
  if(m === 'stableford') return 'Stableford';
  if(m === 'scramble') return 'Scramble';
  return 'Stroke Play';
}

function updateCards(){
  const m = effectiveMode();
  const isScramble = m === 'scramble';
  const isStroke = m === 'stroke';
  const isStableford = m === 'stableford';

  document.getElementById('settingsCard').style.pointerEvents='';
  document.getElementById('settingsCard').style.opacity='';
  document.getElementById('strokeModeBlock').style.display = isStroke ? '' : 'none';
  document.getElementById('teamFormatBlock').style.display = isStableford ? 'block' : 'none';
  document.getElementById('buyInBlock').style.display = isStableford ? 'block' : 'none';

  buildAndRenderSettings(m);

  if(isScramble){
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.remove('hidden');
  } else if(teamFormat){
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.remove('hidden');
  } else if(isStroke){
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.remove('hidden');
  } else {
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.remove('hidden');
  }
}

function buildAndRenderSettings(m){
  const useTeam = teamFormat && m === 'stableford';
  const renderMode = useTeam ? 'scramble' : m;
  document.getElementById('settingsBody').innerHTML = buildSettings(renderMode);
  const hideCard = (m === 'stableford' && !useTeam) || (m === 'stroke' && strokeMode === 'live' && !useTeam);
  document.getElementById('settingsCard').style.display = hideCard ? 'none' : '';
  document.querySelector('#settingsCard .setup-section-label').textContent = (m === 'scramble' || useTeam) ? 'Team Assignment' : 'Players';
}

function buildSettings(m){
  if(m === 'stroke'){
    if(strokeMode === 'live') return '';
    const playerRows = [0,1,2,3].map(i=>{
      const name = document.getElementById('p'+i)?.value.trim()||'';
      return name ? `<div class="stroke-grid">
        <input class="name-input" value="${esc(name)}" readonly style="opacity:.6;cursor:default;">
        <input type="number" class="score-input" id="sc${i}" placeholder="72" min="18" max="200" inputmode="numeric">
      </div>` : '';
    }).filter(Boolean);
    const scoreRows = playerRows.length
      ? `<div style="display:grid;grid-template-columns:1fr 64px;gap:6px;margin-bottom:4px;">
           <div class="col-header">Player</div><div class="col-header" style="text-align:center;">Score</div>
         </div>${playerRows.join('')}` : '';
    return scoreRows;
  }

  if(m === 'stableford'){
    return '';
  }

  if(m === 'scramble'){
    const names = [0,1,2,3].map(i=>document.getElementById('p'+i)?.value.trim()||'').filter(Boolean);
    const rows = names.length
      ? names.map((n,i)=>{
          const team = i < 2 ? 'blue' : 'red';
          return `<div class="scr-player-row ${team}" id="scrRow_${i}" data-name="${esc(n)}">
            <span class="scr-player-name">${esc(n)}</span>
            <div class="scr-team-toggle">
              <button class="scr-team-btn blue${team==='blue'?' active':''}" onclick="setScrPlayerTeam(${i},'blue')"></button>
              <button class="scr-team-btn red${team==='red'?' active':''}" onclick="setScrPlayerTeam(${i},'red')"></button>
            </div>
          </div>`;
        }).join('')
      : `<div style="font-size:12px;color:rgba(255,255,255,0.25);text-align:center;padding:12px 0;">Add players above</div>`;
    return `<div id="scrPlayerList">${rows}</div>`;
  }
  return '';
}

function getPlayers(){
  return ['p0','p1','p2','p3'].map(id=>document.getElementById(id).value.trim());
}

function startGame(){
  const errEl = document.getElementById('startError');
  errEl.style.display = 'none';
  const date = document.getElementById('roundDate').value;
  const course = document.getElementById('courseInput').value.trim();
  const m = effectiveMode();
  const players = getPlayers();
  const filledPlayers = players.filter(Boolean);

  // Handle team format: requires team assignment first (stableford only)
  if(teamFormat && m === 'stableford'){
    if(!scrTeamAssignment){ errEl.textContent='Please assign players to teams.'; errEl.style.display='block'; return; }
  }

  if(m === 'stroke' && strokeMode === 'live'){
    if(filledPlayers.length < 2){ errEl.textContent='Add at least 2 players.'; errEl.style.display='block'; return; }
    const setup = { game: 'stroke', course, date: date||null, players: filledPlayers, totalHoles: 18 };
    localStorage.setItem('pendingSetup', JSON.stringify(setup));
    window.location.href = 'round.html';
    return;
  }
  if(m === 'stroke'){ saveStrokeRound(); return; }
  if(m === 'scramble'){ saveScrambleRound(); return; }

  if(filledPlayers.length < 2){ errEl.textContent='Add at least 2 players.'; errEl.style.display='block'; return; }

  if(m === 'stableford'){
    const buyIn = parseFloat(document.getElementById('buyInInput')?.value) || 0;
    const setup = { game: 'stableford', course, date: date||null, players: filledPlayers, totalHoles: 18, buyIn: buyIn > 0 ? buyIn : null, teamAssignment: teamFormat ? scrTeamAssignment : null };
    localStorage.setItem('pendingSetup', JSON.stringify(setup));
    window.location.href = 'round.html';
    return;
  }
}

function saveStrokeRound(){
  const errEl = document.getElementById('startError');
  errEl.style.display = 'none';
  const date = document.getElementById('roundDate').value;
  const course = document.getElementById('courseInput').value.trim();
  const players = [0,1,2,3].map(i=>{
    const name = document.getElementById('p'+i)?.value.trim()||'';
    const score = parseInt(document.getElementById('sc'+i)?.value)||null;
    return name ? {name, score} : null;
  }).filter(Boolean);
  if(!players.length){ errEl.textContent='Enter at least one player name.'; errEl.style.display='block'; return; }
  const record = {
    id: Date.now(), game: 'stroke',
    date: new Date((date||new Date().toLocaleDateString('en-CA'))+'T12:00:00').toISOString(),
    course,
    players: players.map(p=>p.name),
    playerTotals: players.map(p=>p.score),
    handicaps: null, scoreHistory: null, holeParDist: null, holes: null
  };
  try{ const ex=JSON.parse(localStorage.getItem('gameHistory')||'[]'); ex.push(record); localStorage.setItem('gameHistory',JSON.stringify(ex)); }catch(e){}
  showConfirm(course, date,
    players.filter(p=>p.score!==null).sort((a,b)=>a.score-b.score).map((p,i)=>
      `<div class="result-row"><span class="result-name">${esc(p.name)}${i===0?' 🏆':''}</span><span class="result-score">${p.score}</span></div>`
    ).join('') || players.map(p=>`<div class="result-row"><span class="result-name">${esc(p.name)}</span><span class="result-score">—</span></div>`).join('')
  );
}

function showConfirm(course, date, rowsHtml){
  document.querySelector('.scroll-area:not(.confirm-overlay)').style.display='none';
  document.querySelector('.page-header').style.display='none';
  document.getElementById('confirmOverlay').classList.add('visible');
  const d = date ? new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  document.getElementById('confirmSub').textContent = (course||'Round')+(d?' · '+d:'');
  document.getElementById('confirmResult').innerHTML = rowsHtml;
}

function resetToStart(){
  document.querySelector('.scroll-area:not(.confirm-overlay)').style.display='';
  document.querySelector('.page-header').style.display='';
  document.getElementById('confirmOverlay').classList.remove('visible');
  scrTeamAssignment = null;
  strokeMode = 'post';
  setStrokeMode('post');
  teamFormat = false;
  const check = document.getElementById('teamFormatCheck');
  if(check){ check.innerHTML=''; check.style.background=''; }
  toggleFormat('stroke');
  document.getElementById('settingsCard').style.pointerEvents='';
  document.getElementById('settingsCard').style.opacity='';
  updateCards();
}

// ── Scramble ────────────────────────────────────────────────────────────────────────────
let scrTeamAssignment = null;

function setScrPlayerTeam(idx, team){
  const row = document.getElementById('scrRow_'+idx);
  if(!row) return;
  row.className = 'scr-player-row ' + team;
  row.querySelectorAll('.scr-team-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.classList.contains(team));
  });
  // auto-commit once every player has a team
  const rows = [...document.querySelectorAll('#scrPlayerList .scr-player-row')];
  const allAssigned = rows.length > 0 && rows.every(r => r.classList.contains('blue') || r.classList.contains('red'));
  if(allAssigned) setScrTeams();
}

function resetScrTeams(){
  scrTeamAssignment = null;
  document.getElementById('startBtn').classList.add('hidden');
}

function setScrTeams(){
  const errEl = document.getElementById('startError');
  const rows = [...document.querySelectorAll('#scrPlayerList .scr-player-row')];
  if(!rows.length){ errEl.textContent='Add at least 2 players above.'; errEl.style.display='block'; setTimeout(()=>errEl.style.display='none',2500); return; }
  const teamBlue = rows.filter(r=>r.classList.contains('blue')).map(r=>r.dataset.name).filter(Boolean);
  const teamRed  = rows.filter(r=>r.classList.contains('red')).map(r=>r.dataset.name).filter(Boolean);
  if(!teamBlue.length || !teamRed.length){ errEl.textContent='Each team needs at least one player.'; errEl.style.display='block'; setTimeout(()=>errEl.style.display='none',2500); return; }
  errEl.style.display='none';
  scrTeamAssignment = {a: teamBlue, b: teamRed};
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('startBtn').textContent = 'Start Round →';
}

function updateScrVsPar(){
  document.getElementById('scrVspA')?.classList.remove('vspar-under','vspar-over','vspar-even');
  if(document.getElementById('scrVspA')) document.getElementById('scrVspA').textContent='';
  if(document.getElementById('scrVspB')) document.getElementById('scrVspB').textContent='';
}

function saveScrambleRound(){
  const errEl = document.getElementById('startError');
  errEl.style.display='none';
  // collect current team state from rows
  const rows = [...document.querySelectorAll('#scrPlayerList .scr-player-row')];
  if(!rows.length){ errEl.textContent='Add at least 2 players.'; errEl.style.display='block'; return; }
  const teamA = rows.filter(r=>r.classList.contains('blue')).map(r=>r.dataset.name).filter(Boolean);
  const teamB = rows.filter(r=>r.classList.contains('red')).map(r=>r.dataset.name).filter(Boolean);
  if(!teamA.length || !teamB.length){ errEl.textContent='Each team needs at least one player.'; errEl.style.display='block'; return; }
  const date = document.getElementById('roundDate').value;
  const course = document.getElementById('courseInput').value.trim();
  const setup = {
    game: 'scramble',
    course, date: date||null,
    players: [...teamA, ...teamB],
    totalHoles: 18,
    scrTeams: { a: teamA, b: teamB }
  };
  localStorage.setItem('pendingSetup', JSON.stringify(setup));
  window.location.href = 'round.html';
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

['p0','p1','p2','p3'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', ()=>{
    const m = effectiveMode();
    if(m === 'stroke') buildAndRenderSettings('stroke');
    if(m === 'scramble'){
      scrTeamAssignment = null;
      document.getElementById('scrambleTeamsBlock').classList.add('hidden');
      document.getElementById('startBtn').classList.add('hidden');
      document.getElementById('settingsCard').style.pointerEvents='';
      document.getElementById('settingsCard').style.opacity='';
      buildAndRenderSettings('scramble');
    }
  });
});

(function(){
  const d = new Date();
  const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('roundDate').value = iso;
  updateCards();
})();
</script>
