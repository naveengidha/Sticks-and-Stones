<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#080f0a"/>
<title>Caddy</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#8B6914;
  --gold-dim:#a07840;--gold-faint:rgba(255,212,71,0.08);
  --accent:#ffd447;--text:#fff;--muted:rgba(255,255,255,0.45);
  --green-ok:#2ecc71;--red:#ff4d4d;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Georgia','Times New Roman',serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
input,button{font:inherit;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* ── Card texture ── */
:root{--texture:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px);}

/* ── Layout shell ── */
#shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── Page header ── */
.page-header{padding:14px 16px 10px;font-size:22px;font-weight:bold;color:var(--gold);letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;flex-shrink:0;text-align:center;}

/* ── Anchor bar (inline at top) ── */
.anchor-bar{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 12px;background:var(--bg);}
.anchor-card{display:flex;align-items:flex-start;gap:12px;flex:1;background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;padding:12px 16px;}
.anchor-bar .anchor-group{display:flex;flex-direction:column;align-items:center;flex:1;}
.anchor-bar .anchor-label{font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;}
.anchor-bar .anchor-row{display:flex;align-items:center;gap:4px;}
.anchor-bar .anchor-input{background:rgba(0,0,0,0.4);border:2px solid rgba(255,212,71,0.25);border-radius:8px;color:var(--text);font-size:18px;font-weight:700;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums;outline:none;width:70px;}
.anchor-bar .anchor-input:focus{border-color:rgba(255,212,71,0.6);}
.anchor-bar .anchor-input.error{border-color:var(--red);}
.anchor-bar .anchor-unit{font-size:11px;color:var(--muted);}
.anchor-bar .anchor-error{color:var(--red);font-size:9px;min-height:1em;text-align:center;margin:2px 0 0;}
.anchor-divider{width:1px;background:rgba(255,212,71,0.12);align-self:stretch;margin:4px 0;}

/* ── Inner tab bar (Carry / Wedge / Target) ── */
#inner-tabs{display:flex;margin:0 16px 4px;background:var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;overflow:hidden;flex-shrink:0;}
.itab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-dim);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-user-select:none;border:none;background:none;}
.itab.active{color:var(--gold);border-bottom:2px solid var(--gold);}


/* ── Screens ── */
.screen{display:none;flex-direction:column;flex:1;min-height:0;}
.screen.active{display:flex;}
.screen-header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:42px;flex-shrink:0;border-bottom:1px solid rgba(255,212,71,0.1);}
.screen-title{font-size:13px;font-weight:bold;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;}
.btn-ghost{background:none;color:var(--gold-dim);border:none;border-radius:6px;padding:8px;font-size:18px;cursor:pointer;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;}
.btn-ghost:hover{color:var(--gold);}

/* ── Carry table ── */
.carry-table-wrap{flex:1;overflow-y:auto;padding:12px 16px 130px;overscroll-behavior-y:auto;}
.carry-card{background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;overflow:hidden;}
table.carry-table{width:100%;border-collapse:collapse;font-size:14px;}
table.carry-table thead th{padding:8px 14px;text-align:left;font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-dim);border-bottom:1px solid rgba(255,212,71,0.15);background:rgba(0,0,0,0.2);}
table.carry-table thead th.col-r{text-align:right;}
table.carry-table tbody tr{border-bottom:1px solid rgba(255,212,71,0.06);cursor:pointer;transition:background .1s;}
table.carry-table tbody tr:last-child{border-bottom:none;}
table.carry-table tbody tr:hover,table.carry-table tbody tr:active{background:rgba(255,212,71,0.05);}
table.carry-table tbody tr.locked .col-club{color:var(--gold);}
table.carry-table td{padding:11px 14px;}
.col-club{font-weight:bold;font-size:14px;}
.col-adj{font-weight:bold;font-size:15px;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums;}
.lock-badge{font-size:9px;color:var(--gold);margin-left:4px;opacity:.7;}

/* ── Wedge table ── */
.wedge-wrap{flex:1;overflow-y:auto;padding:12px 16px 110px;overscroll-behavior-y:auto;}
.wedge-card{background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;overflow:hidden;}
table.wedge-table{width:100%;border-collapse:collapse;font-size:14px;}
table.wedge-table thead th{padding:8px 14px;text-align:right;font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-dim);border-bottom:1px solid rgba(255,212,71,0.15);background:rgba(0,0,0,0.2);}
table.wedge-table thead th:first-child{text-align:left;}
table.wedge-table tbody tr.wt-carry-row{border-bottom:none;}
table.wedge-table tbody tr.wt-roll-row{border-bottom:1px solid rgba(255,212,71,0.06);}
table.wedge-table tbody tr.wt-roll-row:last-child{border-bottom:none;}
table.wedge-table td{padding:12px 14px;}
table.wedge-table tr.wt-roll-row td{padding-top:0;padding-bottom:10px;}
.wt-name{font-weight:bold;font-size:15px;}
.wt-carry{text-align:right;font-weight:bold;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;width:54px;min-width:54px;}
.wt-roll{text-align:right;font-size:11px;font-weight:bold;color:var(--muted);font-variant-numeric:tabular-nums;}
.wt-roll-label{font-size:10px;color:var(--muted);opacity:.6;}

/* ── Target screen ── */
.target-input-row{display:flex;flex-direction:column;gap:10px;padding:12px 16px;flex-shrink:0;margin:12px 16px 0;background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;}
.stepper-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,212,71,0.08);border:1px solid rgba(255,212,71,0.25);color:var(--gold);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stepper-btn:active{background:rgba(255,212,71,0.18);}
.target-yardage{font-size:28px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;width:80px;text-align:center;background:rgba(0,0,0,0.4);border:2px solid rgba(255,212,71,0.3);border-radius:8px;padding:4px 8px;outline:none;}
.target-yardage:focus{border-color:var(--gold);}
.target-unit{font-size:13px;font-weight:bold;color:var(--muted);align-self:flex-end;padding-bottom:6px;}
.lie-row{display:flex;align-items:center;gap:5px;}
.lie-btn{flex:1;padding:7px 4px;border-radius:8px;border:1px solid rgba(255,212,71,0.2);background:transparent;color:rgba(255,212,71,0.45);font-size:11px;font-weight:bold;letter-spacing:.4px;cursor:pointer;font-family:'Georgia','Times New Roman',serif;transition:all .12s;}
.lie-btn.active{background:rgba(255,212,71,0.12);border-color:rgba(255,212,71,0.55);color:var(--gold);}
.expected-row{font-size:11px;color:rgba(255,212,71,0.5);letter-spacing:.4px;padding-top:8px;border-top:1px solid rgba(255,212,71,0.1);text-align:center;min-height:18px;}
.target-wrap{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:110px;margin-top:12px;overscroll-behavior-y:auto;}

/* ── Me / Profile modal ── */
.profile-label{font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;}
.profile-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);background:rgba(0,0,0,0.4);color:var(--text);font-size:16px;font-family:'Courier New',monospace;outline:none;box-sizing:border-box;}
.profile-input:focus{border-color:rgba(255,212,71,0.7);}
.profile-saved-note{text-align:center;font-size:11px;color:rgba(255,212,71,0.5);letter-spacing:.4px;margin-top:10px;min-height:16px;}
.target-card{background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.target-card.full{border-color:rgba(255,212,71,0.5);background:var(--texture),rgba(255,212,71,0.06);}
.target-card.flight{border-color:rgba(46,180,80,0.4);background:var(--texture),rgba(46,180,80,0.05);}
.target-card.bomb{border-color:rgba(255,77,77,0.4);background:var(--texture),rgba(255,77,77,0.04);}
.tc-left{display:flex;flex-direction:column;gap:5px;}
.tc-club{font-weight:bold;font-size:16px;}
.tt-badge{display:inline-block;margin-top:2px;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.tt-badge.full{background:rgba(255,212,71,0.15);color:var(--gold);border:1px solid rgba(255,212,71,0.35);}
.tt-badge.flight{background:rgba(46,180,80,0.15);color:#2eb450;border:1px solid rgba(46,180,80,0.35);}
.tt-badge.bomb{background:rgba(255,77,77,0.12);color:#ff6464;border:1px solid rgba(255,77,77,0.35);}
.tc-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.tc-adj{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
.tc-roll{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.tc-diff{font-size:13px;font-variant-numeric:tabular-nums;}
.tc-diff.over{color:#ff6464;}
.tc-diff.under{color:var(--muted);}

/* ── Modal ── */
#modal-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center;z-index:500;}
#modal-scrim.open{display:flex;}
.modal-sheet{width:100%;max-width:480px;background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.25);border-radius:20px 20px 0 0;padding:0 0 110px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid rgba(255,212,71,0.12);}
.modal-title{font-size:15px;font-weight:bold;color:var(--gold);}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:16px;}
.modal-hint{font-size:13px;color:var(--muted);}
.stepper-row{display:flex;align-items:center;justify-content:center;gap:12px;}
.modal-num-input{width:110px;text-align:right;font-size:28px;font-weight:700;background:rgba(0,0,0,0.4);border:2px solid rgba(255,212,71,0.25);border-radius:8px;color:var(--text);padding:8px 10px;font-variant-numeric:tabular-nums;outline:none;}
.modal-num-input:focus{border-color:var(--gold);}
.modal-unit{font-size:13px;color:var(--muted);font-weight:600;}
.modal-actions{display:flex;gap:10px;}
.modal-actions>*{flex:1;}
.mbtn-primary{background:linear-gradient(135deg,#8B6914,#ffd447,#8B6914);color:#0a0a00;border:none;border-radius:8px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;}
.mbtn-secondary{background:transparent;color:#a07840;border:1px solid rgba(255,212,71,0.3);border-radius:8px;padding:12px 16px;font-weight:600;font-size:13px;cursor:pointer;min-height:44px;}
.mbtn-danger{background:transparent;color:#ff6464;border:1px solid rgba(255,77,77,0.35);border-radius:8px;padding:12px 16px;font-weight:700;font-size:13px;cursor:pointer;min-height:44px;}

/* ── Pill nav ── */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#080f0a 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(14,26,18,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active,.nav-item:active{color:#ffd447;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;}
.nav-center svg{width:36px;height:36px;}

/* ── Dispersion ── */
.disp-stab{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,212,71,0.18);background:transparent;color:var(--gold-dim);font-size:11px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .12s;}
.disp-stab.active{background:rgba(255,212,71,0.1);border-color:rgba(255,212,71,0.5);color:var(--gold);}
.disp-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid rgba(255,212,71,0.18);background:transparent;color:var(--gold-dim);font-size:11px;font-weight:bold;letter-spacing:.4px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .12s;}
.disp-chip.active{background:rgba(255,212,71,0.12);border-color:rgba(255,212,71,0.55);color:var(--gold);}
.disp-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
#disp-view-log{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:0;}
#disp-view-map{flex:1;display:flex;flex-direction:column;min-height:0;}
</style>
</head>
<body>

<!-- ══ MAIN APP ══ -->
<div id="shell">
  <div id="content">

    <div class="page-header" style="display:flex;align-items:center;justify-content:center;position:relative;">
      <span>Club Caddy</span>
      <button onclick="openProfile()" style="position:absolute;right:16px;background:none;border:none;color:rgba(255,212,71,0.45);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;" aria-label="Profile settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Anchor inputs -->
    <div class="anchor-bar">
      <div class="anchor-card">
        <div class="anchor-group">
          <label class="anchor-label">Driver</label>
          <div class="anchor-row">
            <input class="anchor-input" id="input-driver" type="number" inputmode="numeric" value="210" min="1" max="999"/>
            <span class="anchor-unit">yds</span>
          </div>
          <p class="anchor-error" id="err-driver"></p>
        </div>
        <div class="anchor-divider"></div>
        <div class="anchor-group">
          <label class="anchor-label">5 Iron</label>
          <div class="anchor-row">
            <input class="anchor-input" id="input-5i" type="number" inputmode="numeric" value="160" min="1" max="999"/>
            <span class="anchor-unit">yds</span>
          </div>
          <p class="anchor-error" id="err-5i"></p>
        </div>
      </div>
    </div>

    <!-- Inner tabs -->
    <div id="inner-tabs">
      <button class="itab active" data-tab="calculator">Carry</button>
      <button class="itab" data-tab="wedge">Wedge</button>
      <button class="itab" data-tab="target">Target</button>
      <button class="itab" data-tab="dispersion">Shots</button>
    </div>

    <!-- Screen: Carry Calculator -->
    <div class="screen active" id="screen-calculator">
      <div class="carry-table-wrap">
        <div class="carry-card">
          <table class="carry-table">
            <thead><tr>
              <th>Club</th>
              <th class="col-r">Carry</th>
            </tr></thead>
            <tbody id="carry-body"></tbody>
          </table>
          <button onclick="openAddClubModal()" style="width:100%;background:none;border:1px dashed rgba(255,212,71,0.3);color:rgba(255,212,71,0.6);font-size:13px;padding:10px;border-radius:8px;cursor:pointer;margin-top:10px;letter-spacing:.5px;font-family:inherit;">+ Add Club</button>
        </div>
      </div>
    </div>

    <!-- Screen: Wedge Matrix -->
    <div class="screen" id="screen-wedge">
      <div class="wedge-wrap">
        <div class="wedge-card">
          <table class="wedge-table">
            <thead><tr>
              <th>Club</th><th>Full</th><th>¾</th><th>½</th>
            </tr></thead>
            <tbody id="wedge-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Screen: Target Distance -->
    <div class="screen" id="screen-target">
      <div class="target-input-row">
        <div style="display:flex;align-items:center;gap:14px;justify-content:center;">
          <button class="stepper-btn" id="target-minus">−</button>
          <input class="target-yardage" id="target-display" type="number" inputmode="numeric" min="1" max="999" value="150"/>
          <span class="target-unit">yds</span>
          <button class="stepper-btn" id="target-plus">+</button>
        </div>
        <div class="lie-row">
          <button class="lie-btn active" data-lie="fairway">Fairway</button>
          <button class="lie-btn" data-lie="rough">Rough</button>
          <button class="lie-btn" data-lie="sand">Sand</button>
        </div>
        <div class="expected-row" id="expected-row"></div>
      </div>
      <div class="target-wrap" id="target-body"></div>
    </div>

    <!-- Screen: Me / Profile — removed; now a modal sheet -->

    <!-- Screen: Shot Dispersion -->
    <div class="screen" id="screen-dispersion" style="position:relative;">
      <!-- Static sub-view toggle -->
      <div style="display:flex;gap:8px;padding:10px 16px 8px;flex-shrink:0;">
        <button class="disp-stab active" data-view="log">Log Shot</button>
        <button class="disp-stab" data-view="map">View Map</button>
      </div>

    <!-- Club popup: centered overlay between the two maps -->
    <div id="disp-club-popup" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:#0e1a12;border:1px solid rgba(255,212,71,0.35);border-radius:10px;padding:8px;box-shadow:0 4px 24px rgba(0,0,0,0.7);min-width:140px;max-height:220px;overflow-y:auto;">
      <div id="disp-club-popup-list" style="display:flex;flex-direction:column;gap:4px;"></div>
    </div>

    <div class="disp-wrap">
        <!-- Log Shot sub-view -->
        <div id="disp-view-log">
          <!-- Canvases: two equal columns, stretch to fill available height -->
          <div id="disp-canvas-row" style="display:flex;gap:10px;padding:0 16px 110px;">

            <!-- Approach column -->

<script>
// ── Constants ────────────────────────────────────────────────────
const CLUBS = [
  { id:'driver', label:'Driver' },
  { id:'5w',     label:'5 Wood' },
  { id:'4h',     label:'4 Hybrid' },
  { id:'5i',     label:'5 Iron' },
  { id:'6i',     label:'6 Iron' },
  { id:'7i',     label:'7 Iron' },
  { id:'8i',     label:'8 Iron' },
  { id:'9i',     label:'9 Iron' },
  { id:'pw',     label:'PW' },
  { id:'aw',     label:'AW' },
  { id:'sw',     label:'SW' },
];
const SPEC = { driver:215,'5w':198,'4h':183,'5i':160,'6i':145,'7i':135,'8i':125,'9i':110,pw:100,aw:88,sw:72 };
const WEDGE_CLUBS = ['pw','aw','sw'];
const SWING_MULT  = [1.00, 0.83, 0.65];
// ── State ────────────────────────────────────────────────────────
const state = { isSetupComplete:false, anchors:null, carries:{}, locked:{}, targetYds:150, customClubs:[], hiddenClubs:[], lie:'fairway' };

function loadState() {
  try { const s = JSON.parse(localStorage.getItem('club-caddy-v3')||'null'); if(s) Object.assign(state,s); if(!state.customClubs) state.customClubs=[]; if(!state.hiddenClubs) state.hiddenClubs=[]; if(!state.lie) state.lie='fairway'; } catch(e){}
}
function saveState() {
  const { isSetupComplete,anchors,carries,locked,targetYds,customClubs,hiddenClubs,lie } = state;
  localStorage.setItem('club-caddy-v3', JSON.stringify({ isSetupComplete,anchors,carries,locked,targetYds,customClubs,hiddenClubs,lie }));
}

// ── Profile ───────────────────────────────────────────────────────
function loadProfile(){
  try { return JSON.parse(localStorage.getItem('playerProfile')||'null'); } catch(e){ return null; }
}
function saveProfile(){
  const name = document.getElementById('profile-name').value.trim();
  const hcpRaw = parseFloat(document.getElementById('profile-hcp').value);
  const hcp = isNaN(hcpRaw) ? null : Math.min(54, Math.max(0, hcpRaw));
  const profile = { name, handicapIndex: hcp };
  localStorage.setItem('playerProfile', JSON.stringify(profile));
  const note = document.getElementById('profile-saved-note');
  note.textContent = 'Saved ✓';
  setTimeout(()=>{ closeProfile(); }, 700);
  renderTarget();
}
// ── Profile modal ─────────────────────────────────────────────────
function openProfile(){
  const p = loadProfile();
  if(p){
    if(p.name) document.getElementById('profile-name').value = p.name;
    if(p.handicapIndex != null) document.getElementById('profile-hcp').value = p.handicapIndex;
  }
  document.getElementById('profile-saved-note').textContent = '';
  const scrim = document.getElementById('profile-scrim');
  scrim.style.display = 'flex';
}
function closeProfile(){
  document.getElementById('profile-scrim').style.display = 'none';
}
document.getElementById('profile-scrim').addEventListener('click', e=>{
  if(e.target === document.getElementById('profile-scrim')) closeProfile();
});

// ── Expected strokes ──────────────────────────────────────────────
// Rows: [dist, scratch, hcp10, hcp18, hcp28]
const EXP_TABLE = [
  [  50, 2.6, 2.8, 3.0, 3.3 ],
  [ 100, 2.8, 3.1, 3.4, 3.7 ],
  [ 150, 3.0, 3.4, 3.8, 4.2 ],
  [ 200, 3.3, 3.8, 4.3, 4.9 ],
  [ 250, 3.6, 4.2, 4.8, 5.5 ],
];
const LIE_PENALTY = { fairway:0, rough:0.3, sand:0.5 };
function expectedStrokes(yds, lie){
  const p = loadProfile();
  const hcp = (p && p.handicapIndex != null) ? p.handicapIndex : 18;
  // Clamp distance
  const d = Math.max(10, Math.min(300, yds));
  // Interpolate between table rows
  let lo = EXP_TABLE[0], hi = EXP_TABLE[EXP_TABLE.length-1];
  for(let i=0; i<EXP_TABLE.length-1; i++){
    if(d >= EXP_TABLE[i][0] && d <= EXP_TABLE[i+1][0]){ lo=EXP_TABLE[i]; hi=EXP_TABLE[i+1]; break; }
  }
  const t = lo[0]===hi[0] ? 0 : (d-lo[0])/(hi[0]-lo[0]);
  function interpRow(row){ return row[1] + t*(row[2]-row[1]); }
  // hcp brackets: 0, 10, 18, 28
  const HCP_BREAKS = [0, 10, 18, 28];
  function interpHcp(loRow, hiRow){
    const vals = [1,2,3,4].map((_,ci)=>loRow[ci+1]+(hiRow[ci+1]-loRow[ci+1])*t);
    const h = Math.min(54, Math.max(0, hcp));
    let bi = HCP_BREAKS.length-2;
    for(let i=0; i<HCP_BREAKS.length-1; i++){ if(h>=HCP_BREAKS[i]&&h<=HCP_BREAKS[i+1]){ bi=i; break; } }
    const ht = (HCP_BREAKS[bi+1]-HCP_BREAKS[bi])===0 ? 0 : (h-HCP_BREAKS[bi])/(HCP_BREAKS[bi+1]-HCP_BREAKS[bi]);
    return vals[bi] + (vals[bi+1]-vals[bi])*ht;
  }
  const base = interpHcp(lo, hi);
  const penalty = LIE_PENALTY[lie]||0;
  return Math.round((base + penalty) * 10) / 10;
}

// ── Math ─────────────────────────────────────────────────────────
function adjustedCarry(base) { return base; }
function extrapolate(driverCarry, fiveIronCarry) {
  const specGap=SPEC.driver-SPEC['5i'], userGap=driverCarry-fiveIronCarry;
  const aboveScale=userGap/specGap, belowScale=fiveIronCarry/SPEC['5i'];
  const result={};
  CLUBS.forEach(({id},i)=>{
    if(state.locked[id]){result[id]=state.carries[id];return;}
    if(i===0){result[id]=driverCarry;return;}
    if(i===3){result[id]=fiveIronCarry;return;}
    if(i<3) result[id]=driverCarry-Math.round((SPEC.driver-SPEC[id])*aboveScale);
    else    result[id]=fiveIronCarry-Math.round((SPEC['5i']-SPEC[id])*belowScale);
  });
  return result;
}

// ── Setup ─────────────────────────────────────────────────────────
const inputDriver=document.getElementById('input-driver'), input5i=document.getElementById('input-5i');
const errDriver=document.getElementById('err-driver'), err5i=document.getElementById('err-5i');

function updateFromAnchors() {
  const d=parseInt(inputDriver.value,10), f=parseInt(input5i.value,10);
  const dOk=!isNaN(d)&&d>0, fOk=!isNaN(f)&&f>0, crossOk=dOk&&fOk&&d>f;
  inputDriver.classList.toggle('error', inputDriver.value&&!dOk);
  input5i.classList.toggle('error', input5i.value&&(!fOk||(dOk&&fOk&&d<=f)));
  errDriver.textContent = inputDriver.value&&!dOk?'Invalid':'';
  err5i.textContent = input5i.value&&!fOk?'Invalid':(fOk&&dOk&&d<=f)?'< Driver':'';
  if(crossOk){
    state.anchors={driver:d,fiveIron:f};
    state.carries=extrapolate(d,f);
    saveState(); renderAll();
  }
}
function initSetupListeners() {
  [inputDriver,input5i].forEach(el=>el.addEventListener('input',updateFromAnchors));
  updateFromAnchors();
}

// ── Render ────────────────────────────────────────────────────────
function renderCarryTable() {
  const hidden = state.hiddenClubs||[];

  // Build all rows with their carry value for sorting
  let allRows = [];
  CLUBS.filter(({id})=>!hidden.includes(id)).forEach(({id,label})=>{
    const base=state.carries[id]??SPEC[id];
    const lockMark=state.locked[id]?'<span class="lock-badge">●</span>':'';
    allRows.push({
      carry: adjustedCarry(base),
      html: `<tr class="${state.locked[id]?'locked':''}" data-id="${id}">
        <td class="col-club">${label}${lockMark}</td>
        <td class="col-adj">${adjustedCarry(base)}</td>
      </tr>`,
      type:'standard', id
    });
  });
  (state.customClubs||[]).forEach((c,i)=>{
    allRows.push({
      carry: c.carry,
      html: `<tr data-custom="${i}">
        <td class="col-club">${c.label}</td>
        <td class="col-adj">${c.carry}</td>
      </tr>`,
      type:'custom', idx:i
    });
  });
  allRows.sort((a,b)=>b.carry-a.carry);

  const restoreRow = hidden.length ? `<tr><td colspan="2" style="text-align:center;padding:10px 0;"><button onclick="restoreAllClubs()" style="background:none;border:none;color:rgba(255,212,71,0.5);font-size:12px;cursor:pointer;letter-spacing:.4px;font-family:inherit;">↩ Restore ${hidden.length} removed club${hidden.length>1?'s':''}</button></td></tr>` : '';
  document.getElementById('carry-body').innerHTML = allRows.map(r=>r.html).join('') + restoreRow;
  document.querySelectorAll('#carry-body tr[data-id]').forEach(row=>
    row.addEventListener('click',()=>openClubModal(row.dataset.id))
  );
  document.querySelectorAll('#carry-body tr[data-custom]').forEach(row=>
    row.addEventListener('click',()=>openEditCustomClub(parseInt(row.dataset.custom)))
  );
}
const SWING_LABELS=['Full','¾','½'];
function renderWedge() {
  const customWedges = (state.customClubs||[]).filter(c=>c.isWedge);
  const builtinRows = WEDGE_CLUBS.map(id=>{
    const base=state.carries[id]??SPEC[id], label=CLUBS.find(c=>c.id===id).label;
    const carries=SWING_MULT.map(s=>Math.round(base*s));
    return `<tr class="wt-carry-row"><td class="wt-name">${label}</td>${carries.map(c=>`<td class="wt-carry">${c}</td>`).join('')}</tr>`+
           `<tr class="wt-roll-row"><td class="wt-roll-label">roll</td>${carries.map(c=>`<td class="wt-roll">+${Math.round(c*0.08)}</td>`).join('')}</tr>`;
  });
  const customRows = customWedges.map(c=>{
    const carries=SWING_MULT.map(s=>Math.round(c.carry*s));
    return `<tr class="wt-carry-row"><td class="wt-name">${c.label}</td>${carries.map(v=>`<td class="wt-carry">${v}</td>`).join('')}</tr>`+
           `<tr class="wt-roll-row"><td class="wt-roll-label">roll</td>${carries.map(v=>`<td class="wt-roll">+${Math.round(v*0.08)}</td>`).join('')}</tr>`;
  });
  document.getElementById('wedge-body').innerHTML=[...builtinRows,...customRows].join('');
}
function wedgeCarry(id,si){
  const base=state.carries[id]??SPEC[id];
  return Math.round(base*SWING_MULT[si]);
}
function renderTarget(){
  const t=state.targetYds, input=document.getElementById('target-display');
  if(input&&document.activeElement!==input) input.value=t;
  const lie = state.lie || 'fairway';

  // Convert actual distance to plays-like fairway distance
  const LIE_MULT = { fairway:1.0, rough:0.85, sand:0.75 };
  const playsLike = lie==='fairway' ? t : Math.round(t / LIE_MULT[lie]);

  // Expected strokes — use plays-like distance for base, add lie penalty on top
  const expEl = document.getElementById('expected-row');
  if(expEl){
    const exp = expectedStrokes(playsLike, lie);
    const p = loadProfile();
    const hcpNote = (p && p.handicapIndex != null) ? ` · HCP ${p.handicapIndex}` : '';
    const playsNote = lie!=='fairway' ? ` (plays like ${playsLike} yds)` : '';
    expEl.textContent = `Expected: ${exp} strokes${playsNote}${hcpNote}`;
  }

  // Club matching uses playsLike against fairway carries.
  // isWedge gates on actual yardage. Driver is excluded from suggestions — tee club only.
  const pwFull = state.carries['pw']??SPEC['pw'];
  const isWedge = t <= pwFull;
  let picks;
  if(isWedge){
    const candidates=[];
    WEDGE_CLUBS.forEach(id=>{
      const label=CLUBS.find(c=>c.id===id).label;
      SWING_MULT.forEach((_,si)=>{
        const adj=Math.round((state.carries[id]??SPEC[id])*SWING_MULT[si]);
        const roll=Math.round(adj*0.08), total=adj+roll, diff=total-playsLike;
        candidates.push({label,swingLabel:SWING_LABELS[si],adj,roll,total,diff,absDiff:Math.abs(diff),id,si});
      });
    });
    (state.customClubs||[]).filter(c=>c.isWedge).forEach(c=>{
      SWING_MULT.forEach((_,si)=>{
        const adj=Math.round(c.carry*SWING_MULT[si]);
        const roll=Math.round(adj*0.08), total=adj+roll, diff=total-playsLike;
        candidates.push({label:c.label,swingLabel:SWING_LABELS[si],adj,roll,total,diff,absDiff:Math.abs(diff),id:c.label,si});
      });
    });
    const over=candidates.filter(c=>c.diff>=0);
    const full=over.length?over.reduce((a,b)=>a.diff<=b.diff?a:b):candidates.reduce((a,b)=>a.absDiff<=b.absDiff?a:b);
    const above=candidates.filter(c=>c.diff>full.diff);
    const flight=above.length?above.reduce((a,b)=>a.diff<=b.diff?a:b):null;
    const under=candidates.filter(c=>c.diff<0);
    const bomb=under.length?under.reduce((a,b)=>a.diff>=b.diff?a:b):null;
    picks=[
      flight&&{r:flight,type:'flight',badgeLabel:'Flight',swingLabel:flight.swingLabel},
      {r:full,type:'full',badgeLabel:'Full',swingLabel:full.swingLabel},
      bomb&&bomb!==full&&{r:bomb,type:'bomb',badgeLabel:'Bomb',swingLabel:bomb.swingLabel},
    ].filter(Boolean);
  } else {
    const allClubs=[
      ...CLUBS.filter(({id})=>!(state.hiddenClubs||[]).includes(id) && id!=='driver').map(({id,label})=>{const base=state.carries[id]??SPEC[id];return{label,base};}),
      ...(state.customClubs||[]).map(c=>({label:c.name,base:c.carry}))
    ];
    const rows=allClubs.map(({label,base})=>{
      const adj=base, roll=Math.round(adj*0.08);
      const total=adj+roll, diff=total-playsLike;
      return {label,adj,roll,total,diff,sign:diff>0?'+':'',cls:diff>0?'over':'under',absDiff:Math.abs(diff)};
    });
    const overRows=rows.filter(r=>r.diff>=0);
    const fullRow=overRows.length?overRows.reduce((a,b)=>a.diff<=b.diff?a:b):rows.reduce((a,b)=>a.absDiff<=b.absDiff?a:b);
    const fullIdx=rows.indexOf(fullRow);
    const flightRow=rows.slice(0,fullIdx).reverse().find(r=>r.diff>fullRow.diff)??null;
    const underRows=rows.filter(r=>r.diff<0);
    const bombRow=underRows.length?underRows.reduce((a,b)=>a.diff>=b.diff?a:b):null;
    picks=[
      flightRow&&{r:flightRow,type:'flight',badgeLabel:'Flight',swingLabel:null},
      {r:fullRow,type:'full',badgeLabel:'Full',swingLabel:null},
      bombRow&&bombRow!==fullRow&&{r:bombRow,type:'bomb',badgeLabel:'Bomb',swingLabel:null},
    ].filter(Boolean);
  }
  const sign=r=>r.diff>0?'+':'', cls=r=>r.diff>0?'over':'under';
  document.getElementById('target-body').innerHTML=picks.map(({r,type,badgeLabel,swingLabel})=>`
    <div class="target-card ${type}">
      <div class="tc-left">
        <span class="tc-club">${swingLabel?`${swingLabel} ${r.label}`:r.label}</span>
        <span class="tt-badge ${type}">${badgeLabel}</span>
      </div>
      <div class="tc-right">
        <span class="tc-adj">${r.adj} yds</span>
        <span class="tc-roll">+${r.roll} roll</span>
        <span class="tc-diff ${cls(r)}">${sign(r)}${r.diff} vs target</span>
      </div>
    </div>`).join('');
}

// ── Shot Dispersion ───────────────────────────────────────────────
const DISP_COLORS = ['#ffd447','#4db87a','#e07b39','#6ab3d4','#c97bd4','#e05c6a','#a0c44d'];
const APPROACH_W = 140, APPROACH_H = 210;
const LANDING_W  = 140, LANDING_H  = 160;
const MAP_W      = 300, MAP_H      = 300;

function dispLogCanvasSize(){
  const row = document.getElementById('disp-canvas-row');
  if(!row) return {aw:APPROACH_W, ah:APPROACH_H, lw:LANDING_W, lh:LANDING_H};
  const halfW = Math.floor((row.clientWidth - 48) / 2);
  // Landing canvas: square (green is circular)
  const lh = halfW;
  // Approach canvas: taller to account for status(14) + gap(5) + checkmark(44) + gap(5) below landing
  // so both canvases share the same bottom edge
  const ah = lh + 14 + 5 + 44 + 5;
  return { aw: halfW, ah, lw: halfW, lh };
}

function dispMapCanvasSize(){
  const wrap = document.getElementById('disp-map-wrap');
  if(!wrap) return {mw:MAP_W, mh:MAP_H};
  const mw = Math.min(wrap.clientWidth - 32, wrap.clientHeight - 8);
  return { mw: Math.max(mw, 120), mh: Math.max(mw, 120) };
}

let dispInitialized = false;
let dispSelectedClub = null;
let dispApproachPt = null;  // {x,y} normalized
let dispLandingPt  = null;
let dispActiveFilter = 'all';
let dispRenderedDots = []; // [{cx,cy,shot}] for hit-testing on map

function dispLoad(){ try{ return JSON.parse(localStorage.getItem('shotDispersion')||'[]'); }catch(e){ return []; } }
function dispSave(arr){ localStorage.setItem('shotDispersion', JSON.stringify(arr)); }

function dispAllClubs(){
  return [
    ...CLUBS.filter(({id}) => !(state.hiddenClubs||[]).includes(id)),
    ...(state.customClubs||[]).map(c => ({id:'custom_'+c.label, label:c.label}))
  ];
}
function dispClubLabel(id){
  const c = dispAllClubs().find(c=>c.id===id);
  return c ? c.label : id;
}
function dispClubColor(id){
  const clubs = dispAllClubs();
  const idx = clubs.findIndex(c=>c.id===id);
  return DISP_COLORS[idx < 0 ? 0 : idx % DISP_COLORS.length];
}

// ── Canvas setup (retina-aware) ───────────────────────────────────
function dispSetupCanvas(canvas, cssW, cssH){
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return ctx;
}

// ── Approach distance helpers ─────────────────────────────────────
const DISP_MAX_YARDS = 250;
function dispYToYards(normY){ return Math.round(normY * DISP_MAX_YARDS / 5) * 5; }
function dispYardsToNormY(yds){ return yds / DISP_MAX_YARDS; }

// ── Draw approach canvas (fairway corridor + distance markers) ────
function dispDrawApproach(canvas, dot){
  const {aw, ah} = dispLogCanvasSize();
  const ctx = dispSetupCanvas(canvas, aw, ah);
  const w = aw, h = ah;
  // rough background
  ctx.fillStyle = '#122618';
  ctx.fillRect(0, 0, w, h);
  // fairway corridor (center 50%)
  const fw = w * 0.5, fx = (w - fw) / 2;
  ctx.fillStyle = '#1e4d2e';
  ctx.fillRect(fx, 0, fw, h);
  // fairway lighter stripe
  ctx.fillStyle = 'rgba(46,140,70,0.18)';
  ctx.fillRect(fx + fw*0.2, 0, fw*0.6, h);
  // aim line
  ctx.setLineDash([4,6]);
  ctx.strokeStyle = 'rgba(255,212,71,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
  ctx.setLineDash([]);
  // distance marker lines: 50, 100, 150, 200, 250 yds (top=close, bottom=far)
  const markerYards = [50, 100, 150, 200, 250];
  ctx.font = 'bold 9px Georgia';
  ctx.textBaseline = 'middle';
  markerYards.forEach(yds => {
    const ny = dispYardsToNormY(yds);
    const py = ny * h;
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(255,212,71,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,212,71,0.55)';
    ctx.textAlign = 'left';
    ctx.fillText(yds+'y', 3, py - 5);
  });
  // "you" marker at bottom (farthest from green)
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(w/2 - 8, h - 10, 16, 3);
  // dot
  if(dot){
    const px = dot.x * w, py = dot.y * h;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2);
    ctx.fillStyle = '#ffd447';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ── Draw landing/green canvas ─────────────────────────────────────
function dispDrawGreen(canvas, dot, cssW, cssH){
  if(!cssW || !cssH){ const s = dispLogCanvasSize(); cssW = s.lw; cssH = s.lh; }
  const ctx = dispSetupCanvas(canvas, cssW, cssH);
  const w = cssW, h = cssH;
  // background (fringe)
  ctx.fillStyle = '#122618';
  ctx.fillRect(0, 0, w, h);
  // fringe ellipse
  ctx.beginPath();
  ctx.ellipse(w/2, h/2, w*0.46, h*0.44, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(30,100,50,0.5)';
  ctx.fill();
  // green
  ctx.beginPath();
  ctx.ellipse(w/2, h/2, w*0.37, h*0.35, 0, 0, Math.PI*2);
  ctx.fillStyle = '#1e4d2e';
  ctx.fill();
  // flag pin
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(w*0.5, h*0.18); ctx.lineTo(w*0.5, h*0.42); ctx.stroke();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.moveTo(w*0.5, h*0.18); ctx.lineTo(w*0.5+12, h*0.23); ctx.lineTo(w*0.5, h*0.28); ctx.fill();
  // dot
  if(dot){
    const px = dot.x * w, py = dot.y * h;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2);
    ctx.fillStyle = '#ffd447';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ── Draw full map (view tab) ──────────────────────────────────────
function dispDrawMap(shots){
  const canvas = document.getElementById('disp-map-canvas');
  if(!canvas) return;
  const {mw, mh} = dispMapCanvasSize();
  const ctx = dispSetupCanvas(canvas, mw, mh);
  const w = mw, h = mh;
  dispDrawGreen(canvas, null, mw, mh);
  // re-get ctx after dispDrawGreen re-setup (it calls dispSetupCanvas again)
  const ctx2 = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx2.save(); ctx2.setTransform(dpr,0,0,dpr,0,0);
  dispRenderedDots = [];
  shots.forEach((s, i) => {
    let px = s.landingX * w, py = s.landingY * h;
    // simple overlap nudge
    dispRenderedDots.forEach(d => {
      const dist = Math.hypot(px - d.cx, py - d.cy);
      if(dist < 16){ px += 12; }
    });
    const color = dispClubColor(s.club);
    ctx2.beginPath(); ctx2.arc(px, py, 7, 0, Math.PI*2);
    ctx2.fillStyle = color; ctx2.fill();
    ctx2.strokeStyle = '#fff'; ctx2.lineWidth = 1.2; ctx2.stroke();
    dispRenderedDots.push({cx: px, cy: py, shot: s, num: i+1});
  });
  ctx2.restore();
}

// ── Map canvas tap to show detail ────────────────────────────────
document.getElementById('disp-map-canvas').addEventListener('pointerdown', e=>{
  const canvas = e.currentTarget;
  const rect = canvas.getBoundingClientRect();
  const {mw, mh} = dispMapCanvasSize();
  const scaleX = mw / rect.width;
  const scaleY = mh / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;
  const hit = dispRenderedDots.find(d => Math.hypot(mx - d.cx, my - d.cy) < 14);
  const popup = document.getElementById('disp-dot-popup');
  if(hit){
    popup.innerHTML = `<strong style="color:var(--gold);">${dispClubLabel(hit.shot.club)}</strong>&nbsp;·&nbsp;${hit.shot.distanceYards > 0 ? hit.shot.distanceYards+'y' : '—'}`;
    // position above the dot in canvas-relative px
    const dotX = rect.left + (hit.cx / scaleX);
    const dotY = rect.top  + (hit.cy / scaleY);
    const wrap = document.getElementById('disp-map-wrap');
    const wrapRect = wrap.getBoundingClientRect();
    popup.style.display = 'block';
    const pw = popup.offsetWidth || 120;
    const left = Math.max(4, Math.min(dotX - wrapRect.left - pw/2, wrapRect.width - pw - 4));
    const top  = dotY - wrapRect.top - 44; // above the dot
    popup.style.left = left + 'px';
    popup.style.top  = Math.max(4, top) + 'px';
  } else {
    popup.style.display = 'none';
  }
});

// ── Save shot ─────────────────────────────────────────────────────
document.getElementById('disp-save-btn').addEventListener('click', ()=>{
  if(!dispSelectedClub || !dispApproachPt || !dispLandingPt) return;
  const dist = dispYToYards(dispApproachPt.y);
  const shots = dispLoad();
  shots.push({ club: dispSelectedClub, distanceYards: dist, approachX: dispApproachPt.x, approachY: dispApproachPt.y, landingX: dispLandingPt.x, landingY: dispLandingPt.y });
  dispSave(shots);
  // reset
  dispApproachPt = null; dispLandingPt = null; dispSelectedClub = null;
  dispHideClubPopup();
  dispDrawApproach(document.getElementById('disp-approach-canvas'), null);
  dispDrawGreen(document.getElementById('disp-landing-canvas'), null);
  document.getElementById('disp-approach-status').textContent = 'tap to place';
  document.getElementById('disp-landing-status').textContent  = 'tap to place';
  dispCheckSave();
  const msg = document.getElementById('disp-log-msg');
  msg.textContent = 'Shot logged ✓';
  setTimeout(()=>{ msg.textContent=''; }, 2000);
});

// ── Clear all shots ───────────────────────────────────────────────
document.getElementById('disp-clear-btn').addEventListener('click', ()=>{
  if(!confirm('Clear all logged shots?')) return;
  dispSave([]);
  dispActiveFilter = 'all';
  dispRenderMap();
});

// ── Activate dispersion tab ───────────────────────────────────────
function dispActivate(){
  // ensure log view is flex when active
  const logView = document.getElementById('disp-view-log');
  const mapView = document.getElementById('disp-view-map');
  const isMap = mapView.style.display !== 'none';
  if(!isMap) logView.style.display = 'flex';
  requestAnimationFrame(() => {
    if(!dispInitialized){
      dispInitialized = true;
      dispDrawApproach(document.getElementById('disp-approach-canvas'), null);
      dispDrawGreen(document.getElementById('disp-landing-canvas'), null);
    }
    if(isMap) dispRenderMap();
  });
}
</script>
