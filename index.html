<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sticks &amp; Stones">
<meta name="theme-color" content="#080f0a">
<style>html,body{background:#080f0a;}</style>
<title>Sticks &amp; Stones</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// Show splash once per session
if(!sessionStorage.getItem('splashSeen')){
  sessionStorage.setItem('splashSeen','1');
  window.location.replace('splash.html');
}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Georgia','Times New Roman',serif;background:#080f0a;margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;overscroll-behavior:none;}
.container{padding:16px 16px 0;width:100%;}
.logo{text-align:center;margin-bottom:8px;display:block;width:100%;}
.logo svg{margin:auto;display:block;}
h1{text-align:center;color:#ffd447;margin:0 0 4px;font-size:26px;letter-spacing:1px;font-family:'Georgia','Times New Roman',serif;}
h2{text-align:center;margin-top:0;color:#ffd447;letter-spacing:.5px;}
h3{text-align:center;margin-top:0;color:rgba(255,255,255,0.75);}
.subtitle{text-align:center;color:rgba(255,255,255,0.6);font-size:13px;margin:0 0 32px;}
.section-label{font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.5);margin-bottom:12px;text-align:center;}
.game-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px;}
.game-grid .game-badge{width:calc(25% - 8px);min-width:60px;}
.game-badge{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;-webkit-user-select:none;cursor:pointer;border:1px solid rgba(255,212,71,0.25);border-radius:14px;padding:8px 4px 8px;background:rgba(255,212,71,0.05);transition:border-color .15s,background .15s;}
.game-badge:hover,.game-badge:active{background:rgba(255,212,71,0.1);border-color:#ffd447;}
.game-badge:active .game-badge-icon{transform:scale(0.92);opacity:.85;}
.game-badge-icon{width:52%;aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .1s,opacity .1s;margin:4px 0 6px;}
.game-badge-label{font-size:10px;font-weight:bold;text-align:center;color:rgba(255,255,255,0.85);letter-spacing:.3px;line-height:1.2;max-width:100%;white-space:normal;padding:0 4px;margin-bottom:2px;}
.game-badge-desc{font-size:9px;text-align:center;color:rgba(255,255,255,0.7);line-height:1.3;padding:0 4px;}
.icon-f1{background:linear-gradient(160deg,#5a0000,#800000);}
.icon-banker{background:linear-gradient(160deg,#0d2a55,#1a3a6b);}
.icon-history{background:linear-gradient(160deg,#2e1e00,#4a3800);}
.icon-bag{background:linear-gradient(160deg,#1a0d00,#2a1a00);}
.icon-practice{background:linear-gradient(160deg,#0d1f0d,#1a2e1a);}
.icon-intel{background:linear-gradient(160deg,#061222,#0d1a2e);border:1px solid rgba(76,175,118,0.3);}
.icon-coming{background:#222;opacity:.5;}
.icon-caddy{background:linear-gradient(160deg,#0d2218,#1a3320);}
.icon-stableford{background:linear-gradient(160deg,#0d1a2a,#1a2a3a);}
.icon-scramble{background:linear-gradient(160deg,#061a0d,#0d2a1a);}
.icon-season{background:linear-gradient(160deg,#1a1a00,#2a2a00);}
.divider{border:none;border-top:1px solid rgba(255,212,71,0.35);margin:16px 0 0;}
.utility-link{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:12px;border-radius:8px;cursor:pointer;text-decoration:none;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);transition:background .15s,color .15s;-webkit-user-select:none;}
.utility-link:hover,.utility-link:active{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.75);}
.utility-link-icon{font-size:16px;flex-shrink:0;}
.utility-link-label{font-size:13px;font-weight:bold;letter-spacing:.3px;}
.stats-link{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-radius:10px;cursor:pointer;text-decoration:none;color:rgba(255,212,71,0.85);border:1px solid rgba(255,212,71,0.25);background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;transition:border-color .15s,color .15s;-webkit-user-select:none;}
.stats-link:hover,.stats-link:active{border-color:rgba(255,212,71,0.6);color:#ffd447;}
.stats-link-icon{font-size:22px;flex-shrink:0;}
.stats-link-label{font-size:14px;font-weight:bold;letter-spacing:.3px;}
.stats-link-arrow{color:rgba(255,212,71,0.35);font-size:20px;margin-left:auto;}
.badge{display:inline-block;font-size:9px;font-weight:bold;background:#ffd447;color:#222;padding:2px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;letter-spacing:.5px;}
.active-season-card{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:10px;cursor:pointer;text-decoration:none;color:#fff;border:1px solid rgba(255,212,71,0.25);background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;transition:border-color .15s;}
.active-season-card:hover,.active-season-card:active{border-color:rgba(255,212,71,0.6);}
.asc-icon{font-size:18px;flex-shrink:0;}
.asc-body{flex:1;min-width:0;}
.asc-name{font-size:13px;font-weight:bold;color:#ffd447;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asc-meta{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.asc-leader{font-size:11px;color:rgba(255,212,71,0.6);margin-top:2px;}
.asc-arrow{color:rgba(255,212,71,0.35);font-size:18px;flex-shrink:0;}
.active-seasons-label{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin:16px 0 8px;}
.arc{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:10px;cursor:pointer;text-decoration:none;color:#fff;border:1px solid rgba(76,200,120,0.35);background:repeating-linear-gradient(45deg,rgba(76,200,120,0.03) 0,rgba(76,200,120,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(76,200,120,0.03) 0,rgba(76,200,120,0.03) 1px,transparent 1px,transparent 10px),#0a1a0f;transition:border-color .15s;}
.arc:hover,.arc:active{border-color:rgba(76,200,120,0.7);}
.arc-icon{font-size:20px;flex-shrink:0;}
.arc-body{flex:1;min-width:0;}
.arc-game{font-size:11px;font-weight:bold;color:rgba(76,200,120,0.8);letter-spacing:.5px;text-transform:uppercase;}
.arc-course{font-size:14px;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.arc-meta{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.arc-arrow{color:rgba(76,200,120,0.4);font-size:18px;flex-shrink:0;}
.arc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4cc878;margin-right:5px;animation:arc-pulse 1.5s ease-in-out infinite;}
@keyframes arc-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
button{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);color:#1a1a0a;cursor:pointer;margin-bottom:4px;box-shadow:0 2px 8px rgba(139,94,60,0.4);letter-spacing:.5px;}
button:hover,button:active{background:linear-gradient(135deg,#b8912e,#ffc93a,#b8912e);}
button.btn-secondary{background:transparent;border:1px solid rgba(139,94,60,0.4);color:#a07840;font-size:14px;padding:10px;box-shadow:none;letter-spacing:.5px;}
button.btn-secondary:hover,button.btn-secondary:active{background:rgba(139,94,60,0.08);border-color:rgba(255,212,71,0.6);color:#ffd447;}
.hidden{display:none!important;}
/* ── Bottom pill nav ── */
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;pointer-events:none;}
.nav-pill{display:flex;align-items:center;gap:2px;background:#0e1a12;border:1px solid rgba(255,212,71,0.28);border-radius:50px;padding:6px 10px;box-shadow:0 4px 24px rgba(0,0,0,0.6);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:40px;cursor:pointer;text-decoration:none;color:#a07840;font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;transition:color .15s,background .15s;-webkit-user-select:none;}
.nav-item:hover,.nav-item:active{color:rgba(255,212,71,0.7);}
.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;}
.nav-center svg{width:36px;height:36px;}

/* ── Round cards ── */
.rounds-section{width:100%;padding:0 16px 110px;}
.rounds-section-label{font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:#ffd447;margin:0 0 10px;text-align:center;font-family:'Georgia','Times New Roman',serif;}
.rcard{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.rcard:hover,.rcard:active{border-color:rgba(255,212,71,0.55);}
.rcard-body{padding:13px 14px 10px;}
.rcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.rcard-game{font-size:11px;font-weight:bold;color:#ffd447;letter-spacing:.5px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.rcard-date{font-size:11px;color:rgba(255,255,255,0.5);}
.rcard-mid{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.rcard-info{flex:1;min-width:0;}
.rcard-course{font-size:15px;font-weight:bold;color:rgba(255,235,180,0.92);line-height:1.2;margin-bottom:2px;font-family:'Georgia','Times New Roman',serif;}
.rcard-format{font-size:11px;color:rgba(255,255,255,0.4);}
.rcard-scores{display:flex;flex-direction:column;gap:3px;flex-shrink:0;margin-left:12px;align-items:flex-end;}
.rcard-score-row{display:flex;align-items:baseline;gap:6px;}
.rcard-score-name{font-size:10px;color:rgba(255,255,255,0.4);white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;}
.rcard-score-num{font-size:15px;font-weight:bold;color:#fff;font-variant-numeric:tabular-nums;}
.rcard-score-par{font-size:11px;color:#ffd447;font-variant-numeric:tabular-nums;min-width:28px;text-align:right;}
.hole-bar{display:grid;grid-template-columns:minmax(0,auto) 1fr 90px;gap:3px 6px;padding:4px 0 10px;align-items:center;}
.hb-row{display:contents;}
.hb-label{font-size:11px;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;min-width:0;}
.hb-label-team{max-width:160px;}
.hb-segs{display:flex;gap:1px;align-self:center;min-width:0;}
.hb-score{font-size:11px;font-weight:bold;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;text-align:right;}
.hb-vspar{font-size:11px;color:rgba(255,255,255,0.45);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;}
.hb-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.08);}
.hb-eagle{background:#6b21a8;}
.hb-birdie{background:#1e5a8e;}
.hb-par{background:#1a6b4a;}
.hb-bogey{background:#92650a;}
.hb-double{background:#8b2020;}

/* ── Expanded scorecard ── */
.rcard-delete{background:none;border:1px solid rgba(220,50,50,0.35);border-radius:8px;color:rgba(220,100,100,0.8);font-size:11px;font-weight:bold;padding:5px 12px;cursor:pointer;letter-spacing:.5px;align-self:flex-start;}
.rcard-delete:active{background:rgba(220,50,50,0.2);}
.rcard-expand-footer{display:flex;justify-content:flex-end;padding-top:10px;}
.rcard-expand{display:none;border-top:1px solid rgba(255,212,71,0.1);padding:12px 14px 14px;}
.rcard.expanded .rcard-expand{display:block;}
.rcard-expand-sc{overflow-x:auto;margin-bottom:12px;}
.rcard-expand-sc table{width:100%;border-collapse:collapse;font-size:11px;}
.rcard-expand-sc th{background:rgba(0,0,0,0.4);color:#ffd447;border:1px solid rgba(139,94,60,0.15);padding:5px 3px;text-align:center;font-size:9px;letter-spacing:.8px;text-transform:uppercase;}
.rcard-expand-sc th:first-child{text-align:left;}
.rcard-expand-sc td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:11px;}
.rcard-expand-sc td:first-child{color:rgba(255,212,71,0.55);font-family:inherit;text-align:left;}
.rcard-expand-sc tfoot td{background:rgba(0,0,0,0.3);color:#ffd447;font-weight:bold;font-family:inherit;}
.rcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rs-tile{background:rgba(0,0,0,0.25);border:1px solid rgba(255,212,71,0.12);border-radius:7px;padding:9px 8px;text-align:center;}
.rs-val{font-size:18px;font-weight:bold;color:#ffd447;font-family:'Courier New',monospace;display:block;}
.rs-lbl{font-size:9px;color:rgba(255,212,71,0.45);letter-spacing:1.2px;text-transform:uppercase;display:block;margin-top:2px;}
.rcard-empty{text-align:center;color:rgba(255,255,255,0.3);padding:30px 20px;font-size:13px;line-height:2;}
.expand-chevron{font-size:9px;color:rgba(255,212,71,0.3);display:inline-block;transition:transform .2s;margin-left:6px;}
.rcard.expanded .expand-chevron{transform:rotate(180deg);}


/* ── Golf Bag overlay ── */
.field-bag-edit-btn{background:none;border:1px solid rgba(255,212,71,0.35);color:rgba(255,212,71,0.8);font-size:13px;font-weight:bold;padding:4px 12px;border-radius:4px;cursor:pointer;letter-spacing:.5px;white-space:nowrap;}
.field-bag-edit-btn:active{background:rgba(255,212,71,0.1);}
.bag-section-label{font-size:10px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.35);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(139,94,60,0.15);}
.bag-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px;}
.bag-table th{background:#0a1409;color:#ffd447;border:1px solid rgba(139,94,60,0.12);padding:6px 8px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.bag-table th:first-child{text-align:left;}
.bag-table td{border:1px solid rgba(139,94,60,0.08);padding:8px;text-align:center;color:rgba(255,255,255,0.75);}
.bag-table td:first-child{text-align:left;color:#ffd447;font-weight:bold;letter-spacing:.5px;}
.bag-table td.bag-dist{font-family:'Courier New',monospace;font-size:14px;font-weight:bold;}
.bag-table td.bag-empty{color:rgba(255,255,255,0.2);}
.bag-edit-row td{background:rgba(255,212,71,0.03);}
.bag-name-input{width:64px;padding:5px 6px;border-radius:3px;background:#0a1409;border:1px solid rgba(139,94,60,0.25);color:#fff;font-size:13px;}
.bag-dist-input{width:54px;padding:5px 6px;border-radius:3px;background:#0a1409;border:1px solid rgba(139,94,60,0.25);color:#fff;font-size:13px;text-align:center;font-family:'Courier New',monospace;}
.bag-del-btn{background:none;border:none;color:rgba(255,77,77,0.4);cursor:pointer;font-size:15px;padding:0 2px;}
.bag-del-btn:hover{color:#ff4d4d;}
.bag-add-btn{width:100%;padding:10px;margin-top:8px;border:1px dashed rgba(139,94,60,0.25);border-radius:4px;background:none;color:rgba(255,212,71,0.5);font-size:12px;letter-spacing:1px;cursor:pointer;}
.bag-add-btn:active{background:rgba(139,94,60,0.06);}
/* ── Field Mode overlay ── */
.field-overlay{display:none;position:fixed;inset:0;background:#0a1409;z-index:2000;flex-direction:column;overflow:hidden;}
.field-overlay.open{display:flex;}
.field-topnav{display:flex;align-items:center;background:#0e1a12;padding:10px 14px;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(139,94,60,0.3);box-shadow:0 2px 12px rgba(0,0,0,0.6);}
.field-back{background:none;border:none;color:rgba(255,212,71,0.8);font-size:15px;font-weight:bold;cursor:pointer;padding:4px 8px 4px 0;white-space:nowrap;letter-spacing:.5px;}
.field-back:active{color:#ffd700;}
.field-topnav-title{flex:1;text-align:center;color:#ffd447;font-size:13px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;}
.field-spacer{width:60px;}
.field-scroll{flex:1;overflow-y:auto;padding:20px 14px 40px;}
.field-scroll.padded-bottom{padding-bottom:100px;}
#fieldMenu .field-menu-logo{text-align:center;padding:28px 0 12px;}
#fieldMenu .field-menu-logo svg{display:inline-block;}
#fieldMenu h2{text-align:center;color:#ffd447;margin:0 0 4px;font-size:18px;letter-spacing:4px;text-transform:uppercase;}
#fieldMenu .field-subtitle{text-align:center;color:rgba(255,255,255,0.3);font-size:11px;margin:0 0 32px;letter-spacing:2px;text-transform:uppercase;}
.field-card{display:flex;align-items:center;gap:16px;background:#0e1a12;border:1px solid rgba(139,94,60,0.2);border-left:3px solid rgba(139,94,60,0.5);border-radius:4px;padding:16px;margin-bottom:10px;cursor:pointer;color:#fff;transition:border-color .15s,background .15s;-webkit-user-select:none;}
.field-card:hover,.field-card:active{border-color:rgba(255,212,71,0.7);border-left-color:#ffd447;background:#0a1409;}
.field-card-icon{width:44px;height:44px;border-radius:4px;background:rgba(139,94,60,0.08);border:1px solid rgba(139,94,60,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.field-card-info{flex:1;}
.field-card-title{font-size:14px;font-weight:bold;margin-bottom:3px;color:#ffd447;letter-spacing:1px;text-transform:uppercase;}
.field-card-desc{font-size:12px;color:rgba(255,255,255,0.4);line-height:1.4;}
.field-card-arrow{color:rgba(139,94,60,0.3);font-size:18px;}
.field-rounds-label{font-size:10px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.35);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(139,94,60,0.15);}
.field-round-item{display:flex;justify-content:space-between;align-items:center;background:#0e1a12;border:1px solid rgba(139,94,60,0.12);border-radius:4px;padding:10px 12px;margin-bottom:6px;font-size:13px;}
.field-round-item .sri-name{font-weight:bold;color:#ffd447;letter-spacing:.5px;}
.field-round-item .sri-meta{color:rgba(255,255,255,0.35);font-size:11px;margin-top:2px;}
.field-round-item .sri-del{background:none;border:none;color:rgba(255,77,77,0.4);cursor:pointer;font-size:16px;padding:0 4px;}
.field-round-item .sri-del:hover{color:#ff4d4d;}
.field-no-rounds{text-align:center;color:rgba(255,255,255,0.2);font-size:12px;margin-top:16px;letter-spacing:1px;}
.field-form-row{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.field-input,.field-select{width:100%;padding:10px;border-radius:4px;border:1px solid rgba(139,94,60,0.2);border-bottom:2px solid rgba(139,94,60,0.35);background:#0e1a12;color:#fff;font-size:15px;color-scheme:dark;}
.field-input::placeholder{color:rgba(255,255,255,0.25);}
.field-input:focus,.field-select:focus{outline:none;border-color:rgba(255,212,71,0.6);}

.field-btn-secondary{width:100%;padding:11px;border:1px solid rgba(139,94,60,0.35);border-radius:4px;font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;background:none;color:#a07840;cursor:pointer;margin-top:8px;}

.hole-card-num{font-size:20px;font-weight:bold;color:#ffd447;letter-spacing:2px;}
.hole-card-meta{font-size:11px;color:rgba(255,212,71,0.45);letter-spacing:1.5px;text-transform:uppercase;}
.hole-card-field{padding:12px 16px;border-bottom:1px solid rgba(139,94,60,0.08);}
.hole-card-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:8px;}
.hole-card-score-input{width:100%;padding:12px;border-radius:4px;background:#0a1409;border:1px solid rgba(139,94,60,0.2);border-bottom:2px solid rgba(139,94,60,0.4);color:#fff;font-size:36px;font-weight:bold;font-family:'Courier New',monospace;text-align:center;}
.yn-group{display:flex;gap:8px;}
.yn-btn{flex:1;padding:9px;border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;border:1px solid rgba(139,94,60,0.2);background:#0e1a12;color:rgba(255,255,255,0.4);letter-spacing:1px;}
.yn-btn.active-yes{background:rgba(46,180,100,0.15);color:#2ecc71;border-color:rgba(46,204,113,0.4);}
.yn-btn.active-no{background:rgba(180,46,46,0.15);color:#e07070;border-color:rgba(204,46,46,0.4);}
.miss-dir-row{display:flex;gap:6px;margin-top:8px;}
.miss-dir-btn{padding:5px 12px;border-radius:3px;font-size:12px;cursor:pointer;background:#0e1a12;color:rgba(255,255,255,0.4);border:1px solid rgba(139,94,60,0.2);}
.miss-dir-btn.active{background:rgba(180,100,46,0.25);color:#e8a070;border-color:rgba(200,130,70,0.5);font-weight:bold;}
.putts-pen-row{display:flex;gap:12px;}
.putts-pen-row>div{flex:1;}
.stepper{display:flex;justify-content:center;align-items:center;gap:6px;}
.stepper button{width:32px;height:32px;background:#0e1a12;color:rgba(255,212,71,0.7);border:1px solid rgba(139,94,60,0.2);border-radius:3px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;}
.stepper span{min-width:28px;text-align:center;font-size:18px;font-weight:bold;color:#fff;font-family:'Courier New',monospace;}
.hole-nav{display:flex;gap:10px;padding:14px 16px 0;}
.hole-nav button{flex:1;}
.scorecard-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:3500;}
.scorecard-backdrop.open{display:block;}
.scorecard-panel{position:fixed;bottom:0;left:0;right:0;background:#0e1a12;border-radius:12px 12px 0 0;padding:12px 16px 36px;z-index:3501;max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;border-top:1px solid rgba(139,94,60,0.3);}
.scorecard-panel.open{transform:translateY(0);}
.scorecard-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 12px;}
.scorecard-panel-title{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);text-align:center;margin-bottom:12px;font-family:Arial,sans-serif;}
table.sc-mini-table{width:100%;border-collapse:collapse;font-size:12px;}
table.sc-mini-table th{background:#0a1409;color:#ffd447;border:1px solid rgba(139,94,60,0.12);padding:5px 4px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
table.sc-mini-table td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;}

.hole-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.field-summary-bar{position:fixed;bottom:0;left:0;right:0;background:#0a1409;border-top:1px solid rgba(139,94,60,0.3);display:none;justify-content:space-around;padding:10px 8px;font-size:13px;z-index:3000;}
.field-summary-bar.active{display:flex;}
.field-sum-item{text-align:center;line-height:1.4;}
.field-sum-item small{display:block;color:rgba(255,212,71,0.4);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;}
.field-good{color:#2ecc71;font-weight:bold;}
.field-bad{color:#ff4d4d;font-weight:bold;}
.field-insights-box{margin:14px 0 6px;background:#0e1a12;border:1px solid rgba(139,94,60,0.18);border-left:3px solid rgba(139,94,60,0.5);border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.8;}
.field-insights-box b{color:#ffd447;}
.momentum-line{text-align:center;font-size:13px;margin:10px 0;color:rgba(255,255,255,0.6);letter-spacing:.5px;}
.intel-player-row{display:flex;align-items:center;gap:6px;}
.intel-player-row .field-input{flex:1;}
.intel-add-btn{background:#0e1a12;border:1px solid rgba(139,94,60,0.3);color:#ffd447;font-size:20px;width:36px;height:36px;border-radius:4px;cursor:pointer;flex-shrink:0;}
.intel-remove-btn{background:none;border:none;color:rgba(255,77,77,0.5);font-size:18px;cursor:pointer;flex-shrink:0;padding:0 4px;}
.player-accordion{border-top:1px solid rgba(139,94,60,0.1);}
.player-acc-header{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;background:#0e1a12;-webkit-user-select:none;}
.player-acc-header.expanded{background:rgba(255,212,71,0.06);border-left:3px solid rgba(255,212,71,0.5);}
.player-acc-chevron{font-size:10px;color:rgba(255,212,71,0.4);width:14px;flex-shrink:0;}
.player-acc-name{flex:1;font-size:13px;font-weight:bold;color:#ffd447;letter-spacing:1px;text-transform:uppercase;}
.player-acc-score{font-size:14px;font-weight:bold;font-family:'Courier New',monospace;color:rgba(255,255,255,0.35);}
.player-acc-score.scored{color:#fff;}
.player-acc-body{display:none;background:rgba(255,212,71,0.02);}
.player-acc-body.open{display:block;}
.analysis-filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.analysis-filters select{width:100%;padding:10px;border-radius:4px;border:1px solid rgba(139,94,60,0.2);background:#0e1a12;color:#fff;font-size:14px;}
.analysis-par-row{display:flex;gap:6px;}
.analysis-par-row button{flex:1;padding:7px 4px;background:#0e1a12;color:rgba(255,255,255,0.45);border:1px solid rgba(139,94,60,0.2);border-radius:20px;font-size:12px;cursor:pointer;letter-spacing:.5px;}
.analysis-par-row button.active{background:rgba(139,94,60,0.15);color:#ffd447;border-color:rgba(255,212,71,0.5);font-weight:bold;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stat-tile{background:#0e1a12;border:1px solid rgba(139,94,60,0.15);border-top:2px solid rgba(139,94,60,0.35);border-radius:4px;padding:14px 10px;text-align:center;}
.stat-tile .sv{font-size:24px;font-weight:bold;margin-bottom:4px;font-family:'Courier New',monospace;}
.stat-tile .sl{font-size:9px;color:rgba(255,212,71,0.45);letter-spacing:1.5px;text-transform:uppercase;}
.sv.good{color:#2ecc71;}
.sv.bad{color:#ff4d4d;}
.sv.neutral{color:#ffd447;}
.analysis-section{margin-bottom:20px;}
.analysis-section h4{color:rgba(255,212,71,0.7);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px;border-bottom:1px solid rgba(139,94,60,0.15);padding-bottom:6px;}
.hole-breakdown-table{width:100%;border-collapse:collapse;font-size:12px;}
.hole-breakdown-table th{background:#0e1a12;color:#ffd447;border:1px solid rgba(139,94,60,0.12);padding:5px 3px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.hole-breakdown-table td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;}
.hole-breakdown-table tr.hb-good{background:rgba(46,204,113,.06);}
.hole-breakdown-table tr.hb-bad{background:rgba(255,77,77,.06);}
.rounds-list-table{width:100%;border-collapse:collapse;font-size:12px;}
.rounds-list-table th{background:#0e1a12;color:#ffd447;border:1px solid rgba(139,94,60,0.12);padding:5px 4px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.rounds-list-table td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;}
.analysis-empty{text-align:center;color:rgba(255,255,255,0.2);font-size:12px;padding:40px 20px;line-height:2;letter-spacing:.5px;}
.tag-good{color:#2ecc71;font-weight:bold;}
.tag-bad{color:#ff4d4d;font-weight:bold;}
.tag-neutral{color:#ffd447;}
.hp-dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:bold;cursor:pointer;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.1);}
.hp-dot.current{background:rgba(255,212,71,0.2);color:#ffd447;border-color:rgba(255,212,71,0.5);font-weight:bold;}
.hp-dot.done{background:rgba(46,204,113,0.15);color:#2ecc71;border-color:rgba(46,204,113,0.3);}
.hp-dot.partial{background:rgba(255,180,0,0.12);color:#ffb400;border-color:rgba(255,180,0,0.3);}
.hole-progress{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid rgba(139,94,60,0.1);}
.field-table-wrap{overflow-x:auto;}
</style>
</head>

<!-- ══════════════════════════════════
     ENTER INTEL
     ══════════════════════════════════ -->
<div class="field-overlay" id="fieldIntel">
  <div class="field-topnav">
    <button class="field-back" onclick="backToFieldMenu()">‹ Spy Menu</button>
    <div class="field-topnav-title">📋 Enter Intel</div>
    <div class="field-spacer"></div>
  </div>

  <!-- setup form -->
  <div class="field-scroll" id="intelSetup">
    <div class="field-form-row">
      <!-- Player 1 (required) -->
      <div class="intel-player-row" id="intelPlayerRow1">
        <input class="field-input" id="intelPlayerName1" placeholder="Player 1 name (required)">
        <button class="intel-add-btn" onclick="showAddPlayer(2)" title="Add player">+</button>
      </div>
      <!-- Player 2 (optional) -->
      <div class="intel-player-row" id="intelPlayerRow2" style="display:none;">
        <input class="field-input" id="intelPlayerName2" placeholder="Player 2 name">
        <button class="intel-add-btn" onclick="showAddPlayer(3)" title="Add player">+</button>
        <button class="intel-remove-btn" onclick="hidePlayer(2)" title="Remove">×</button>
      </div>
      <!-- Player 3 (optional) -->
      <div class="intel-player-row" id="intelPlayerRow3" style="display:none;">
        <input class="field-input" id="intelPlayerName3" placeholder="Player 3 name">
        <button class="intel-add-btn" onclick="showAddPlayer(4)" title="Add player">+</button>
        <button class="intel-remove-btn" onclick="hidePlayer(3)" title="Remove">×</button>
      </div>
      <!-- Player 4 (optional) -->
      <div class="intel-player-row" id="intelPlayerRow4" style="display:none;">
        <input class="field-input" id="intelPlayerName4" placeholder="Player 4 name">
        <button class="intel-remove-btn" onclick="hidePlayer(4)" title="Remove">×</button>
      </div>
      <select class="field-select" id="intelCourseSelect"></select>
      <input class="field-input" type="date" id="intelRoundDate">
      <button class="field-btn-primary" onclick="startIntel()">Start Round</button>
    </div>
  </div>

  <!-- hole-by-hole entry -->
  <div class="field-scroll padded-bottom" id="intelMain" style="display:none;">
    <div class="hole-card" id="holeCard"></div>
    <div class="hole-actions">
      <button class="field-btn-secondary" onclick="openScorecardModal()">📋 View Scorecard</button>
      <button class="field-btn-secondary" onclick="saveRound()">Save Round</button>
      <button class="field-btn-secondary" onclick="discardRound()">Discard</button>
    </div>
  </div>

  <!-- scorecard slide-up -->
  <div class="scorecard-backdrop" id="scorecardBackdrop" onclick="closeScorecardModal()"></div>
  <div class="scorecard-panel" id="scorecardPanel">
    <div class="scorecard-handle"></div>
    <div class="scorecard-panel-title">Scorecard</div>
    <div id="scPlayerPills" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;"></div>
    <div style="overflow-x:auto;"><table class="sc-mini-table" id="scMiniTable"></table></div>
    <button class="field-btn-secondary" style="margin-top:12px;" onclick="closeScorecardModal()">Close</button>
  </div>

  <!-- live summary bar -->
  <div class="field-summary-bar" id="intelSummaryBar"></div>
</div>

     ══════════════════════════════════ -->
<div class="field-overlay" id="fieldAnalysis">
  <div class="field-topnav">
    <button class="field-back" onclick="backToFieldMenu()">‹ Spy Menu</button>
    <div class="field-topnav-title">📊 Analysis</div>
    <div class="field-spacer"></div>
  </div>
  <div class="field-scroll">

    <div class="analysis-filters">
      <select class="field-select" id="analysisPlayerSelect" onchange="renderAnalysis()">
        <option value="all">All Players</option>
      </select>
      <select class="field-select" id="analysisCourseSelect" onchange="renderAnalysis()">

<script>
(function renderRoundCards(){
  const GAME_LABELS = {
    f1:'Grand Prix', stableford:'Stableford', banker:'Banker',
    matchplay:'Match Play', scramble:'Scramble',
    stroke:'Stroke Play', mixed:'Mixed Round'
  };
  const GAME_ICONS = {
    f1:'🏎️', stableford:'🎯', banker:'🏦',
    matchplay:'⚔️', scramble:'🤝',
    stroke:'🏌️', mixed:'🎲'
  };

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(d){ if(!d) return ''; let dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
  function fmtVsPar(v){ return v>0?'+'+v:v===0?'E':String(v); }

  function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }

  function getScoreDisplay(r){
    try{
      let players = r.players||[];
      switch(r.game){
        case 'stroke':{
          let totalPar = (r.holeParDist||[]).reduce((s,h)=>s+(h.par||4),0) || r.coursePar || 0;
          let rows = players.map((p,i)=>{
            let gross = r.playerTotals?.[i];
            let diff = gross != null ? gross - totalPar : null;
            return { name:p, num:gross, par: diff!=null?fmtVsPar(diff):'' };
          });
          return rows.sort((a,b)=>(a.num??999)-(b.num??999));
        }
        case 'stableford': case 'f1':{
          let rows = players.map((p,i)=>{
            let v = r.playerTotals?.[i];
            let disp = v!=null ? (Number.isInteger(v)?v:Number(v).toFixed(1)) : null;
            let segs = '';
            if(r.scoreHistory && r.scoreHistory.length && r.holeParDist){
              segs = r.scoreHistory.map((hole,hi)=>{
                let s=hole[i], par=(r.holeParDist[hi]?.par||4), cls='hb-seg';
                if(s!=null){let d=s-par;if(d<=-2)cls+=' hb-eagle';else if(d===-1)cls+=' hb-birdie';else if(d===0)cls+=' hb-par';else if(d===1)cls+=' hb-bogey';else cls+=' hb-double';}
                return `<div class="${cls}"></div>`;
              }).join('');
            }
            return { name:p, num:disp, par:'pts', segs };
          });
          return rows.sort((a,b)=>(b.num??-999)-(a.num??-999));
        }
        case 'banker':{
          let rows = players.map((p,i)=>{
            let net = r.playerNetTotals?.[i];
            let numStr = net!=null ? (net>=0?'+$':'−$')+Math.abs(net) : null;
            let segs = '';
            if(r.holeHistory && r.holeHistory.length){
              segs = r.holeHistory.map(h=>{
                let s=h.scores?.[i], cls='hb-seg';
                if(s!=null){if(s<=-2)cls+=' hb-eagle';else if(s===-1)cls+=' hb-birdie';else if(s===0)cls+=' hb-par';else if(s===1)cls+=' hb-bogey';else cls+=' hb-double';}
                return `<div class="${cls}"></div>`;
              }).join('');
            }
            return { name:p, num:numStr, par:'', netColor: net>0?'#4ade80':net<0?'#f87171':'rgba(255,255,255,0.4)', segs, _net: net??0 };
          });
          return rows.sort((a,b)=>b._net-a._net);
        }
        case 'scramble':{
          let scores = r.teamScores||[];
          let getTeamLabel = (ti) => {
            if(r.players && r.players[ti*2]) {
              return [r.players[ti*2], r.players[ti*2+1]].filter(Boolean).join(' & ');
            }
            if(Array.isArray(r.playerNames) && Array.isArray(r.playerNames[ti])) {
              return r.playerNames[ti].filter(Boolean).join(' & ');
            }
            return `Team ${String.fromCharCode(65+ti)}`;
          };
          let rows = [0,1].map(ti=>({ name:getTeamLabel(ti), num:scores[ti], par:r.teamVsPar?.[ti]!=null?fmtVsPar(r.teamVsPar[ti]):'' }));
          return rows.sort((a,b)=>(a.num??999)-(b.num??999));
        }
        case 'mixed':{
          let rows = players.map((p,i)=>{
            let parts = [];
            let b = r.bankerTotals?.[i];
            let s = r.stablefordTotals?.[i];
            let st = r.strokeTotals?.[i];
            let pm = r.pinMoneyTotals?.[i];
            if(b!=null && b!==0) parts.push((b>=0?'+$':'−$')+Math.abs(b));
            else if(b!=null) parts.push('$0');
            if(s!=null && s>0) parts.push(s+'pts');
            if(st!=null && st>0) parts.push(st+' strokes');
            if(pm!=null && pm!==0) parts.push('pin:'+(pm>=0?'+$':'−$')+Math.abs(pm));
            let netColor = 'rgba(255,255,255,0.4)';
            let net = (b||0)+(pm||0);
            if(net>0) netColor='#4ade80'; else if(net<0) netColor='#f87171';
            return { name:p, num:parts.length?parts.join(' · '):null, par:'', netColor };
          });
          return rows;
        }
        case 'matchplay':
          return players.map((p,i)=>({ name:p, num:null, par:'' }));
        default:
          return players.map((p,i)=>({ name:p, num:r.playerTotals?.[i], par:'' }));
      }
    }catch(e){ return []; }
  }

  function getHoleBar(r){
    try{
      let pd = r.holeParDist||[];
      let players = r.players||[];
      let bars = [];

      // These games show scores in the sd rows already; no separate hole bar needed
      if(r.game==='scramble' || r.game==='banker' || r.game==='stableford' || r.game==='f1' || r.game==='stroke') return '';

      // Banker: score-vs-par coloring (same as all other games)
      if(r.game==='banker' && r.holeHistory && r.holeHistory.length && r.players){
        let pm=r.pointsMode;
        let cur=v=>pm?Math.abs(v)+'pts':'$'+Math.abs(v);
        r.players.forEach((name,pi)=>{
          let net=r.playerNetTotals?.[pi]??0;
          let sign=net>0?'+':net<0?'-':'';
          let scoreHtml=`<span class="hb-score" style="${net>0?'color:#4ade80':net<0?'color:#f87171':'color:rgba(255,255,255,0.35)'}">${sign}${cur(net)}</span>`;
          let segs=r.holeHistory.map(h=>{
            let s=h.scores?.[pi];
            let segCls='hb-seg';
            // banker stores scores relative to par (0=par, -1=birdie, +1=bogey)
            if(s!=null){if(s<=-2)segCls+=' hb-eagle';else if(s===-1)segCls+=' hb-birdie';else if(s===0)segCls+=' hb-par';else if(s===1)segCls+=' hb-bogey';else segCls+=' hb-double';}
            return `<div class="${segCls}"></div>`;
          }).join('');
          bars.push(`<div class="hb-row"><span class="hb-label">${esc(name)}</span><div class="hb-segs">${segs}</div>${scoreHtml}</div>`);
        });
        return bars.join('');
      }

      let sh = r.scoreHistory||[];
      if(!sh.length && !players.length) return '';

      let totalPar = pd.reduce((s,h)=>s+(h.par||4),0);

      // Foursomes/Vegas: teams of 2
      if((r.game==='foursomes'||r.game==='vegas') && players.length>=2){
        let numTeams=Math.floor(players.length/2);
        for(let ti=0; ti<numTeams; ti++){
          let p1=players[ti*2], p2=players[ti*2+1];
          let members=[p1,p2].filter(Boolean).map(esc).join(', ');
          let score=(r.playerTotals||[])[ti]??(r.unitTotals||[])[ti];
          let scoreHtml=score!=null?`<span class="hb-score">${score}</span>`:'';
          let segs=sh.map((hole,i)=>{
            let s=hole[ti], par=pd[i]?.par||4, cls='hb-seg';
            if(s!=null){let d=s-par;if(d<=-2)cls+=' hb-eagle';else if(d===-1)cls+=' hb-birdie';else if(d===0)cls+=' hb-par';else if(d===1)cls+=' hb-bogey';else cls+=' hb-double';}
            return `<div class="${cls}"></div>`;
          }).join('');
          bars.push(`<div class="hb-row"><span class="hb-label hb-label-team">(${members})</span><div class="hb-segs">${segs}</div>${scoreHtml}</div>`);
        }
        return bars.join('');
      }

      // Individual games
      let numPlayers=Math.max(1,players.length);
      for(let pi=0; pi<numPlayers; pi++){
        let playerTotal=(r.playerTotals||[])[pi];
        let segs=sh.map((hole,i)=>{
          let score=hole[pi], par=pd[i]?.par||4, cls='hb-seg';
          if(score!=null){let diff=score-par;if(diff<=-2)cls+=' hb-eagle';else if(diff===-1)cls+=' hb-birdie';else if(diff===0)cls+=' hb-par';else if(diff===1)cls+=' hb-bogey';else cls+=' hb-double';}
          return `<div class="${cls}"></div>`;
        }).join('');
        let scoreHtml='';
        if(playerTotal!=null){
          if(r.game==='f1'||r.game==='stableford'){
            let disp=Number.isInteger(playerTotal)?playerTotal:Number(playerTotal).toFixed(1);
            scoreHtml=`<span class="hb-score">${disp} <span class="hb-vspar">(pts)</span></span>`;
          } else {
            let diff=playerTotal-totalPar;
            let parStr=diff>0?'+'+diff:diff===0?'E':String(diff);
            scoreHtml=`<span class="hb-score">${playerTotal} <span class="hb-vspar">(${parStr})</span></span>`;
          }
        }
        bars.push(`<div class="hb-row"><span class="hb-label">${players[pi]?esc(players[pi]):''}</span><div class="hb-segs">${segs}</div>${scoreHtml}</div>`);
      }
      return bars.join('');
    }catch(e){ return ''; }
  }

  function buildScorecard(r){
    try{
      // Scramble: uses holeHistory + teamNames
      if(r.game==='scramble' && r.holeHistory && r.holeHistory.length){
        let teams=r.teamNames||['Team A','Team B'];
        let thead=`<thead><tr><th>Hole</th><th>Par</th>${teams.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead>`;
        let rows=r.holeHistory.map((h,i)=>`<tr><td>${i+1}</td><td>${h.par||4}</td>${(h.scores||[]).map(s=>`<td>${s??'–'}</td>`).join('')}</tr>`).join('');
        let totals=(r.teamScores||[]).map(t=>`<td>${t}</td>`).join('');
        let totalPar=r.holeHistory.reduce((s,h)=>s+(h.par||4),0);
        return `<table>${thead}<tbody>${rows}</tbody><tfoot><tr><td>Total</td><td>${totalPar}</td>${totals}</tr></tfoot></table>`;
      }
      // Banker: full hole-by-hole scorecard + settlement
      if(r.game==='banker' && r.players && r.playerNetTotals && r.holeHistory){
        let p=r.players, nets=r.playerNetTotals, pm=r.pointsMode;
        let cur=v=>pm?Math.abs(v)+'pts':'$'+Math.abs(v);
        let sign=v=>v>0?'+':v<0?'-':'';
        // Scorecard table: Hole | Par | Score per player | Net per hole
        let thead=`<thead><tr><th>Hole</th><th>Par</th>${p.map(n=>`<th>${esc(n)}</th>`).join('')}<th>Net</th></tr></thead>`;
        let rows=r.holeHistory.map((h,hi)=>{
          let bi=h.bankerIdx;
          let scoreCells=p.map((n,pi)=>{
            let s=h.scores?.[pi], par=h.par||4;
            let display=s!=null?s+par:'–';
            let isBanker=pi===bi;
            return `<td style="${isBanker?'color:#ffd447;font-weight:bold':''}">${display}${isBanker?'*':''}</td>`;
          }).join('');
          // net for the banker this hole
          let holeNet=h.matchups.reduce((s,m)=>s+(m.result==='banker'?m.amount:m.result==='player'?-m.amount:0),0);
          let netCls=holeNet>0?'style="color:#4ade80"':holeNet<0?'style="color:#f87171"':'style="color:rgba(255,255,255,0.3)"';
          let netStr=holeNet===0?'tie':`${sign(holeNet)}${cur(holeNet)}`;
          return `<tr><td>${hi+1}</td><td>${h.par||4}</td>${scoreCells}<td ${netCls}>${netStr}</td></tr>`;
        }).join('');
        let totalCells=p.map((_,pi)=>{
          let v=nets[pi], cls=v>0?'style="color:#4ade80;font-weight:bold"':v<0?'style="color:#f87171;font-weight:bold"':'';
          return `<td ${cls}>${sign(v)}${cur(v)}</td>`;
        }).join('');
        let sc=`<table>${thead}<tbody>${rows}</tbody><tfoot><tr><td colspan="2">Net</td>${totalCells}<td></td></tr></tfoot></table>`;
        // Settlement slip
        let creditors=[], debtors=[];
        nets.forEach((v,i)=>{ if(v>0.001) creditors.push({name:p[i],amt:v}); else if(v<-0.001) debtors.push({name:p[i],amt:-v}); });
        creditors.sort((a,b)=>b.amt-a.amt); debtors.sort((a,b)=>b.amt-a.amt);
        let lines=[], ci=0, di=0;
        while(ci<creditors.length && di<debtors.length){
          let c=creditors[ci], d=debtors[di], settle=Math.min(c.amt,d.amt);
          if(settle>0.001) lines.push(`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;"><span><span style="color:#f87171;font-weight:bold">${esc(d.name)}</span> owes <span style="color:#4ade80;font-weight:bold">${esc(c.name)}</span></span><span style="color:#f87171;font-weight:bold;font-family:'Courier New'">${cur(settle)}</span></div>`);
          c.amt-=settle; d.amt-=settle;
          if(c.amt<0.001) ci++; if(d.amt<0.001) di++;
        }
        let settlement=lines.length
          ? `<div style="margin-top:12px;font-size:10px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.5);padding-bottom:4px;border-bottom:1px solid rgba(255,212,71,0.1);">Settlement</div>${lines.join('')}`
          : `<div style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.35);text-align:center;padding:6px 0;">All square — no transfers needed</div>`;
        return sc+settlement;
      }
      // Mixed round: per-format totals + settlement
      if(r.game==='mixed' && r.players){
        let p = r.players;
        let bt = r.bankerTotals||p.map(()=>0);
        let st = r.stablefordTotals||p.map(()=>0);
        let stt = r.strokeTotals||p.map(()=>0);
        let pt = r.pinTotals||p.map(()=>0);
        let pm = r.pinMoneyTotals||p.map(()=>0);
        let hasB = bt.some(v=>v!==0);
        let hasS = st.some(v=>v>0);
        let hasSt = stt.some(v=>v>0);
        let hasPin = pt.some(v=>v>0);
        let hasPM = pm.some(v=>v!==0);
        // Summary table
        let cols = [];
        if(hasB) cols.push({label:'Banker',fn:(i)=>{ let v=bt[i]; return {txt:(v>=0?'+$':'−$')+Math.abs(v),style:v>0?'color:#4ade80':v<0?'color:#f87171':''}; }});
        if(hasS) cols.push({label:'Stableford',fn:(i)=>({ txt:st[i]+'pts',style:'color:#ffd447' })});
        if(hasSt) cols.push({label:'Stroke',fn:(i)=>({ txt:stt[i],style:'' })});
        if(hasPin) cols.push({label:'Pin Wins',fn:(i)=>({ txt:pt[i]+'W',style:'color:#ffd447' })});
        if(hasPM) cols.push({label:'Pin $',fn:(i)=>{ let v=pm[i]; return {txt:(v>=0?'+$':'−$')+Math.abs(v),style:v>0?'color:#4ade80':v<0?'color:#f87171':''}; }});
        let thead=`<thead><tr><th>Player</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>`;
        let rows=p.map((name,i)=>`<tr><td>${esc(name)}</td>${cols.map(c=>{ let d=c.fn(i); return `<td style="${d.style}">${d.txt}</td>`; }).join('')}</tr>`).join('');
        let sc=`<table>${thead}<tbody>${rows}</tbody></table>`;
        // Settlement (banker + pin money)
        let net = p.map((_,i)=>(bt[i]||0)+(pm[i]||0));
        let creditors=[], debtors=[];
        net.forEach((v,i)=>{ if(v>0.001) creditors.push({name:p[i],amt:v}); else if(v<-0.001) debtors.push({name:p[i],amt:-v}); });
        creditors.sort((a,b)=>b.amt-a.amt); debtors.sort((a,b)=>b.amt-a.amt);
        let lines=[], ci=0, di=0;
        while(ci<creditors.length && di<debtors.length){
          let c=creditors[ci], d=debtors[di], settle=Math.min(c.amt,d.amt);
          if(settle>0.001) lines.push(`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;"><span><span style="color:#f87171;font-weight:bold">${esc(d.name)}</span> owes <span style="color:#4ade80;font-weight:bold">${esc(c.name)}</span></span><span style="color:#f87171;font-weight:bold;font-family:'Courier New'">${'$'+settle}</span></div>`);
          c.amt-=settle; d.amt-=settle;
          if(c.amt<0.001) ci++; if(d.amt<0.001) di++;
        }
        let settlement = (hasB||hasPM) ? (lines.length
          ? `<div style="margin-top:12px;font-size:10px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.5);padding-bottom:4px;border-bottom:1px solid rgba(255,212,71,0.1);">Settlement</div>${lines.join('')}`
          : `<div style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.35);text-align:center;padding:6px 0;">All square — no transfers needed</div>`)
          : '';
        return sc+settlement;
      }
      // Foursomes: scoreHistory has {par, scoreA, scoreB}
      if(r.game==='foursomes' && r.scoreHistory && r.scoreHistory.length){
        let p=r.players||['Team A','Team B'];
        let thead=`<thead><tr><th>Hole</th><th>Par</th><th>${esc(p[0]||'A')}</th><th>${esc(p[1]||'B')}</th></tr></thead>`;
        let rows=r.scoreHistory.map((h,i)=>`<tr><td>${i+1}</td><td>${h.par||4}</td><td>${h.scoreA??'–'}</td><td>${h.scoreB??'–'}</td></tr>`).join('');
        let tA=r.scoreHistory.reduce((s,h)=>s+(h.scoreA||0),0);
        let tB=r.scoreHistory.reduce((s,h)=>s+(h.scoreB||0),0);
        let tPar=r.scoreHistory.reduce((s,h)=>s+(h.par||4),0);
        return `<table>${thead}<tbody>${rows}</tbody><tfoot><tr><td>Total</td><td>${tPar}</td><td>${tA}</td><td>${tB}</td></tr></tfoot></table>`;
      }
      // Vegas: holeHistory has {par, scores:[s1,s2,...]}
      if(r.game==='vegas' && r.holeHistory && r.holeHistory.length){
        let p=r.players||[];
        let thead=`<thead><tr><th>Hole</th><th>Par</th>${p.map(pl=>`<th>${esc(pl)}</th>`).join('')}</tr></thead>`;
        let rows=r.holeHistory.map((h,i)=>`<tr><td>${i+1}</td><td>${h.par||4}</td>${(h.scores||[]).map(s=>`<td>${s??'–'}</td>`).join('')}</tr>`).join('');
        let totals=p.map((_,pi)=>`<td>${r.holeHistory.reduce((s,h)=>s+(h.scores?.[pi]||0),0)}</td>`).join('');
        let tPar=r.holeHistory.reduce((s,h)=>s+(h.par||4),0);
        return `<table>${thead}<tbody>${rows}</tbody><tfoot><tr><td>Total</td><td>${tPar}</td>${totals}</tr></tfoot></table>`;
      }
      if((r.game==='stroke'||r.game==='stableford'||r.game==='f1')){
        let sh=r.scoreHistory||[]; if(!sh.length) return '';
        let players=r.players||[];
        let pd=r.holeParDist||[];
        let thead=`<thead><tr><th>Hole</th><th>Par</th>${players.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead>`;
        let rows=sh.map((hole,i)=>{
          let par=pd[i]?.par||4;
          return `<tr><td>${i+1}</td><td>${par}</td>${hole.map(s=>`<td>${s??'–'}</td>`).join('')}</tr>`;
        }).join('');
        let totals=(r.playerTotals||[]).map(t=>`<td>${t!=null?(Number.isInteger(t)?t:Number(t).toFixed(1)):'-'}</td>`).join('');
        let totalPar=pd.reduce((s,h)=>s+(h.par||4),0);
        return `<table>${thead}<tbody>${rows}</tbody><tfoot><tr><td>Total</td><td>${totalPar}</td>${totals}</tr></tfoot></table>`;
      }
      if(r.game==='stroke' && r.playerTotals){
        // already handled above
      }
      return '';
    }catch(e){ return ''; }
  }

  function buildStats(r){
    try{
      if(r.game==='stroke' && r.holes && r.holes.length){
        let holesData = r.holes[0]||[];
        let scored = holesData.filter(h=>h.score!=null);
        if(!scored.length) return '';
        let totalPar = scored.reduce((s,h)=>s+(h.par||4),0);
        let totalGross = scored.reduce((s,h)=>s+h.score,0);
        let diff = totalGross - totalPar;
        let firOpp=0,firHit=0,girHit=0,totalPutts=0,totalPen=0;
        let birdies=0,pars=0,bogeys=0,doubles=0;
        scored.forEach(h=>{
          if(h.par!==3){ firOpp++; if(h.pts) firHit++; }
          if(h.air) girHit++;
          totalPutts+=h.putts||0;
          totalPen+=h.pen||0;
          let d=h.score-h.par;
          if(d<=-1) birdies++;
          else if(d===0) pars++;
          else if(d===1) bogeys++;
          else doubles++;
        });
        let firPct = firOpp>0 ? Math.round(firHit/firOpp*100)+'%' : '–';
        let girPct = Math.round(girHit/scored.length*100)+'%';
        let avgPutts = (totalPutts/scored.length).toFixed(1);
        return `
          <div class="rcard-stats">
            <div class="rs-tile"><span class="rs-val">${birdies}</span><span class="rs-lbl">Birdies</span></div>
            <div class="rs-tile"><span class="rs-val">${pars}</span><span class="rs-lbl">Pars</span></div>
            <div class="rs-tile"><span class="rs-val">${bogeys}</span><span class="rs-lbl">Bogeys</span></div>
            <div class="rs-tile"><span class="rs-val">${doubles}</span><span class="rs-lbl">Doubles+</span></div>
            <div class="rs-tile"><span class="rs-val">${firPct}</span><span class="rs-lbl">FIR %</span></div>
            <div class="rs-tile"><span class="rs-val">${girPct}</span><span class="rs-lbl">GIR %</span></div>
            <div class="rs-tile"><span class="rs-val">${avgPutts}</span><span class="rs-lbl">Avg Putts</span></div>
            <div class="rs-tile"><span class="rs-val">${totalPen}</span><span class="rs-lbl">Penalties</span></div>
          </div>`;
      }
      // Generic: just show total for other formats
      let sd = getScoreDisplay(r);
      if(!sd.length || sd.every(p=>p.num==null)) return '';
      return `<div class="rcard-stats">${sd.filter(p=>p.num!=null).map(p=>{
        return `<div class="rs-tile"><span class="rs-val">${p.num??'–'}</span><span class="rs-lbl">${esc(p.name)}</span></div>`;
      }).join('')}</div>`;
    }catch(e){ return ''; }
  }

  let expanded = new Set();

  function render(){
    let history = loadHistory().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    let el = document.getElementById('roundCards');
    if(!el) return;
    if(!history.length){
      el.innerHTML = '<div class="rcard-empty">No rounds played yet.</div>';
      return;
    }
    el.innerHTML = '';
    history.forEach(r=>{
      let sd = getScoreDisplay(r);
      let bar = getHoleBar(r);
      let sc = buildScorecard(r);
      let isExp = expanded.has(r.id);

      let card = document.createElement('div');
      card.className = 'rcard' + (isExp?' expanded':'');
      card.innerHTML = `
        <div class="rcard-body">
          <div class="rcard-top">
            <span class="rcard-game">${esc(GAME_ICONS[r.game]||'⛳')} ${esc(GAME_LABELS[r.game]||r.game)}<span class="expand-chevron">▼</span></span>
            <span class="rcard-date">${esc(fmtDate(r.date))}</span>
          </div>
          <div class="rcard-mid">
            <div class="rcard-info">
              <div class="rcard-course">${esc(r.course||'Unknown Course')}</div>
              ${r.game==='mixed'
                ? `<div style="font-size:13px;font-weight:bold;color:#a07840;margin-top:4px;letter-spacing:.2px;">${(r.players||[]).map(esc).join(' · ')}</div>`
                : sd.length ? `<div style="display:grid;grid-template-columns:max-content 1fr max-content;gap:4px 8px;align-items:center;margin-top:6px;">${sd.map(p=>`<span style="font-size:13px;color:#a07840;font-weight:bold;letter-spacing:.2px;white-space:nowrap;">${esc(p.name)}</span>${p.segs?`<div style="display:flex;gap:1px;min-width:0;">${p.segs}</div>`:'<div></div>'}<span style="font-family:'Courier New',monospace;font-size:19px;font-weight:bold;color:${p.netColor||'#fff'};white-space:nowrap;text-align:right;">${p.num??'–'}${p.par?`<span style="font-size:12px;color:#ffd447;margin-left:5px;">(${p.par})</span>`:''}</span>`).join('')}</div>` : ''}
            </div>
          </div>
          ${r.game!=='mixed'&&bar?`<div class="hole-bar">${bar}</div>`:''}
        </div>
        <div class="rcard-expand">${sc?`<div class="rcard-expand-sc">${sc}</div>`:''}<div class="rcard-expand-footer"><button class="rcard-delete" data-id="${r.id}">Delete Round</button></div></div>`;

      card.addEventListener('click', e=>{
        if(e.target.closest('.rcard-delete')) return;
        if(expanded.has(r.id)) expanded.delete(r.id);
        else expanded.add(r.id);
        card.classList.toggle('expanded', expanded.has(r.id));
      });

      card.querySelector('.rcard-delete').addEventListener('click', e=>{
        e.stopPropagation();
        if(!confirm('Delete this round? This cannot be undone.')) return;
        let h=loadHistory().filter(x=>x.id!==r.id);
        localStorage.setItem('gameHistory',JSON.stringify(h));
        expanded.delete(r.id);
        render();
      });

      el.appendChild(card);
    });
  }

  render();
  window.addEventListener('storage', render);
})();

(function renderActiveRounds(){
  const GAME_LABELS = {f1:'Grand Prix',stableford:'Stableford',banker:'Banker',scramble:'Scramble',practice:'Stroke Play',mixed:'Mixed Round'};
  const GAME_ICONS  = {f1:'🏎️',stableford:'🎯',banker:'🏦',scramble:'🤝',practice:'🏌️',mixed:'🎲'};
  const GAME_URLS   = {f1:'f1.html',stableford:'stableford.html',banker:'banker.html',scramble:'scramble.html',practice:'practice.html',mixed:'mixed.html'};
  const KEYS = ['activeGame_f1','activeGame_stableford','activeGame_banker','activeGame_scramble','activeGame_practice','activeGame_mixed'];

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderActive(){
    let cards = [];
    KEYS.forEach(key=>{
      let raw = localStorage.getItem(key);
      if(!raw) return;
      try{
        let s = JSON.parse(raw);
        let type = key.replace('activeGame_','');
        let label = GAME_LABELS[type]||type;
        let icon  = GAME_ICONS[type]||'⛳';
        let url   = GAME_URLS[type]||'#';
        let course = esc(s.course||s.courseName||'Unknown Course');
        let hole = s.hole!=null ? s.hole : (s.holeHistory ? s.holeHistory.length+1 : null);
        let total = s.totalHoles||s.numHoles||18;
        let holeTxt = hole!=null ? `Hole ${hole}/${total}` : 'In progress';
        let rawPlayers = s.players || (Array.isArray(s.playerNames) ? (Array.isArray(s.playerNames[0]) ? s.playerNames.flat() : s.playerNames) : []);
        let players = rawPlayers.filter(Boolean);
        let playerTxt = players.length ? players.slice(0,3).map(esc).join(', ')+(players.length>3?'…':'') : '';
        cards.push(`<a class="arc" href="${url}">
          <div class="arc-icon">${icon}</div>
          <div class="arc-body">
            <div class="arc-game"><span class="arc-dot"></span>${label}</div>
            <div class="arc-course">${course}</div>
            <div class="arc-meta">${holeTxt}${playerTxt?' · '+playerTxt:''}</div>
          </div>
          <div class="arc-arrow">›</div>
        </a>`);
      }catch(e){}
    });
    let sec = document.getElementById('activeRoundsSection');
    let el  = document.getElementById('activeRoundCards');
    if(!sec||!el) return;
    if(!cards.length){ sec.style.display='none'; return; }
    sec.style.display='';
    el.innerHTML = cards.join('');
  }

  renderActive();
  window.addEventListener('storage', renderActive);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) renderActive(); });
})();
</script>

/* ══════════════════════════════════
   SPY STORAGE  (localStorage)
   key: 'fieldRounds'
   value: JSON array of round objects:
   {
     id: timestamp,
     player: string,
     course: string,        // course name

// Migrate data from old 'spyRounds' key if present
(function migrateFieldRounds(){
  if(!localStorage.getItem('fieldRounds') && localStorage.getItem('spyRounds')){
    localStorage.setItem('fieldRounds', localStorage.getItem('spyRounds'));
    localStorage.removeItem('spyRounds');
  }
})();
function loadRounds(){ try{ return JSON.parse(localStorage.getItem('fieldRounds')||'[]'); }catch(e){ return []; } }
function saveRounds(arr){ localStorage.setItem('fieldRounds',JSON.stringify(arr)); }

function renderRoundsList(){
  let rounds=loadRounds();
  let el=document.getElementById('fieldRoundsList');
  if(!rounds.length){
    el.innerHTML='<div class="field-no-rounds">No ops logged. Run a mission.</div>';

      <div>

    </div>`;

function deleteRound(id){

  renderRoundsList();
  // refresh analysis filters if open
  populateAnalysisFilters();
}

/* ══════════════════════════════════
   ENTER INTEL
   ══════════════════════════════════ */
let intelHoles=[], intelPlayers=[], intelParFilter='all', intelCourseIdx='', intelHoleIdx=0, intelExpandedIdx=0;
let scActivePlayer=0;

function openIntel(){
  // reset player rows: hide 2-4, clear all values
  [1,2,3,4].forEach(n=>{
    let inp=document.getElementById('intelPlayerName'+n);
    if(inp) inp.value='';
    if(n>1){
      let row=document.getElementById('intelPlayerRow'+n);
      if(row) row.style.display='none';
    }
  });
  document.getElementById('intelSetup').style.display='';
  document.getElementById('intelMain').style.display='none';
  document.getElementById('intelSummaryBar').classList.remove('active');
  // default date to today
  document.getElementById('intelRoundDate').value=new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
  hideOverlay('fieldMenu');
  showOverlay('fieldIntel');
}

function showAddPlayer(n){
  let row=document.getElementById('intelPlayerRow'+n);
  if(row) row.style.display='flex';
  let inp=document.getElementById('intelPlayerName'+n);
  if(inp) inp.focus();
  // hide the "+" button on the previous row since this one is now visible
  // (the "+" on row n-1 opened row n, but we don't need to hide it;
  //  each row's "+" only appears when that row is the last visible one
  //  — handled via CSS: we show all "+" buttons but the one on row n-1
  //  stays visible to allow adding further players)
}

function hidePlayer(n){
  let row=document.getElementById('intelPlayerRow'+n);
  if(row) row.style.display='none';
  let inp=document.getElementById('intelPlayerName'+n);
  if(inp) inp.value='';
  // also hide any rows after this one
  for(let k=n+1;k<=4;k++){
    let r2=document.getElementById('intelPlayerRow'+k);
    if(r2) r2.style.display='none';
    let i2=document.getElementById('intelPlayerName'+k);
    if(i2) i2.value='';
  }
}

function startIntel(){
  let names=[];
  for(let n=1;n<=4;n++){
    let row=document.getElementById('intelPlayerRow'+n);
    let visible=(n===1)||(row&&row.style.display!=='none');
    if(visible){
      let val=(document.getElementById('intelPlayerName'+n).value||'').trim();
      if(val) names.push(val);
    }
  }
  if(names.length===0){
    let inp=document.getElementById('intelPlayerName1');
    inp.style.border='2px solid #ff4d4d';
    inp.focus();
    return;
  }
  document.getElementById('intelPlayerName1').style.border='none';

  intelCourseIdx=document.getElementById('intelCourseSelect').value;

  if(intelCourseIdx!=='' && fieldCourses.length>0){
    intelHoles=fieldCourses[intelCourseIdx].holes;
  } else {
    intelHoles=Array.from({length:18},(_,i)=>({number:i+1,par:4,distance:'-'}));
  }

  intelPlayers=names.map(name=>({
    name,
    data: intelHoles.map(h=>({par:h.par,distance:h.distance??'-',score:null,pts:false,teeDir:'',air:false,airDir:'',putts:0,pen:0}))
  }));
  intelHoleIdx=0;
  intelExpandedIdx=0;

  document.getElementById('intelSetup').style.display='none';
  document.getElementById('intelMain').style.display='';
  document.getElementById('intelSummaryBar').classList.add('active');
  renderHoleCard(0);
}

function toggleAccordion(pi){
  intelExpandedIdx = intelExpandedIdx===pi ? -1 : pi;
  renderHoleCard(intelHoleIdx);
}

function goToHole(i){ intelHoleIdx=i; renderHoleCard(i); }

function renderHoleCard(i){
  let totalHoles = intelPlayers[0].data.length;
  let isFirst = i===0;
  let isLast = i===totalHoles-1;
  let holeData0 = intelPlayers[0].data[i]; // par/distance from first player (same for all)

  // Progress dots — done=all scored, partial=some scored, current=this hole
  let dots = Array.from({length:totalHoles},(_,n)=>{
    let scores = intelPlayers.map(p=>p.data[n].score);
    let scored = scores.filter(s=>s!==null).length;
    let cls = n===i ? 'current' : scored===intelPlayers.length ? 'done' : scored>0 ? 'partial' : '';
    return `<div class="hp-dot ${cls}" onclick="goToHole(${n})">${n+1}</div>`;
  }).join('');

  // Build accordion per player
  let accordions = intelPlayers.map((p,pi)=>{
    let h = p.data[i];
    let isOpen = pi===intelExpandedIdx;

    // Tee section (skip on par 3)
    let teeSection = '';
    if(h.par!==3){
      let teeDirRow = !h.pts ? `<div class="miss-dir-row">${['L','R'].map(d=>`<button class="miss-dir-btn ${h.teeDir===d?'active':''}" onclick="holeSetDir(${i},${pi},'teeDir','${d}')">${d}</button>`).join('')}</div>` : '';
      teeSection = `<div class="hole-card-field">
        <div class="hole-card-label">Playable Tee Shot</div>
        <div class="yn-group">
          <button class="yn-btn ${h.pts?'active-yes':''}" onclick="holeToggle(${i},${pi},'pts',true)">✓ Yes</button>
          <button class="yn-btn ${!h.pts?'active-no':''}" onclick="holeToggle(${i},${pi},'pts',false)">✗ No</button>
        </div>
        ${teeDirRow}
      </div>`;
    }

    // App section
    let appDirRow = !h.air ? `<div class="miss-dir-row">${['L','R','S','Lo'].map(d=>`<button class="miss-dir-btn ${h.airDir===d?'active':''}" onclick="holeSetDir(${i},${pi},'airDir','${d}')">${d}</button>`).join('')}</div>` : '';

    let scoreDisplay = h.score!==null ? h.score : '–';
    let scoreClass = h.score!==null ? 'scored' : '';

    return `<div class="player-accordion">
      <div class="player-acc-header ${isOpen?'expanded':''}" onclick="toggleAccordion(${pi})">
        <span class="player-acc-chevron">${isOpen?'▼':'▶'}</span>
        <span class="player-acc-name">${esc(p.name)}</span>
        <span class="player-acc-score ${scoreClass}">${scoreDisplay}</span>
      </div>
      <div class="player-acc-body ${isOpen?'open':''}">
        <div class="hole-card-field">
          <div class="hole-card-label">Score</div>
          <input class="hole-card-score-input" type="number" inputmode="numeric" min="1" max="15"
            value="${h.score!==null?h.score:''}" placeholder="–"
            onchange="holeSetScore(${i},${pi},this.value)">
        </div>
        ${teeSection}
        <div class="hole-card-field">
          <div class="hole-card-label">Approach in Regulation</div>
          <div class="yn-group">
            <button class="yn-btn ${h.air?'active-yes':''}" onclick="holeToggle(${i},${pi},'air',true)">✓ Yes</button>
            <button class="yn-btn ${!h.air?'active-no':''}" onclick="holeToggle(${i},${pi},'air',false)">✗ No</button>
          </div>
          ${appDirRow}
        </div>
        <div class="hole-card-field">
          <div class="putts-pen-row">
            <div>
              <div class="hole-card-label">Putts</div>
              <div class="stepper">
                <button onclick="holeStep(${i},${pi},'putts',-1)">−</button>
                <span>${h.putts}</span>
                <button onclick="holeStep(${i},${pi},'putts',1)">+</button>
              </div>
            </div>
            <div>
              <div class="hole-card-label">Penalties</div>
              <div class="stepper">
                <button onclick="holeStep(${i},${pi},'pen',-1)">−</button>
                <span>${h.pen}</span>
                <button onclick="holeStep(${i},${pi},'pen',1)">+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  let navBack = isFirst
    ? `<button class="field-btn-secondary" style="opacity:.35;pointer-events:none;">← Back</button>`
    : `<button class="field-btn-secondary" onclick="goToHole(${i-1})">← Back</button>`;
  let navNext = isLast
    ? `<button class="field-btn-primary" onclick="promptFinish()">Finish Round →</button>`
    : `<button class="field-btn-primary" onclick="goToHole(${i+1})">Next Hole →</button>`;

  document.getElementById('holeCard').innerHTML = `
    <div class="hole-progress">${dots}</div>
    <div class="hole-card-header">
      <span class="hole-card-num">HOLE ${i+1}</span>
      <span class="hole-card-meta">PAR ${holeData0.par} &nbsp;·&nbsp; ${holeData0.distance} YDS</span>
    </div>
    ${accordions}
    <div class="hole-nav">${navBack}${navNext}</div>`;

  updateIntelSummary();
}

function holeSetScore(i, pi, val){
  intelPlayers[pi].data[i].score = val!==''?parseInt(val):null;
  renderHoleCard(i);
}
function holeToggle(i, pi, key, val){
  let h = intelPlayers[pi].data[i];
  h[key] = val;
  if(val && key==='pts') h.teeDir='';
  if(val && key==='air') h.airDir='';
  renderHoleCard(i);
}
function holeSetDir(i, pi, key, val){
  let h = intelPlayers[pi].data[i];
  h[key] = h[key]===val ? '' : val;
  renderHoleCard(i);
}
function holeStep(i, pi, key, d){
  let h = intelPlayers[pi].data[i];
  h[key] = Math.max(0, h[key]+d);
  renderHoleCard(i);
}

function promptFinish(){
  let anyUnscored = intelPlayers.some(p=>p.data.some(h=>h.score===null));
  if(anyUnscored){
    if(!confirm('Some holes have no score for one or more players. Save anyway?')) return;
  }
  saveRound();
}

function openScorecardModal(){
  scActivePlayer = Math.max(0, intelExpandedIdx);
  renderScorecardTable();
  document.getElementById('scorecardBackdrop').classList.add('open');
  document.getElementById('scorecardPanel').classList.add('open');
}
function renderScorecardTable(){
  let pills = intelPlayers.map((p,pi)=>{
    let active = pi===scActivePlayer;

function populateAnalysisFilters(){
  let rounds=loadRounds();
  let players=[...new Set(rounds.map(r=>r.player))].sort();
  let courses=[...new Set(rounds.map(r=>r.course))].sort();

  let pSel=document.getElementById('analysisPlayerSelect');
  let cSel=document.getElementById('analysisCourseSelect');

  let pVal=pSel.value, cVal=cSel.value;

  pSel.innerHTML='<option value="all">All Players</option>';
  players.forEach(p=>{ let o=document.createElement('option'); o.value=p; o.textContent=p; pSel.appendChild(o); });

  cSel.innerHTML='<option value="all">All Courses</option>';
  courses.forEach(c=>{ let o=document.createElement('option'); o.value=c; o.textContent=c; cSel.appendChild(o); });

  // restore previous selection if still valid
  if([...pSel.options].some(o=>o.value===pVal)) pSel.value=pVal;
  if([...cSel.options].some(o=>o.value===cVal)) cSel.value=cVal;
}

function analysisParFilter(p,btn){

  document.querySelectorAll('#analysisParBtns button').forEach(b=>b.classList.remove('active'));
