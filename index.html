function renderAnalysis(){
  let rounds=loadRounds();
  let playerFilter=document.getElementById('analysisPlayerSelect').value;
  let courseFilter=document.getElementById('analysisCourseSelect').value;

  if(playerFilter!=='all') rounds=rounds.filter(r=>r.player===playerFilter);
  if(courseFilter!=='all') rounds=rounds.filter(r=>r.course===courseFilter);

  let body=document.getElementById('analysisBody');

  if(!rounds.length){
    body.innerHTML='<div class="analysis-empty">No rounds match the selected filters.<br>Enter Intel to start tracking.</div>';
    return;
  }

  // Flatten all hole-entries that match par filter
  let allHoles=[];
  rounds.forEach(r=>{
    r.holes.forEach(h=>{
      if(h.score===null) return;
      if(analysisParSel!=='all'&&h.par!=analysisParSel) return;
      allHoles.push({...h, player:r.player, course:r.course, roundId:r.id});
    });
  });

  if(!allHoles.length){
    body.innerHTML='<div class="analysis-empty">No scored holes match these filters.</div>';
    return;
  }

  // ── Overall stats tile grid ──
  let stats=calcStats(allHoles,'all');
  let totalRounds=rounds.length;
  let avgScore=(allHoles.reduce((s,h)=>s+h.score,0)/allHoles.length);
  let parAvg=(allHoles.reduce((s,h)=>s+h.par,0)/allHoles.length);
  let scoreToPar=avgScore-parAvg;

  let html=`<div class="analysis-section">
    <h4>Overview — ${totalRounds} round${totalRounds!==1?'s':''}, ${allHoles.length} holes</h4>
    <div class="stat-grid">
      <div class="stat-tile">
        <div class="sv ${scoreToPar<=0?'good':'bad'}">${scoreToPar>0?'+':''}${scoreToPar.toFixed(2)}</div>
        <div class="sl">Avg Score to Par</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.firPct>0.6?'good':'bad'}">${Math.round(stats.firPct*100)}%</div>
        <div class="sl">Playable Tee Shot%</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.girPct>0.6?'good':'bad'}">${Math.round(stats.girPct*100)}%</div>
        <div class="sl">Approach in Reg%</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.puttsPerGir===null||stats.puttsPerGir<=1.8?'good':'bad'}">${stats.puttsPerGir===null?'–':stats.puttsPerGir.toFixed(2)}</div>
        <div class="sl">Putts per GIR</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.threePutts===0?'good':'bad'}">${stats.threePutts}</div>
        <div class="sl">3-Putts</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.totalPen<=3?'neutral':'bad'}">${stats.totalPen}</div>
        <div class="sl">Total Penalties</div>
      </div>
      <div class="stat-tile">
        <div class="sv neutral">${allHoles.filter(h=>h.score<h.par).length}</div>
        <div class="sl">Birdies or Better</div>
      </div>
      <div class="stat-tile">
        <div class="sv ${stats.udPct===null?'neutral':stats.udPct>=0.5?'good':'bad'}">${stats.udPct===null?'–':Math.round(stats.udPct*100)+'%'}</div>
        <div class="sl">Up &amp; Down%</div>
      </div>
    </div>
  </div>`;

  // ── Scouting summary ──
  let {insights,strategy}=buildInsights(stats, playerFilter==='all'?'This player':playerFilter);
  html+=`<div class="analysis-section">
    <h4>Scouting Report</h4>
    <div class="field-insights-box">
      <b>${esc(playerFilter==='all'?'All Players':playerFilter)}</b><br>
      ${insights.join(' &nbsp;·&nbsp; ')}<br><br>
      <b>Beat Them:</b><br>${strategy.join('<br>')}
    </div>
  </div>`;

  // ── Per-round breakdown ──
  html+=`<div class="analysis-section">
    <h4>Round History</h4>
    <div class="field-table-wrap">
    <table class="rounds-list-table">
      <thead><tr>
        <th>Date</th>
        ${playerFilter==='all'?'<th>Player</th>':''}
        ${courseFilter==='all'?'<th>Course</th>':''}
        <th>Holes</th><th>+/-</th><th>Tee%</th><th>App%</th><th>U&D%</th><th>P/GIR</th><th>3-Putts</th>
      </tr></thead>
      <tbody>`;

  [...rounds].reverse().forEach(r=>{
    let rHoles=r.holes.filter(h=>{
      if(h.score===null) return false;
      if(analysisParSel!=='all'&&h.par!=analysisParSel) return false;
      return true;
    });
    if(!rHoles.length) return;
    let rs=calcStats(rHoles,'all');
    let rSTP=rHoles.reduce((s,h)=>s+(h.score-h.par),0);
    let date=new Date(r.date).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    html+=`<tr>
      <td>${date}</td>
      ${playerFilter==='all'?`<td>${esc(r.player)}</td>`:''}
      ${courseFilter==='all'?`<td style="font-size:11px">${esc(r.course)}</td>`:''}
      <td>${rHoles.length}</td>
      <td class="${rSTP<=0?'tag-good':'tag-bad'}">${rSTP>0?'+':''}${rSTP}</td>
      <td>${Math.round(rs.firPct*100)}%</td>
      <td>${Math.round(rs.girPct*100)}%</td>
      <td>${rs.udPct===null?'–':Math.round(rs.udPct*100)+'%'}</td>
      <td>${rs.puttsPerGir===null?'–':rs.puttsPerGir.toFixed(1)}</td>
      <td>${rs.threePutts}</td>
    </tr>`;
  });

  html+=`</tbody></table></div></div>`;

  // ── Hole-by-hole breakdown (only when single course selected) ──
  if(courseFilter!=='all'&&analysisParSel==='all'){
    html+=`<div class="analysis-section">
      <h4>Hole-by-Hole Averages</h4>
      <div class="field-table-wrap">
      <table class="hole-breakdown-table">
        <thead><tr><th>#</th><th>Par</th><th>Avg</th><th>+/-</th><th>Tee%</th><th>App%</th><th>U&D%</th><th>P/GIR</th></tr></thead>
        <tbody>`;

    // rebuild per-hole data from rounds
    let holeMap={};
    rounds.forEach(r=>{
      r.holes.forEach((h,i)=>{
        if(h.score===null) return;
        if(!holeMap[i]) holeMap[i]={par:h.par,distance:h.distance,scores:[],fir:0,gir:0,girPutts:0,putts:0,pen:0,count:0,firOpp:0,udOpp:0,udHit:0};
        let hm=holeMap[i];
        hm.scores.push(h.score);
        let hitTee = h.pts !== undefined ? h.pts : h.fir;
        let hitApp = h.air !== undefined ? h.air : h.gir;
        if(h.par!==3){ hm.firOpp++; if(hitTee) hm.fir++; }
        if(hitApp){ hm.gir++; hm.girPutts+=h.putts; }
        hm.putts+=h.putts;
        hm.pen+=h.pen;
        if(!hitApp && h.score<=h.par){ hm.udOpp++; hm.udHit++; }
        else if(!hitApp && h.score!==null){ hm.udOpp++; }
        hm.count++;
      });
    });

    for(let i=0;i<18;i++){
      let hm=holeMap[i];
      if(!hm||!hm.count) continue;
      let avg=hm.scores.reduce((s,v)=>s+v,0)/hm.count;
      let stp=avg-hm.par;
      let fPct=hm.firOpp>0?Math.round(hm.fir/hm.firOpp*100):null;
      let gPct=Math.round(hm.gir/hm.count*100);
      let pgir=hm.gir>0?(hm.girPutts/hm.gir).toFixed(1):'–';
      let udStr=hm.udOpp>0?Math.round(hm.udHit/hm.udOpp*100)+'%':'–';
      let udGood=hm.udOpp>0&&(hm.udHit/hm.udOpp)>=0.5;
      html+=`<tr class="${stp<0?'hb-good':stp>0.5?'hb-bad':''}">
        <td>${i+1}</td><td>${hm.par}</td>
        <td>${avg.toFixed(2)}</td>
        <td class="${stp<=0?'tag-good':'tag-bad'}">${stp>0?'+':''}${stp.toFixed(2)}</td>
        <td>${fPct===null?'–':fPct+'%'}</td>
        <td>${gPct}%</td>
        <td class="${hm.udOpp>0?(udGood?'tag-good':'tag-bad'):''}">${udStr}</td>
        <td>${pgir}</td>
      </tr>`;
    }
    html+=`</tbody></table></div></div>`;
  }

  body.innerHTML=html;
}

/* ══════════════════════════════════
   SHARED STAT HELPERS
   ══════════════════════════════════ */
// holes: array of {par, fir, gir, putts, pen, score}
// parFilter: 'all' | 3 | 4 | 5
function calcStats(holes, parFilter){
  let filtered=holes.filter(h=>{
    if(h.score===null) return false;
    if(parFilter!=='all'&&h.par!=parFilter) return false;
    return true;
  });
  let n=filtered.length||1;
  let firOpp=0,firHit=0,gir=0,girPutts=0,putts=0,pen=0,udOpp=0,udHit=0,threePutts=0;
  let teeDir={L:0,R:0}, appDir={L:0,R:0,S:0,Lo:0};
  filtered.forEach(h=>{
    let hitTee = h.pts !== undefined ? h.pts : h.fir;  // backward compat
    let hitApp = h.air !== undefined ? h.air : h.gir;  // backward compat
    if(h.par!==3){
      firOpp++;
      if(hitTee) firHit++;
      else if(h.teeDir && teeDir[h.teeDir]!==undefined) teeDir[h.teeDir]++;
    }
    if(hitApp){ gir++; girPutts+=h.putts; }
    else if(h.airDir && appDir[h.airDir]!==undefined) appDir[h.airDir]++;
    putts+=h.putts;
    if(h.putts>=3) threePutts++;
    pen+=h.pen;
    if(!hitApp && h.score!==null){
      udOpp++;
      if(h.score<=h.par) udHit++;
    }
  });
  // Dominant miss direction: requires ≥3 tagged misses and one direction ≥60%
  function dominantDir(dirCounts){
    let total=Object.values(dirCounts).reduce((s,v)=>s+v,0);
    if(total<3) return null;
    for(let d of Object.keys(dirCounts)){
      if(dirCounts[d]/total>=0.6) return d;
    }
    return null;
  }
  return {
    n,
    firPct: firHit/(firOpp||1),
    firOpp,
    girPct: gir/n,
    puttsPerGir: gir>0 ? girPutts/gir : null,
    threePutts,
    totalPen: pen,
    udPct: udOpp>0 ? udHit/udOpp : null,
    udOpp,
    holesPlayed: filtered.length,
    teeDirDominant: dominantDir(teeDir),
    appDirDominant: dominantDir(appDir)
  };
}

function buildInsights(stats,name){
  let insights=[],strategy=[];
  const dirLabel={L:'left',R:'right',S:'short',Lo:'long'};
  const oppDir={L:'right',R:'left'};

  // ── Tee game ──
  if(stats.firOpp>=3){
    if(stats.firPct>=0.65){
      insights.push("<span class='tag-good'>Consistent off the tee</span>");
    } else if(stats.firPct>=0.45){
      insights.push("<span class='tag-neutral' style='color:#c8b98c'>Mixed tee shots</span>");
    } else {
      insights.push("<span class='tag-bad'>Erratic driver</span>");
      strategy.push("Tee it up on the trouble side — they're regularly missing fairways");
    }
    if(stats.teeDirDominant){
      let d=stats.teeDirDominant;
      insights.push(`<span class='tag-bad'>Misses tee shots ${dirLabel[d]}</span>`);
      strategy.push(`Hug the ${dirLabel[d]} side off the tee — forces them to carry their miss over trouble`);
    }
  }

  // ── Approach game ──
  if(stats.girPct>=0.6){
    insights.push("<span class='tag-good'>Regularly finding greens</span>");
  } else if(stats.girPct>=0.4){
    insights.push("<span class='tag-neutral' style='color:#c8b98c'>Inconsistent approach play</span>");
    strategy.push("Pick difficult pins — they'll miss enough greens to feel the pressure");
  } else {
    insights.push("<span class='tag-bad'>Struggling to hit greens</span>");
    strategy.push("Attack — their short game is under pressure every hole");
  }
  if(stats.appDirDominant){
    let d=stats.appDirDominant;
    insights.push(`<span class='tag-bad'>Misses approaches ${dirLabel[d]}</span>`);
    if(d==='L'||d==='R') strategy.push(`Play to pins on the ${dirLabel[d]} half of the green — they chip from that side constantly`);
    else if(d==='S') strategy.push("They consistently come up short — back pin positions and firm conditions hurt them");
    else if(d==='Lo') strategy.push("They consistently fly the green — front pins and firm greens are dangerous for them");
  }

  // ── Putting ──
  if(stats.puttsPerGir!==null){
    if(stats.puttsPerGir<=1.7){
      insights.push("<span class='tag-good'>Strong putter on the green</span>");
    } else if(stats.puttsPerGir<=1.9){
      insights.push("<span class='tag-neutral' style='color:#c8b98c'>Average putting</span>");
    } else {
      insights.push("<span class='tag-bad'>Leaking shots on the greens</span>");
      strategy.push("Lag them away from the hole — 3-putts are likely from distance");
    }
  }
  if(stats.threePutts>=3){
    insights.push(`<span class='tag-bad'>${stats.threePutts} three-putts</span>`);
    strategy.push("Keep them on the far side of the hole — distance kills their putting");
  } else if(stats.threePutts>=1&&stats.puttsPerGir!==null&&stats.puttsPerGir>1.8){
    strategy.push(`${stats.threePutts} three-putt${stats.threePutts>1?'s':''} — distance management on approach is key`);
  }

  // ── Short game / scrambling ──
  if(stats.udPct!==null&&stats.udOpp>=3){
    if(stats.udPct>=0.55){
      insights.push("<span class='tag-good'>Reliable scrambler</span>");
    } else if(stats.udPct>=0.35){
      insights.push("<span class='tag-neutral' style='color:#c8b98c'>Average short game</span>");
    } else {
      insights.push("<span class='tag-bad'>Weak short game — rarely saves par</span>");
      strategy.push(`Miss to the difficult side of greens — their up & down rate is ${Math.round(stats.udPct*100)}%`);
    }
  }

  // ── Penalties ──
  if(stats.totalPen>=5){
    insights.push("<span class='tag-bad'>Penalty prone — finds trouble often</span>");
    strategy.push("Play conservatively — let them rack up penalty strokes");
  } else if(stats.totalPen>=3){
    insights.push("<span class='tag-bad'>Takes penalties</span>");
    strategy.push("Stay patient — they'll give strokes away");
  }

  if(!strategy.length) strategy.push("Balanced player — no obvious weakness to exploit");
  return {insights,strategy};
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        if(finalMatch.result.score){
          let parts = finalMatch.result.score.split(' · ');
          parts.forEach(p=>{ if(p.startsWith(finalMatch.result.winnerName+' ')) winScore=p.slice(finalMatch.result.winnerName.length+1); else if(p.startsWith(finalMatch.result.loserName+' ')) loseScore=p.slice(finalMatch.result.loserName.length+1); });
        }
        positions.push({medal:'🥇', name:finalMatch.result.winnerName, score:winScore});
        positions.push({medal:'🥈', name:finalMatch.result.loserName, score:loseScore});
      }
      if(losersMatch?.result){
        let winScore = '', loseScore = '';
        if(losersMatch.result.score){
          let parts = losersMatch.result.score.split(' · ');
          parts.forEach(p=>{ if(p.startsWith(losersMatch.result.winnerName+' ')) winScore=p.slice(losersMatch.result.winnerName.length+1); else if(p.startsWith(losersMatch.result.loserName+' ')) loseScore=p.slice(losersMatch.result.loserName.length+1); });
        }
        positions.push({medal:'🥉', name:losersMatch.result.winnerName, score:winScore});
        positions.push({medal:'4th', name:losersMatch.result.loserName, score:loseScore});
      }
      if(!positions.length){
        let done = matches.filter(m=>m.result).length;
        return `<div style="font-size:11px;color:rgba(255,255,255,0.3);padding:6px 0;">${done}/${matches.length} matches played</div>`;
      }
      let header = `<div style="font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);padding:8px 0 4px;">Standings</div>`;
      return header + positions.map((p,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;">
          <span style="color:${i===0?'#ffd447':'rgba(255,255,255,0.75)'};">
            <span style="font-family:'Courier New',monospace;font-size:11px;color:rgba(255,212,71,0.4);margin-right:6px;">${i+1}</span>${esc(p.name)}</span>
          ${p.score?`<span style="font-family:'Courier New',monospace;font-weight:bold;color:${i===0?'#ffd447':'rgba(255,255,255,0.5)'};">${esc(p.score)}</span>`:''}
        </div>`).join('');
    }

    function buildStandingsDetail(s){
      if(!s.rounds||!s.rounds.length) return '<div style="font-size:11px;color:rgba(255,255,255,0.3);padding:6px 0;">No rounds played yet</div>';
      let totals = s.players.map((p,i)=>({name:p.name, pts:0}));
      s.rounds.forEach(r=>{
        (r.playerFinishes||[]).forEach(f=>{
          if(f && totals[f.playerIdx]) totals[f.playerIdx].pts += f.points||0;
        });
      });
      totals.sort((a,b)=>b.pts-a.pts);
      return totals.map((p,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;">
          <span style="color:${i===0?'#ffd447':'rgba(255,255,255,0.75)'};">
            <span style="font-family:'Courier New',monospace;font-size:11px;color:rgba(255,212,71,0.4);margin-right:6px;">${i+1}</span>${esc(p.name)}</span>
          <span style="font-family:'Courier New',monospace;font-weight:bold;color:${i===0?'#ffd447':'rgba(255,255,255,0.6)'};">${p.pts%1===0?p.pts:p.pts.toFixed(1)} pts</span>
        </div>`).join('');
    }

    let expanded = new Set();

    function render(){
      let html = '';
      seasons.forEach(s=>{
        let isBracket = !!s.bracketMode;
        let isActive = s.status === 'active';
        let statusDot = isActive
          ? '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#2ecc71;margin-right:5px;"></span>'
          : '';
        let metaLine = isBracket
          ? (() => { let done=(s.matches||[]).filter(m=>m.result).length, total=(s.matches||[]).length; return done===total&&total>0?`${total} matches complete`:`${done}/${total} matches played`; })()
          : (s.seasonLength ? `${(s.rounds||[]).length}/${s.seasonLength} rounds` : `${(s.rounds||[]).length} round${(s.rounds||[]).length!==1?'s':''}`) + ` · ${s.players.length} players`;

        let typeLabel = isBracket
          ? (s.bracketType==='team'?'Team':'Solo')+' Bracket'
          : 'Tournament';
        let dateStr = s.createdAt ? new Date(s.createdAt).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : '';
        let winnerLine = buildWinnerLine(s);

        let isExp = expanded.has(s.id);
        let detail = isExp ? (isBracket ? buildBracketDetail(s) : buildStandingsDetail(s)) : '';

        html += `<div class="rcard${isExp?' expanded':''}" onclick="toggleTourneyCard(${s.id})">
          <div class="rcard-body">
            <div class="rcard-top">
              <span class="rcard-game">🏆 ${esc(typeLabel)} · ${s.players.length} players</span>
              <span class="rcard-date">${dateStr}</span>
            </div>
            <div class="rcard-mid">
              <div class="rcard-info">
                <div class="rcard-course">${statusDot}${esc(s.name)}</div>
</div>
              ${!isExp && winnerLine ? `<div style="text-align:right;flex-shrink:0;max-width:130px;margin-left:12px;">${winnerLine}</div>` : ''}
            </div>
          </div>
          <div class="rcard-expand">
            ${detail}
            <div class="rcard-expand-footer">
              <a href="tournaments.html?id=${s.id}" onclick="event.stopPropagation()" style="font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:rgba(255,212,71,0.6);text-decoration:none;">Open Tournament ›</a>
            </div>
          </div>
        </div>`;
      });
      el.innerHTML = html;

      window.toggleTourneyCard = function(id){
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        render();
      };
    }

    render();
  }catch(e){}
})();

</script>
</body>
</html>
