<html lang="en">
<head>
<meta charset="UTF-8">

<title>Intel</title>

<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#8B6914;
  --gold-dim:#a07840;--gold-faint:rgba(255,212,71,0.08);
  --accent:#ffd447;--text:#fff;--muted:rgba(255,255,255,0.45);
  --green-ok:#2ecc71;--red:#ff4d4d;
  --emerald:#2d9e6b;--ruby:#c0404a;
  --bar-hi:#2d9e6b;--bar-mid:#3a6899;--bar-lo:#4a6070;--bar-warn:#c0404a;
  --texture:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px);
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Georgia','Times New Roman',serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
input,button{font:inherit;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* ── Layout ── */
#shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;padding-bottom:calc(64px + max(env(safe-area-inset-bottom),12px));}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── Page header ── */
.page-header{padding:14px 16px 6px;font-size:22px;font-weight:bold;color:var(--gold);letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;flex-shrink:0;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ── Screens ── */
.wscreen{display:none;flex-direction:column;flex:1;min-height:0;}
.wscreen.active{display:flex;}

/* ── Dossier screen (scrollable) ── */
.dossier-scroll{flex:1;overflow-y:auto;padding:10px 14px 20px;}
.empty-state{text-align:center;color:rgba(255,255,255,0.35);padding:50px 20px;font-size:14px;line-height:2;}

/* ── Dossier cards ── */
.player-card{background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-user-select:none;}
.player-header:active{background:rgba(255,212,71,0.04);}
.player-name{font-size:16px;font-weight:bold;color:var(--gold);}
.player-rounds{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;}
.player-chevron{font-size:11px;color:rgba(255,212,71,0.4);transition:transform .2s;}
.player-body{border-top:1px solid rgba(255,212,71,0.1);}
.insight-section{padding:8px 14px 10px;}
.insight-section+.insight-section{padding-top:8px;}
.insight-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.section-divider{display:flex;align-items:center;justify-content:center;gap:0;padding:18px 14px 12px;}
.section-divider::before,.section-divider::after{content:'';flex:0 0 60px;height:1px;background:rgba(255,212,71,0.45);}
.section-divider-label{font-size:13px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.9);white-space:nowrap;padding:0 12px;border-left:2px solid rgba(255,212,71,0.55);border-right:2px solid rgba(255,212,71,0.55);}
.insight-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.45);}
.insight-verdict{font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
.verdict-threat{background:rgba(45,158,107,0.18);color:#4dda9a;border:1px solid rgba(45,158,107,0.4);}
.verdict-good{background:rgba(180,30,42,0.22);color:#e8445a;border:1px solid rgba(180,30,42,0.45);}
.verdict-neutral{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);}
.insight-bullets{list-style:none;margin:0;padding:0;}
.insight-bullets li{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.45;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04);}
.insight-bullets li:last-child{border-bottom:none;}
.insight-bullets li::before{content:'·';position:absolute;left:4px;color:rgba(255,212,71,0.45);font-size:16px;line-height:1;}
.insight-bullets li strong{color:#fff;}

/* ── Pill nav ── */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#080f0a 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(14,26,18,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active{color:#ffd447;}

</style>
</head>
<body>
<div id="shell">
  <div id="content">

    <div class="page-header">
      <span>Scout</span>
    </div>

    <div class="wscreen active" id="wscreen-dossier">
      <div class="dossier-scroll" id="scrollArea">
        <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">Analysing…</div>
      </div>
    </div>

  </div>
</div>

<!-- ── Pill nav ── -->
<nav class="bottom-nav">
  <div class="nav-pill">
    <a class="nav-item active" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/><line x1="4" y1="14" x2="20" y2="14" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
      Rounds
    </a>
    <a class="nav-item" href="start.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="8.5" r=".8" fill="currentColor" stroke="none"/><circle cx="14.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/></svg>
      Play
    </a>
    <a class="nav-item" href="caddy.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      Caddy
    </a>
    <a class="nav-item active" href="dossier.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="13" r="4"/><circle cx="17" cy="13" r="4"/><path d="M7 9V6l3-3h4l3 3v3"/><line x1="11" y1="13" x2="13" y2="13"/></svg>
      Scout
    </a>
  </div>
</nav>

<script>
// ── Shared helpers ────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }
function pct(n,d){ return d ? Math.round(n/d*100) : 0; }

// ════════════════════════════════════════════════════════════════
// DOSSIER
function renderDossier(){
  try{ analyse(); }catch(e){
    document.getElementById('scrollArea').innerHTML=`<div class="empty-state">Error loading dossier.<br><small style="font-size:11px;opacity:.5;">${e.message}</small></div>`;
  }
}

function analyse(){
  let all=loadHistory();
  let area=document.getElementById('scrollArea');
  let players={};

  function ensurePlayer(name){
    if(!players[name]) players[name]={
      rounds:0,
      scoreDist:{eagle:0,birdie:0,par:0,bogey:0,double:0,worse:0,total:0},
      sfZeros:0,sf1pt:0,sf2pts:0,sf3pts:0,sf4pts:0,sfHoles:0,
      bankerNet:0,bankerPlayerHoles:0,bankerWins:0,
      bankerBankerHoles:0,bankerSweeps:0,
      pinWins:0,pinHoles:0,netMoney:0,
      statHoles:0,statPutts:0,stat3Putt:0,statGIR:0,statFIR:0,statUaDOpps:0,statUaDMade:0,statPenalties:0,statOOP:0,statDblChip:0,
      hcpDiffs:[]
    };
    return players[name];
  }

  function trackDist(p,diff){
    p.scoreDist.total++;
    if(diff<=-2) p.scoreDist.eagle++;
    else if(diff===-1) p.scoreDist.birdie++;
    else if(diff===0) p.scoreDist.par++;
    else if(diff===1) p.scoreDist.bogey++;
    else if(diff===2) p.scoreDist.double++;
    else p.scoreDist.worse++;
  }

  function processBankerSideBet(r){
    if(!r.bankerHistory||!r.players) return;
    r.bankerHistory.forEach(h=>{
      let bn=r.players[h.bankerIdx];
      if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}
      (h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});
    });
    r.players.forEach((n,i)=>{let net=r.bkPlayerNetTotals?.[i]||0;ensurePlayer(n).bankerNet+=net;ensurePlayer(n).netMoney+=net;});
  }

  function processPinSideBet(r){
    if(!r.pinHistory||!r.players) return;
    r.pinHistory.forEach(h=>{
      if(h.winner==null) return;
      let wn=r.players[h.winner];if(wn)ensurePlayer(wn).pinWins++;
      r.players.forEach(n=>ensurePlayer(n).pinHoles++);
    });
    r.players.forEach((n,i)=>{ensurePlayer(n).netMoney+=r.pinNetTotals?.[i]||0;});
  }

  all.filter(r=>r.game==='stableford'&&r.players&&r.scoreHistory&&r.holeParDist).forEach(r=>{
    let pd=r.holeParDist, roundPar=pd.length?pd.reduce((s,h)=>s+(h.par||4),0):null;
    let slope=r.courseSlope||113, rating=r.courseRating||(roundPar||72);
    r.players.forEach((name,pi)=>{
      let p=ensurePlayer(name);p.rounds++;
      let roundScore=0;
      r.scoreHistory.forEach((hole,hi)=>{
        let score=hole[pi],par=pd[hi]?.par;if(score==null||!par)return;
        let diff=score-par;
        p.sfHoles++;
        if(diff>=2)p.sfZeros++;else if(diff===1)p.sf1pt++;else if(diff===0)p.sf2pts++;else if(diff===-1)p.sf3pts++;else p.sf4pts++;
        trackDist(p,diff);
        roundScore+=score;
      });
      if(roundPar) p.hcpDiffs.push(+((roundScore-rating)*113/slope).toFixed(1));
    });
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='stroke'&&r.players&&r.scoreHistory&&r.holeParDist).forEach(r=>{
    let pd=r.holeParDist, roundPar=pd.length?pd.reduce((s,h)=>s+(h.par||4),0):null;
    let slope=r.courseSlope||113, rating=r.courseRating||(roundPar||72);
    r.players.forEach((name,pi)=>{
      let p=ensurePlayer(name);p.rounds++;
      let roundScore=0;
      r.scoreHistory.forEach((hole,hi)=>{
        let score=hole[pi],par=pd[hi]?.par;if(score==null||!par)return;
        let diff=score-par;
        trackDist(p,diff);
        roundScore+=score;
      });
      if(roundPar) p.hcpDiffs.push(+((roundScore-rating)*113/slope).toFixed(1));
    });
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='scramble'&&r.players).forEach(r=>{
    r.players.forEach(name=>{ensurePlayer(name).rounds++;});
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='banker'&&r.players&&r.holeHistory).forEach(r=>{
    r.players.forEach(name=>{ensurePlayer(name).rounds++;});
    (r.holeHistory||[]).forEach(h=>{
      let bn=r.players[h.bankerIdx];
      if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}
      (h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});
    });
    r.players.forEach((n,i)=>{let p=ensurePlayer(n);p.bankerNet+=r.playerNetTotals?.[i]||0;p.netMoney+=r.playerNetTotals?.[i]||0;});
  });

  all.filter(r=>r.game==='mixed'&&r.players).forEach(r=>{
    r.players.forEach((n,i)=>{let p=ensurePlayer(n);p.rounds++;p.netMoney+=r.moneyNet?.[i]||0;});
    (r.holeHistory||[]).forEach(h=>{
      if(!h.par) return;
      if(h.format!=='pin'){r.players.forEach((n,i)=>{let score=h.scores?.[i];if(score==null)return;let p=ensurePlayer(n);let diff=score-h.par;trackDist(p,diff);});}
      if(h.format==='stableford'){r.players.forEach((n,i)=>{let score=h.scores?.[i];if(score==null)return;let p=ensurePlayer(n);let diff=score-h.par;p.sfHoles++;if(diff>=2)p.sfZeros++;else if(diff===1)p.sf1pt++;else if(diff===0)p.sf2pts++;else if(diff===-1)p.sf3pts++;else p.sf4pts++;});}
      if(h.format==='banker'){let bn=r.players[h.bankerIdx];if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}(h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});}
      if(h.format==='pin'&&h.pinWinner){ensurePlayer(h.pinWinner).pinWins++;r.players.forEach(n=>ensurePlayer(n).pinHoles++);}
    });
  });

  all.filter(r=>r.players&&r.holeParDist&&r.scoreHistory).forEach(r=>{
    r.holeParDist.forEach((h,hi)=>{
      if(!h.checked||!h.putts) return;
      r.players.forEach((name,pi)=>{
        if(!h.checked[pi]) return;
        let p=ensurePlayer(name);
        let score=r.scoreHistory[hi]?.[pi];
        p.statHoles++;
        p.statPutts+=h.putts[pi]||0;
        if((h.putts[pi]||0)>=3) p.stat3Putt++;
        if(h.fir&&h.fir[pi]) p.statFIR++;
        if(h.gir&&h.gir[pi]) p.statGIR++;
        else {
          p.statUaDOpps++;
          if(score!=null&&score<=h.par) p.statUaDMade++;
        }
        p.statPenalties+=h.penalties?.[pi]||0;
        if(h.oop&&h.oop[pi]) p.statOOP++;
        if(h.dblChip&&h.dblChip[pi]) p.statDblChip++;
      });
    });
  });

  let playerNames=Object.keys(players).filter(n=>Object.values(players[n]).some(v=>typeof v==='number'&&v!==0));
  if(!playerNames.length){area.innerHTML='<div class="empty-state">No round data yet.<br>Play some rounds to unlock dossiers.</div>';return;}
  playerNames.sort((a,b)=>players[b].rounds-players[a].rounds);

  let html=``;
  playerNames.forEach((name,idx)=>{
    let p=players[name], id='pc-'+idx;
    html+=`<div class="player-card">
      <div class="player-header" onclick="toggleCard('${id}')">
        <div><div class="player-name">${esc(name)}</div><div class="player-rounds">${p.rounds} round${p.rounds!==1?'s':''} on record</div></div>
        <span class="player-chevron" id="${id}-chev">▼</span>
      </div>
      <div class="player-body" id="${id}" style="display:none;">${buildInsights(name,p,players)}</div>
    </div>`;
  });
  area.innerHTML=html;
}

function toggleCard(id){
  let body=document.getElementById(id),chev=document.getElementById(id+'-chev'),open=body.style.display==='none';
  body.style.display=open?'block':'none';chev.style.transform=open?'rotate(180deg)':'';
}

function hcpIndex(diffs){
  if(!diffs.length) return null;
  let recent=diffs.slice(-20),sorted=[...recent].sort((a,b)=>a-b);
  let use=Math.min(8,Math.max(1,Math.floor(recent.length*0.4)));
  return +(sorted.slice(0,use).reduce((s,d)=>s+d,0)/use*0.96).toFixed(1);
}

function buildInsights(name,p,allPlayers){
  let sections='';
  function sectionDiv(label){return `<div class="section-divider"><span class="section-divider-label">${label}</span></div>`;}

  let hcp=hcpIndex(p.hcpDiffs);
  if(hcp!==null){
    let hcpColor=hcp<=18?'var(--bar-hi)':hcp<=28?'var(--bar-mid)':'rgba(255,255,255,0.7)';
    sections+=`<div style="text-align:center;padding:14px 0 6px;">
      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:6px;">Handicap Index</div>
      <div style="font-size:36px;font-weight:bold;color:${hcpColor};font-family:'Georgia',serif;">${hcp}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.25);margin-top:3px;">based on ${p.hcpDiffs.length} round${p.hcpDiffs.length!==1?'s':''}</div>
    </div>`;
  }

  if(p.statHoles>=3){
    let firPct=pct(p.statFIR,p.statHoles);
    let girPct=pct(p.statGIR,p.statHoles);
    let avgPutts=(p.statPutts/p.statHoles).toFixed(1);
    let threePuttPct=pct(p.stat3Putt,p.statHoles);

    let firColor=firPct>=60?'var(--bar-hi)':firPct>=30?'var(--bar-mid)':'var(--bar-lo)';
    let girColor=girPct>=60?'var(--bar-hi)':girPct>=30?'var(--bar-mid)':'var(--bar-lo)';
    let threePuttColor=threePuttPct>=20?'var(--bar-warn)':threePuttPct<=10?'var(--bar-hi)':'var(--bar-mid)';

    let statRows=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;">
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">FIR</div>
          <div style="font-size:20px;font-weight:bold;color:${firColor};">${firPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.statFIR}/${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">GIR</div>
          <div style="font-size:20px;font-weight:bold;color:${girColor};">${girPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.statGIR}/${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">Putts / Hole</div>
          <div style="font-size:20px;font-weight:bold;color:rgba(255,255,255,0.8);">${avgPutts}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">over ${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">3-Putt Rate</div>
          <div style="font-size:20px;font-weight:bold;color:${threePuttColor};">${threePuttPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.stat3Putt} holes</div>
        </div>
      </div>`;
    sections+=`${sectionDiv('Round Stats')}<div class="insight-section">${statRows}</div>`;
  }

  return (sections||`<div style="padding:16px 14px;font-size:13px;color:rgba(255,255,255,0.3);">Not enough data yet.</div>`)+'<div style="height:6px;"></div>';
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
renderDossier();
</script>
