<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Intel</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#8B6914;
  --gold-dim:#a07840;--gold-faint:rgba(255,212,71,0.08);
  --accent:#ffd447;--text:#fff;--muted:rgba(255,255,255,0.45);
  --green-ok:#2ecc71;--red:#ff4d4d;
  --emerald:#2d9e6b;--ruby:#c0404a;
  --bar-hi:#2d9e6b;--bar-mid:#3a6899;--bar-lo:#4a6070;--bar-warn:#c0404a;
  --texture:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px);
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Georgia','Times New Roman',serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
input,button{font:inherit;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* ── Layout ── */
#shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;padding-bottom:calc(64px + max(env(safe-area-inset-bottom),12px));}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── Page header ── */
.page-header{padding:14px 16px 6px;font-size:22px;font-weight:bold;color:var(--gold);letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;flex-shrink:0;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ── Tab bar ── */
#tab-bar{display:flex;margin:0 16px 4px;background:var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;overflow:hidden;flex-shrink:0;}
.wtab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-dim);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-user-select:none;border:none;background:none;}
.wtab.active{color:var(--gold);border-bottom:2px solid var(--gold);}

/* ── Screens ── */
.wscreen{display:none;flex-direction:column;flex:1;min-height:0;}
.wscreen.active{display:flex;}

/* ── Dossier screen (scrollable) ── */
.dossier-scroll{flex:1;overflow-y:auto;padding:10px 14px 20px;}
.empty-state{text-align:center;color:rgba(255,255,255,0.35);padding:50px 20px;font-size:14px;line-height:2;}

/* ── Dossier cards ── */
.player-card{background:var(--texture),var(--bg-card);border:1px solid rgba(255,212,71,0.2);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-user-select:none;}
.player-header:active{background:rgba(255,212,71,0.04);}
.player-name{font-size:16px;font-weight:bold;color:var(--gold);}
.player-rounds{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;}
.player-chevron{font-size:11px;color:rgba(255,212,71,0.4);transition:transform .2s;}
.player-body{border-top:1px solid rgba(255,212,71,0.1);}
.insight-section{padding:8px 14px 10px;}
.insight-section+.insight-section{padding-top:8px;}
.insight-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.section-divider{display:flex;align-items:center;justify-content:center;gap:0;padding:18px 14px 12px;}
.section-divider::before,.section-divider::after{content:'';flex:0 0 60px;height:1px;background:rgba(255,212,71,0.45);}
.section-divider-label{font-size:13px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.9);white-space:nowrap;padding:0 12px;border-left:2px solid rgba(255,212,71,0.55);border-right:2px solid rgba(255,212,71,0.55);}
.insight-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.45);}
.insight-verdict{font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
.verdict-threat{background:rgba(45,158,107,0.18);color:#4dda9a;border:1px solid rgba(45,158,107,0.4);}
.verdict-good{background:rgba(180,30,42,0.22);color:#e8445a;border:1px solid rgba(180,30,42,0.45);}
.verdict-neutral{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);}
.insight-bullets{list-style:none;margin:0;padding:0;}
.insight-bullets li{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.45;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04);}
.insight-bullets li:last-child{border-bottom:none;}
.insight-bullets li::before{content:'·';position:absolute;left:4px;color:rgba(255,212,71,0.45);font-size:16px;line-height:1;}
.insight-bullets li strong{color:#fff;}
.par-bars{display:flex;gap:8px;margin-top:4px;padding:0 2px;}
.par-bar-wrap{flex:1;text-align:center;}
.par-bar-label{font-size:9px;color:rgba(255,255,255,0.75);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.par-bar-track{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;position:relative;width:80%;margin:0 auto;}
.par-bar-track::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,0.25);z-index:1;}
.par-bar-track.no-mid::after{display:none;}
.par-bar-fill{position:absolute;top:0;height:100%;}
.par-bar-val{font-size:11px;color:rgba(255,255,255,0.6);margin-top:3px;}

/* ── Dispersion (Shots tab) ── */
.disp-stab{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,212,71,0.18);background:transparent;color:var(--gold-dim);font-size:11px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .12s;}
.disp-stab.active{background:rgba(255,212,71,0.1);border-color:rgba(255,212,71,0.5);color:var(--gold);}
.disp-chip{padding:3px 8px;border-radius:5px;border:1px solid rgba(255,212,71,0.18);background:transparent;color:var(--gold-dim);font-size:9px;font-weight:bold;letter-spacing:.2px;cursor:pointer;font-family:inherit;text-align:center;transition:all .12s;line-height:1.3;white-space:nowrap;min-width:32px;}
.disp-chip.active{background:rgba(255,212,71,0.12);border-color:rgba(255,212,71,0.55);color:var(--gold);}
.disp-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
#disp-view-log,#disp-view-map{flex:1;min-height:0;}

/* ── Pill nav ── */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#080f0a 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(14,26,18,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active{color:#ffd447;}

</style>
</head>
<body>
<div id="shell">
  <div id="content">

    <div class="page-header">
      <span>Intel</span>
    </div>

    <!-- Tab bar -->
    <div id="tab-bar">
      <button class="wtab active" data-tab="shots">Shots</button>
      <button class="wtab" data-tab="dossier">Dossier</button>
    </div>

    <!-- ── SHOTS SCREEN ── -->
    <div class="wscreen active" id="wscreen-shots" style="position:relative;">
      <div style="display:flex;gap:8px;padding:10px 16px 8px;flex-shrink:0;align-items:center;">
        <button class="disp-stab active" data-view="log">Log Shot</button>
        <button class="disp-stab" data-view="map">View Map</button>
      </div>

      <div class="disp-wrap">
        <!-- Log Shot sub-view -->
        <div id="disp-view-log" style="padding:8px 16px 8px 16px;display:flex;flex-direction:row;gap:8px;overflow:hidden;align-items:flex-start;position:relative;flex:1;min-height:0;">
          <div id="disp-log-msg" style="position:absolute;bottom:12px;left:0;right:60px;text-align:center;font-size:11px;color:var(--green-ok);pointer-events:none;"></div>

          <!-- Maps column (left) -->
          <div style="display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;min-width:0;">
            <!-- Landing map -->
            <div id="disp-landing-col" style="display:flex;flex-direction:column;align-items:center;">
              <div id="disp-landing-wrap" style="display:flex;align-items:center;justify-content:center;">
                <canvas id="disp-landing-canvas" style="border-radius:8px;cursor:crosshair;touch-action:none;border:1px solid rgba(255,212,71,0.12);"></canvas>
              </div>
            </div>
            <!-- First putt input -->
            <div style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;">
              <span style="font-size:9px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:rgba(255,212,71,0.4);">1st Putt</span>
              <input id="disp-putt-input" type="number" inputmode="numeric" min="1" max="999" placeholder="—" style="width:48px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,212,71,0.12);border-radius:6px;color:rgba(255,255,255,0.7);font-size:13px;font-family:'Georgia','Times New Roman',serif;padding:3px 6px;outline:none;text-align:center;">
              <span style="font-size:9px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:rgba(255,212,71,0.4);">ft</span>
            </div>
            <!-- Approach map -->
            <div id="disp-approach-col" style="display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;">
              <div id="disp-approach-wrap" style="display:flex;align-items:center;justify-content:center;">
                <canvas id="disp-approach-canvas" style="border-radius:8px;cursor:crosshair;touch-action:none;border:1px solid rgba(255,212,71,0.12);"></canvas>
              </div>
            </div>
          </div>

          <!-- Club list (right) -->
          <div id="disp-right-col" style="width:52px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;">
            <div id="disp-club-list" style="display:contents;"></div>
            <button id="disp-save-btn" style="width:100%;flex:1;min-height:0;border-radius:6px;border:none;font-size:16px;line-height:1;background:rgba(74,180,100,0.08);color:rgba(74,180,100,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;" disabled>✓</button>
            <button id="disp-clear-shot-btn" style="width:100%;flex:1;min-height:0;border-radius:6px;border:none;font-size:13px;font-weight:bold;background:rgba(255,77,77,0.06);color:rgba(255,77,77,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;" disabled>✕</button>
          </div>
        </div>

        <!-- View Map sub-view -->
        <div id="disp-view-map" style="display:none;padding:8px 16px 8px 16px;flex-direction:row;gap:8px;overflow:hidden;align-items:flex-start;flex:1;min-height:0;">
          <!-- Maps column (left) -->
          <div style="display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:center;">
              <canvas id="disp-map-canvas" style="border-radius:8px;border:1px solid rgba(255,212,71,0.12);cursor:pointer;touch-action:none;"></canvas>
            </div>
            <div id="disp-avg-putt" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;"></div>
            <div style="position:relative;display:flex;align-items:center;justify-content:center;">
              <canvas id="disp-map-approach-canvas" style="border-radius:8px;border:1px solid rgba(255,212,71,0.12);touch-action:none;"></canvas>
              <div id="disp-shot-bubble" style="display:none;position:absolute;z-index:10;background:#0e1a12;border:1px solid rgba(255,212,71,0.35);border-radius:8px;padding:4px 10px;pointer-events:none;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,0.7);">
                <span id="disp-shot-club" style="font-size:11px;font-weight:bold;color:var(--gold);letter-spacing:.4px;"></span>
                <span id="disp-shot-dist" style="font-size:11px;color:rgba(255,255,255,0.45);margin-left:6px;"></span>
              </div>
            </div>
          </div>
          <!-- Club filter + clear (right) -->
          <div id="disp-map-right-col" style="width:52px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;">
            <div id="disp-filter-scroll" style="display:contents;"></div>
            <button id="disp-clear-btn" style="width:100%;flex:1;min-height:0;border-radius:6px;border:none;font-size:12px;font-weight:bold;background:rgba(255,77,77,0.08);color:rgba(255,77,77,0.4);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .12s;">✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── DOSSIER SCREEN ── -->
    <div class="wscreen" id="wscreen-dossier">
      <div class="dossier-scroll" id="scrollArea">
        <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">Analysing…</div>
      </div>
    </div>

  </div>
</div>

<!-- ── Pill nav ── -->
<nav class="bottom-nav">
  <div class="nav-pill">
    <a class="nav-item active" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/><line x1="4" y1="14" x2="20" y2="14" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
      Rounds
    </a>
    <a class="nav-item" href="start.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="8.5" r=".8" fill="currentColor" stroke="none"/><circle cx="14.5" cy="10.5" r=".8" fill="currentColor" stroke="none"/></svg>
      Play
    </a>
    <a class="nav-item" href="caddy.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      Caddy
    </a>
    <a class="nav-item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      Stats
    </a>
  </div>
</nav>

<script>
// ── Shared helpers ────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }
function pct(n,d){ return d ? Math.round(n/d*100) : 0; }

// ── Tab switching ─────────────────────────────────────────────────
document.getElementById('tab-bar').addEventListener('click', e=>{
  const btn = e.target.closest('.wtab'); if(!btn) return;
  document.querySelectorAll('.wtab').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('.wscreen').forEach(s=>s.classList.remove('active'));
  document.getElementById('wscreen-'+btn.dataset.tab).classList.add('active');
  if(btn.dataset.tab === 'shots') dispActivate();
  if(btn.dataset.tab === 'dossier') renderDossier();
});

// ════════════════════════════════════════════════════════════════
// SHOTS DISPERSION
// ════════════════════════════════════════════════════════════════
const CLUBS = [
  { id:'driver', label:'Driver' },
  { id:'5w',     label:'5 Wood' },
  { id:'4h',     label:'4 Hybrid' },
  { id:'5i',     label:'5 Iron' },
  { id:'6i',     label:'6 Iron' },
  { id:'7i',     label:'7 Iron' },
  { id:'8i',     label:'8 Iron' },
  { id:'9i',     label:'9 Iron' },
  { id:'pw',     label:'PW' },
  { id:'aw',     label:'AW' },
  { id:'sw',     label:'SW' },
];
const DISP_COLORS = ['#5c3317','#8B5E3C','#C4915A','#ffd447','#fff0a0','#ffffff','#b8e8a0','#4db87a','#2e9e5e','#88b8a0','#909090'];

function dispLoad(){ try{ return JSON.parse(localStorage.getItem('shotDispersion')||'[]'); }catch(e){ return []; } }
function dispSave(arr){ localStorage.setItem('shotDispersion', JSON.stringify(arr)); }

function dispAllClubs(){
  try{
    const s = JSON.parse(localStorage.getItem('club-caddy-v3')||'null');
    const custom = s?.customClubs || [];
    return [...CLUBS, ...custom.map(c=>({id:'custom_'+c.label, label:c.label}))];
  }catch(e){ return CLUBS; }
}
function dispClubLabel(id){ const c = dispAllClubs().find(c=>c.id===id); return c ? c.label : id; }
function dispClubColor(id){ const clubs = dispAllClubs(); const idx = clubs.findIndex(c=>c.id===id); return DISP_COLORS[idx < 0 ? 0 : idx % DISP_COLORS.length]; }

const CLUB_SHORT = {driver:'DRV','5w':'5W','4h':'4H','5i':'5I','6i':'6I','7i':'7I','8i':'8I','9i':'9I',pw:'PW',aw:'AW',sw:'SW'};
function dispClubShort(id){ return CLUB_SHORT[id] || dispClubLabel(id).replace(/\s+/g,'').substring(0,3).toUpperCase(); }

function dispSetupCanvas(canvas, cssW, cssH){
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); return ctx;
}

const DISP_MAX_YARDS = 250;
function dispYToYards(normY){ return Math.round(normY * DISP_MAX_YARDS / 5) * 5; }
function dispYardsToNormY(yds){ return yds / DISP_MAX_YARDS; }

function dispLogCanvasSize(){
  const view = document.getElementById('disp-view-log');
  if(!view) return {aw:140,ah:100,lw:140,lh:140};
  const availW = view.clientWidth - 32 - 52 - 8;
  const availH = view.clientHeight - 16 - 30 - 8;
  let lh, ah;
  if(availH > 100){ lh = Math.min(availW, Math.round((availH-8)*0.42)); ah = availH-8-lh; }
  else { lh = Math.round(availW*0.45); ah = Math.round(availW*0.7); }
  return {aw:availW, ah, lw:availW, lh};
}

function dispMapCanvasSize(){
  const view = document.getElementById('disp-view-map') || document.getElementById('disp-view-log');
  if(!view || view.clientWidth === 0) return {aw:140,ah:100,lw:140,lh:140};
  const availW = view.clientWidth - 32 - 52 - 8;
  const availH = view.clientHeight - 16 - 30 - 8;
  let lh, ah;
  if(availH > 100){ lh = Math.min(availW, Math.round((availH-8)*0.42)); ah = availH-8-lh; }
  else { lh = Math.round(availW*0.45); ah = Math.round(availW*0.7); }
  return {aw:availW, ah, lw:availW, lh};
}

function dispSyncRightColHeight(){
  const sl = dispLogCanvasSize();
  const col = document.getElementById('disp-right-col');
  if(col) col.style.height = (sl.lh+8+30+8+sl.ah)+'px';
  const sm = dispMapCanvasSize();
  const mapCol = document.getElementById('disp-map-right-col');
  if(mapCol) mapCol.style.height = (sm.lh+8+30+8+sm.ah)+'px';
}

function dispDrawApproach(canvas, dot, cssW, cssH){
  if(!cssW||!cssH){ const s=dispLogCanvasSize(); cssW=s.aw; cssH=s.ah; }
  const ctx=dispSetupCanvas(canvas,cssW,cssH), w=cssW, h=cssH;
  ctx.fillStyle='#122618'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(40,90,50,0.35)'; ctx.lineWidth=1;
  const fwGrass=w*0.6, fxGrass=(w-fwGrass)/2, roughW=fxGrass;
  const cols=Math.floor(roughW/14), rows=Math.floor(h/22);
  for(let r=0;r<=rows;r++) for(let c=0;c<cols;c++){
    const offset=(r%2)*7;
    const lx=6+c*14+offset, ly=8+r*22;
    ctx.beginPath();ctx.moveTo(lx-2,ly+3);ctx.lineTo(lx,ly-3);ctx.lineTo(lx+2,ly+3);ctx.stroke();
    const rx=fxGrass+fwGrass+6+c*14+offset, ry=ly;
    ctx.beginPath();ctx.moveTo(rx-2,ry+3);ctx.lineTo(rx,ry-3);ctx.lineTo(rx+2,ry+3);ctx.stroke();
  }
  const fw=w*0.6, fx=(w-fw)/2;
  ctx.fillStyle='#1e4d2e'; ctx.fillRect(fx,0,fw,h);
  ctx.fillStyle='rgba(46,140,70,0.18)'; ctx.fillRect(fx+fw*0.2,0,fw*0.6,h);
  ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(255,212,71,0.12)'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke(); ctx.setLineDash([]);
  [50,100,150,200,250].forEach(yds=>{
    const py=dispYardsToNormY(yds)*h;
    ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(255,212,71,0.22)'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(w,py);ctx.stroke(); ctx.setLineDash([]);
    ctx.font='bold 9px Georgia'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(255,212,71,0.55)';
    ctx.textAlign='left'; ctx.fillText(yds+'y',3,py-5);
  });
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(w/2-8,h-10,16,3);
  if(dot){
    const px=dot.x*w, py=dot.y*h;
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);
    ctx.fillStyle='#ffd447';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    const yds=dispYToYards(dot.y), label=yds+' yds';
    ctx.font='10px Georgia'; ctx.textBaseline='middle';
    const tw=ctx.measureText(label).width, lx=px-tw/2, ly=py+16, pad=4;
    ctx.fillStyle='rgba(8,15,10,0.75)';
    ctx.beginPath();ctx.roundRect(lx-pad,ly-9,tw+pad*2,18,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(label,lx,ly);
  }
}

function dispDrawGreen(canvas, dot, cssW, cssH){
  if(!cssW||!cssH){ const s=dispLogCanvasSize(); cssW=s.lw; cssH=s.lh; }
  const ctx=dispSetupCanvas(canvas,cssW,cssH), w=cssW, h=cssH, cx=w/2, cy=h/2;
  const gw=w*0.48, gh=h*0.62, fw=gw*1.18, fh=gh*1.28, gr=gh*0.38, fr=fh*0.28;
  ctx.fillStyle='#122618'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(40,90,50,0.35)'; ctx.lineWidth=1;
  [[0.08,0.12],[0.18,0.22],[0.06,0.55],[0.14,0.78],[0.09,0.88],
   [0.88,0.10],[0.92,0.32],[0.85,0.60],[0.91,0.82],[0.82,0.92],
   [0.25,0.06],[0.5,0.04],[0.72,0.07],[0.3,0.94],[0.55,0.96],[0.75,0.93],
   [0.04,0.38],[0.96,0.50],[0.07,0.70],[0.93,0.70]].forEach(([gx,gy])=>{
    const px=gx*w,py=gy*h;
    ctx.beginPath();ctx.moveTo(px-2,py+3);ctx.lineTo(px,py-3);ctx.lineTo(px+2,py+3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+4,py+3);ctx.lineTo(px+5,py-2);ctx.lineTo(px+7,py+3);ctx.stroke();
  });
  ctx.beginPath();ctx.roundRect(cx-fw/2,cy-fh/2,fw,fh,fr);ctx.fillStyle='rgba(30,100,50,0.5)';ctx.fill();
  ctx.beginPath();ctx.roundRect(cx-gw/2,cy-gh/2,gw,gh,gr);ctx.fillStyle='#1e4d2e';ctx.fill();
  ctx.save();ctx.beginPath();ctx.roundRect(cx-gw/2,cy-gh/2,gw,gh,gr);ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(cx,cy-gh/2);ctx.lineTo(cx,cy+gh/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-gw/2,cy);ctx.lineTo(cx+gw/2,cy);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
  if(dot){
    const px=dot.x*w, py=dot.y*h;
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);
    ctx.fillStyle='#ffd447';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  }
}

function dispDrawMap(shots, highlightShot){
  const canvas=document.getElementById('disp-map-canvas'); if(!canvas) return;
  const {lw,lh}=dispMapCanvasSize();
  dispDrawGreen(canvas,null,lw,lh);
  const ctx2=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
  ctx2.save();ctx2.setTransform(dpr,0,0,dpr,0,0);
  dispRenderedDots=[];
  shots.forEach((s,i)=>{
    let px=s.landingX*lw, py=s.landingY*lh;
    dispRenderedDots.forEach(d=>{ if(Math.hypot(px-d.cx,py-d.cy)<16) px+=12; });
    const isHighlit=highlightShot&&s===highlightShot;
    const color=dispClubColor(s.club);
    ctx2.beginPath();ctx2.arc(px,py,isHighlit?8:6,0,Math.PI*2);
    ctx2.fillStyle=isHighlit?'#fff':color;ctx2.fill();
    if(isHighlit){ctx2.strokeStyle=color;ctx2.lineWidth=2;ctx2.stroke();}
    dispRenderedDots.push({cx:px,cy:py,shot:s,num:i+1});
  });
  ctx2.restore();
}

function dispDrawMapApproach(highlightShot){
  const canvas=document.getElementById('disp-map-approach-canvas'); if(!canvas) return;
  const {aw,ah}=dispMapCanvasSize();
  dispDrawApproach(canvas,null,aw,ah);
  const shots=dispApplyFilters(dispMapShots);
  dispRenderedApproachDots=[];
  if(!shots.length) return;
  const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
  ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
  shots.forEach(s=>{
    if(s.approachX==null||s.approachY==null) return;
    const px=s.approachX*aw, py=s.approachY*ah;
    const isHighlit=highlightShot&&s===highlightShot;
    const color=dispClubColor(s.club);
    ctx.beginPath();ctx.arc(px,py,isHighlit?8:6,0,Math.PI*2);
    ctx.fillStyle=isHighlit?'#fff':color;ctx.fill();
    if(isHighlit){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();}
    dispRenderedApproachDots.push({cx:px,cy:py,shot:s});
  });
  ctx.restore();
}

// DOSSIER
// ════════════════════════════════════════════════════════════════
function renderDossier(){
  try{ analyse(); }catch(e){
    document.getElementById('scrollArea').innerHTML=`<div class="empty-state">Error loading dossier.<br><small style="font-size:11px;opacity:.5;">${e.message}</small></div>`;
  }
}

function analyse(){
  let all=loadHistory();
  let area=document.getElementById('scrollArea');
  let players={};

  function ensurePlayer(name){
    if(!players[name]) players[name]={
      rounds:0,
      parBreak:{3:{diff:0,holes:0},4:{diff:0,holes:0},5:{diff:0,holes:0}},
      scoreDist:{eagle:0,birdie:0,par:0,bogey:0,double:0,worse:0,total:0},
      sfZeros:0,sf1pt:0,sf2pts:0,sf3pts:0,sf4pts:0,sfHoles:0,
      bankerNet:0,bankerPlayerHoles:0,bankerWins:0,
      bankerBankerHoles:0,bankerSweeps:0,
      pinWins:0,pinHoles:0,netMoney:0,
      statHoles:0,statPutts:0,stat3Putt:0,statGIR:0,statFIR:0,statUaDOpps:0,statUaDMade:0,statPenalties:0,statOOP:0,statDblChip:0,
      hcpDiffs:[]
    };
    return players[name];
  }

  function trackDist(p,diff){
    p.scoreDist.total++;
    if(diff<=-2) p.scoreDist.eagle++;
    else if(diff===-1) p.scoreDist.birdie++;
    else if(diff===0) p.scoreDist.par++;
    else if(diff===1) p.scoreDist.bogey++;
    else if(diff===2) p.scoreDist.double++;
    else p.scoreDist.worse++;
  }

  function processBankerSideBet(r){
    if(!r.bankerHistory||!r.players) return;
    r.bankerHistory.forEach(h=>{
      let bn=r.players[h.bankerIdx];
      if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}
      (h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});
    });
    r.players.forEach((n,i)=>{let net=r.bkPlayerNetTotals?.[i]||0;ensurePlayer(n).bankerNet+=net;ensurePlayer(n).netMoney+=net;});
  }

  function processPinSideBet(r){
    if(!r.pinHistory||!r.players) return;
    r.pinHistory.forEach(h=>{
      if(h.winner==null) return;
      let wn=r.players[h.winner];if(wn)ensurePlayer(wn).pinWins++;
      r.players.forEach(n=>ensurePlayer(n).pinHoles++);
    });
    r.players.forEach((n,i)=>{ensurePlayer(n).netMoney+=r.pinNetTotals?.[i]||0;});
  }

  all.filter(r=>r.game==='stableford'&&r.players&&r.scoreHistory&&r.holeParDist).forEach(r=>{
    let pd=r.holeParDist, roundPar=pd.length?pd.reduce((s,h)=>s+(h.par||4),0):null;
    let slope=r.courseSlope||113, rating=r.courseRating||(roundPar||72);
    r.players.forEach((name,pi)=>{
      let p=ensurePlayer(name);p.rounds++;
      let roundScore=0;
      r.scoreHistory.forEach((hole,hi)=>{
        let score=hole[pi],par=pd[hi]?.par;if(score==null||!par)return;
        let diff=score-par;
        p.parBreak[par]&&(p.parBreak[par].diff+=diff,p.parBreak[par].holes++);
        p.sfHoles++;
        if(diff>=2)p.sfZeros++;else if(diff===1)p.sf1pt++;else if(diff===0)p.sf2pts++;else if(diff===-1)p.sf3pts++;else p.sf4pts++;
        trackDist(p,diff);
        roundScore+=score;
      });
      if(roundPar) p.hcpDiffs.push(+((roundScore-rating)*113/slope).toFixed(1));
    });
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='stroke'&&r.players&&r.scoreHistory&&r.holeParDist).forEach(r=>{
    let pd=r.holeParDist, roundPar=pd.length?pd.reduce((s,h)=>s+(h.par||4),0):null;
    let slope=r.courseSlope||113, rating=r.courseRating||(roundPar||72);
    r.players.forEach((name,pi)=>{
      let p=ensurePlayer(name);p.rounds++;
      let roundScore=0;
      r.scoreHistory.forEach((hole,hi)=>{
        let score=hole[pi],par=pd[hi]?.par;if(score==null||!par)return;
        let diff=score-par;
        p.parBreak[par]&&(p.parBreak[par].diff+=diff,p.parBreak[par].holes++);
        trackDist(p,diff);
        roundScore+=score;
      });
      if(roundPar) p.hcpDiffs.push(+((roundScore-rating)*113/slope).toFixed(1));
    });
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='scramble'&&r.players).forEach(r=>{
    r.players.forEach(name=>{ensurePlayer(name).rounds++;});
    processBankerSideBet(r);processPinSideBet(r);
  });

  all.filter(r=>r.game==='banker'&&r.players&&r.holeHistory).forEach(r=>{
    r.players.forEach(name=>{ensurePlayer(name).rounds++;});
    (r.holeHistory||[]).forEach(h=>{
      let bn=r.players[h.bankerIdx];
      if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}
      (h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});
    });
    r.players.forEach((n,i)=>{let p=ensurePlayer(n);p.bankerNet+=r.playerNetTotals?.[i]||0;p.netMoney+=r.playerNetTotals?.[i]||0;});
  });

  all.filter(r=>r.game==='mixed'&&r.players).forEach(r=>{
    r.players.forEach((n,i)=>{let p=ensurePlayer(n);p.rounds++;p.netMoney+=r.moneyNet?.[i]||0;});
    (r.holeHistory||[]).forEach(h=>{
      if(!h.par) return;
      if(h.format!=='pin'){r.players.forEach((n,i)=>{let score=h.scores?.[i];if(score==null)return;let p=ensurePlayer(n);let diff=score-h.par;p.parBreak[h.par]&&(p.parBreak[h.par].diff+=diff,p.parBreak[h.par].holes++);trackDist(p,diff);});}
      if(h.format==='stableford'){r.players.forEach((n,i)=>{let score=h.scores?.[i];if(score==null)return;let p=ensurePlayer(n);let diff=score-h.par;p.sfHoles++;if(diff>=2)p.sfZeros++;else if(diff===1)p.sf1pt++;else if(diff===0)p.sf2pts++;else if(diff===-1)p.sf3pts++;else p.sf4pts++;});}
      if(h.format==='banker'){let bn=r.players[h.bankerIdx];if(bn){let bp=ensurePlayer(bn);bp.bankerBankerHoles++;if((h.matchups||[]).filter(m=>m.result==='player').length===0)bp.bankerSweeps++;}(h.matchups||[]).forEach(m=>{let n=r.players[m.playerIdx];if(!n)return;let p=ensurePlayer(n);p.bankerPlayerHoles++;if(m.result==='player')p.bankerWins++;});}
      if(h.format==='pin'&&h.pinWinner){ensurePlayer(h.pinWinner).pinWins++;r.players.forEach(n=>ensurePlayer(n).pinHoles++);}
    });
  });

  all.filter(r=>r.players&&r.holeParDist&&r.scoreHistory).forEach(r=>{
    r.holeParDist.forEach((h,hi)=>{
      if(!h.checked||!h.putts) return;
      r.players.forEach((name,pi)=>{
        if(!h.checked[pi]) return;
        let p=ensurePlayer(name);
        let score=r.scoreHistory[hi]?.[pi];
        p.statHoles++;
        p.statPutts+=h.putts[pi]||0;
        if((h.putts[pi]||0)>=3) p.stat3Putt++;
        if(h.fir&&h.fir[pi]) p.statFIR++;
        if(h.gir&&h.gir[pi]) p.statGIR++;
        else {
          p.statUaDOpps++;
          if(score!=null&&score<=h.par) p.statUaDMade++;
        }
        p.statPenalties+=h.penalties?.[pi]||0;
        if(h.oop&&h.oop[pi]) p.statOOP++;
        if(h.dblChip&&h.dblChip[pi]) p.statDblChip++;
      });
    });
  });

  let playerNames=Object.keys(players).filter(n=>Object.values(players[n]).some(v=>typeof v==='number'&&v!==0));
  if(!playerNames.length){area.innerHTML='<div class="empty-state">No round data yet.<br>Play some rounds to unlock dossiers.</div>';return;}
  playerNames.sort((a,b)=>players[b].rounds-players[a].rounds);

  let html=``;
  playerNames.forEach((name,idx)=>{
    let p=players[name], id='pc-'+idx;
    html+=`<div class="player-card">
      <div class="player-header" onclick="toggleCard('${id}')">
        <div><div class="player-name">${esc(name)}</div><div class="player-rounds">${p.rounds} round${p.rounds!==1?'s':''} on record</div></div>
        <span class="player-chevron" id="${id}-chev">▼</span>
      </div>
      <div class="player-body" id="${id}" style="display:none;">${buildInsights(name,p,players)}</div>
    </div>`;
  });
  area.innerHTML=html;
}

function toggleCard(id){
  let body=document.getElementById(id),chev=document.getElementById(id+'-chev'),open=body.style.display==='none';
  body.style.display=open?'block':'none';chev.style.transform=open?'rotate(180deg)':'';
}

function hcpIndex(diffs){
  if(!diffs.length) return null;
  let recent=diffs.slice(-20),sorted=[...recent].sort((a,b)=>a-b);
  let use=Math.min(8,Math.max(1,Math.floor(recent.length*0.4)));
  return +(sorted.slice(0,use).reduce((s,d)=>s+d,0)/use*0.96).toFixed(1);
}

function buildInsights(name,p,allPlayers){
  let sections='';
  function sectionDiv(label){return `<div class="section-divider"><span class="section-divider-label">${label}</span></div>`;}

  let hcp=hcpIndex(p.hcpDiffs);
  if(hcp!==null){
    let hcpColor=hcp<=18?'var(--bar-hi)':hcp<=28?'var(--bar-mid)':'rgba(255,255,255,0.7)';
    sections+=`<div style="text-align:center;padding:14px 0 6px;">
      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:6px;">Handicap Index</div>
      <div style="font-size:36px;font-weight:bold;color:${hcpColor};font-family:'Georgia',serif;">${hcp}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.25);margin-top:3px;">based on ${p.hcpDiffs.length} round${p.hcpDiffs.length!==1?'s':''}</div>
    </div>`;
  }
  let parData=[3,4,5].map(par=>{let d=p.parBreak[par];return{par,avg:d.holes?d.diff/d.holes:null,holes:d.holes};}).filter(d=>d.holes>0);
  if(parData.length){
    let barHtml='<div class="par-bars">';
    [3,4,5].forEach(par=>{
      let d=p.parBreak[par];
      if(!d.holes){barHtml+=`<div class="par-bar-wrap"><div class="par-bar-label">Par ${par}</div><div class="par-bar-track"><div class="par-bar-fill" style="width:0%;background:rgba(255,255,255,0.1);"></div></div><div class="par-bar-val">—</div></div>`;return;}
      let avg=d.diff/d.holes,dispStr=(avg>=0?'+':'')+avg.toFixed(1);
      let color=avg<-0.1?'var(--bar-hi)':avg<0.5?'var(--bar-mid)':avg<1.2?'var(--bar-warn)':'var(--bar-lo)';
      let halfPct=Math.min(50,Math.abs(avg)/2*50);
      let fillStyle=avg<0?`left:${50-halfPct}%;width:${halfPct}%;background:${color};border-radius:3px 0 0 3px;`:`left:50%;width:${halfPct}%;background:${color};border-radius:0 3px 3px 0;`;
      barHtml+=`<div class="par-bar-wrap"><div class="par-bar-label">Par ${par}</div><div class="par-bar-track"><div class="par-bar-fill" style="${fillStyle}"></div></div><div class="par-bar-val" style="color:${color};">${dispStr}</div></div>`;
    });
    barHtml+='</div>';
    sections+=`${sectionDiv('Scoring by Par')}<div class="insight-section">${barHtml}</div>`;
  }

  if(p.statHoles>=3){
    let firPct=pct(p.statFIR,p.statHoles);
    let girPct=pct(p.statGIR,p.statHoles);
    let avgPutts=(p.statPutts/p.statHoles).toFixed(1);
    let threePuttPct=pct(p.stat3Putt,p.statHoles);

    let firColor=firPct>=60?'var(--bar-hi)':firPct>=30?'var(--bar-mid)':'var(--bar-lo)';
    let girColor=girPct>=60?'var(--bar-hi)':girPct>=30?'var(--bar-mid)':'var(--bar-lo)';
    let threePuttColor=threePuttPct>=20?'var(--bar-warn)':threePuttPct<=10?'var(--bar-hi)':'var(--bar-mid)';

    let statRows=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;">
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">FIR</div>
          <div style="font-size:20px;font-weight:bold;color:${firColor};">${firPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.statFIR}/${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">GIR</div>
          <div style="font-size:20px;font-weight:bold;color:${girColor};">${girPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.statGIR}/${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">Putts / Hole</div>
          <div style="font-size:20px;font-weight:bold;color:rgba(255,255,255,0.8);">${avgPutts}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">over ${p.statHoles} holes</div>
        </div>
        <div style="background:rgba(0,0,0,0.25);border-radius:8px;padding:10px 12px;text-align:center;">
          <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:4px;">3-Putt Rate</div>
          <div style="font-size:20px;font-weight:bold;color:${threePuttColor};">${threePuttPct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${p.stat3Putt} holes</div>
        </div>
      </div>`;
    sections+=`${sectionDiv('Round Stats')}<div class="insight-section">${statRows}</div>`;
  }

  return (sections||`<div style="padding:16px 14px;font-size:13px;color:rgba(255,255,255,0.3);">Not enough data yet.</div>`)+'<div style="height:6px;"></div>';
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
