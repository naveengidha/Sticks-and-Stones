<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Standings</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#5c3317;--font:'Georgia','Times New Roman',serif;}
body{font-family:var(--font);background:var(--bg);margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;overscroll-behavior:none;}

.tab-bar{display:flex;background:var(--bg-card);border-bottom:1px solid rgba(255,212,71,0.15);flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,212,71,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-user-select:none;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── Scroll area ── */
.scroll-area{flex:1;overflow-y:auto;padding:0 14px 110px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.empty-state{text-align:center;color:rgba(255,255,255,0.35);padding:50px 20px;font-size:14px;line-height:2;}

/* ── Season cards ── */
.season-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.25);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:#fff;display:block;transition:border-color .15s;}
.season-card:hover,.season-card:active{border-color:rgba(255,212,71,0.6);}
.season-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.season-name{font-size:14px;font-weight:bold;color:var(--gold);letter-spacing:.3px;}
.season-status{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
.season-status.active{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3);}
.season-status.complete{background:rgba(255,212,71,0.12);color:var(--gold);border:1px solid rgba(255,212,71,0.25);}
.season-meta{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;}
.season-progress{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.season-progress-fill{height:100%;background:#2eb450;border-radius:2px;transition:width .3s;}
.season-players{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.s-chip{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.55);}
.s-chip.leader{background:rgba(255,212,71,0.15);color:var(--gold);font-weight:bold;}

/* ── Round cards ── */
.round-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:13px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.round-card:hover,.round-card:active{border-color:rgba(255,212,71,0.55);}
.round-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.round-game{font-size:12px;font-weight:bold;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;}
.round-date{font-size:11px;color:rgba(255,255,255,0.38);}
.round-course{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.round-players{display:flex;flex-wrap:wrap;gap:4px;}
.player-chip{font-size:10px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);}
.player-chip.winner{background:rgba(255,212,71,0.14);color:var(--gold);font-weight:bold;}
.expand-chevron{font-size:9px;color:rgba(255,212,71,0.35);margin-left:5px;display:inline-block;transition:transform .2s;}
.round-card.expanded .expand-chevron{transform:rotate(180deg);}
.round-expand{display:none;margin-top:10px;border-top:1px solid rgba(255,212,71,0.1);padding-top:10px;overflow-x:auto;}
.round-card.expanded .round-expand{display:block;}
.round-expand table{width:100%;border-collapse:collapse;font-size:11px;}
.round-expand th{background:rgba(0,0,0,0.4);color:var(--gold);border:1px solid rgba(139,94,60,0.15);padding:5px 4px;text-align:center;font-size:9px;letter-spacing:.8px;text-transform:uppercase;}
.round-expand th:first-child{text-align:left;}
.round-expand td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:11px;}
.round-expand td:first-child{color:rgba(255,212,71,0.55);font-family:inherit;}
.round-expand tfoot td{background:rgba(0,0,0,0.3);color:var(--gold);font-weight:bold;}
.round-footer{display:flex;justify-content:flex-end;margin-top:7px;}
.edit-link{font-size:11px;color:rgba(255,212,71,0.5);text-decoration:none;border:1px solid rgba(255,212,71,0.18);border-radius:4px;padding:2px 8px;}

/* ── Insights ── */
.section-title{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.55);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(255,212,71,0.12);}
.section-title:first-child{margin-top:0;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-tile{background:var(--bg-card);border:2px solid var(--border);border-top:3px solid var(--gold);border-radius:8px;padding:12px;text-align:center;}
.stat-tile .sv{font-size:22px;font-weight:bold;color:var(--gold);font-family:'Courier New',monospace;}
.stat-tile .sl{font-size:9px;color:rgba(255,212,71,0.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.ins-panel{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;margin-bottom:18px;overflow:hidden;}
.ins-panel-title{color:var(--gold);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px 7px;border-bottom:1px solid rgba(255,212,71,0.1);}
.ins-row{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
.ins-row:last-child{border-bottom:none;}
.ins-name{font-weight:bold;flex:1;}
.ins-val{font-weight:bold;color:var(--gold);}
.ins-muted{font-size:11px;color:rgba(255,255,255,0.85);}
.tag-good{color:#1a9e5c;font-weight:bold;}
.tag-bad{color:#c0392b;font-weight:bold;}
.sboard{width:100%;border-collapse:collapse;font-size:13px;padding:4px 0;}
.sboard th{font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:#a07840;padding:8px 12px 6px;border-bottom:1px solid rgba(255,212,71,0.1);white-space:nowrap;user-select:none;}
.sboard th:hover{color:#ffd447;background:rgba(255,212,71,0.05);}
.sboard th .sort-arrow{color:#ffd447;transition:opacity .15s;}
.sboard td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;vertical-align:top;}
.sboard tr:last-child td{border-bottom:none;}
.rank-num{display:inline-block;width:18px;font-size:11px;color:rgba(255,255,255,0.85);}
.mono{font-family:'Georgia','Times New Roman',serif;}
.hcp-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.hcp-card-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.hcp-card-header:active{background:rgba(255,212,71,0.04);}
.hcp-player{font-size:15px;font-weight:bold;color:#ffd447;}
.hcp-index{font-size:20px;font-weight:bold;color:#ffd447;font-family:'Courier New',monospace;}
.hcp-index-label{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,212,71,0.45);text-align:right;margin-top:1px;}
.hcp-chevron{font-size:11px;color:rgba(255,212,71,0.4);margin-left:10px;transition:transform .2s;}
.hcp-body{display:none;border-top:1px solid rgba(255,212,71,0.1);}
.hcp-body.open{display:block;}
.sboard tr.hcp-counting td{background:rgba(255,212,71,0.06);}
.sboard tr.hcp-counting .hcp-diff{color:#ffd447;font-weight:bold;}
.sboard tr.hcp-dimmed td{opacity:0.45;}
.hcp-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#ffd447;margin-right:5px;vertical-align:middle;}
/* ── Section label ── */
.rounds-section-label{font-size:13px;font-weight:bold;letter-spacing:.5px;color:#ffd447;padding:14px 2px 6px;}
/* ── Pill nav ── */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#080f0a 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(14,26,18,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active{color:#ffd447;}

.page-header{padding:16px 16px 4px;font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;text-align:center;}
</style>
</head>
<body>

<div class="page-header">Standings</div>

<div class="scroll-area">
  <div id="insightsContent"></div>
</div>

<script src="season.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

const GAME_LABELS = {
  stableford:'Stableford', banker:'Banker',
  matchplay:'Match Play', scramble:'Scramble', stroke:'Stroke Play'
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d) return ''; let dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function fmtVsPar(v){ return v>0?'+'+v:v===0?'E':String(v); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }

/* ══════════════════════════════════════
   STANDINGS TAB
══════════════════════════════════════ */
function sboardTable(headers, rows, tableId){
  let n = headers.length;
  let statW = n > 3 ? Math.floor(52/(n-2)) : 20;
  let cols = `<colgroup><col style="width:5%"><col style="width:${100-5-(statW*(n-2))}%">${headers.slice(2).map(()=>`<col style="width:${statW}%">`).join('')}</colgroup>`;
  let th = headers.map((h,i)=>`<th data-col="${i}" style="text-align:${i===0||i===1?'left':'right'};${i===headers.length-1?'padding-right:12px;':''}cursor:pointer;">${h}<span class="sort-arrow" style="opacity:0;margin-left:3px;font-size:8px;"></span></th>`).join('');
  let makeRow = (r)=>{
    let cells = Array.isArray(r) ? r : r.cells;
    let vals  = Array.isArray(r) ? null : r.vals;
    let dataAttrs = vals ? vals.map((v,i)=>`data-v${i}="${String(v).replace(/"/g,'&quot;')}"`).join(' ') : '';
    let tds = cells.map((c,i)=>`<td style="text-align:${i===0||i===1?'left':'right'};${i===cells.length-1?'padding-right:12px;':''}">${c}</td>`).join('');
    return `<tr ${dataAttrs}>${tds}</tr>`;
  };
  let tbody = rows.map(makeRow).join('');
  let id = tableId ? `id="${tableId}"` : '';
  return `<table class="sboard" ${id}>${cols}<thead><tr>${th}</tr></thead><tbody>${tbody}</tbody></table>`;
}

function attachSortHandlers(table){
  if(!table) return;
  let state = {col:-1, dir:1};
  table.querySelector('thead').addEventListener('click', e=>{
    let th = e.target.closest('th[data-col]');
    if(!th) return;
    let col = +th.dataset.col;
    if(state.col === col) state.dir *= -1;
    else { state.col = col; state.dir = 1; }
    // update arrows
    table.querySelectorAll('th[data-col] .sort-arrow').forEach((a,i)=>{
      if(i === col){ a.textContent = state.dir===1?'▲':'▼'; a.style.opacity='1'; }
      else { a.textContent=''; a.style.opacity='0'; }
    });
    // sort rows
    let tbody = table.querySelector('tbody');
    let trs = [...tbody.querySelectorAll('tr')];
    trs.sort((a,b)=>{
      let av = a.dataset['v'+col], bv = b.dataset['v'+col];
      if(av===undefined||bv===undefined) return 0;
      let an = parseFloat(av), bn = parseFloat(bv);
      let cmp = (!isNaN(an)&&!isNaN(bn)) ? an-bn : av.localeCompare(bv);
      return cmp * state.dir;
    });
    // re-number rank column (col 0) if present
    trs.forEach((tr,i)=>{
      let rankCell = tr.querySelector('td:first-child .rank-num');
      if(rankCell) rankCell.textContent = i+1;
    });
    trs.forEach(tr=>tbody.appendChild(tr));
  });
}

function renderInsights(){
  let el = document.getElementById('insightsContent');
  let all = loadHistory();
  if(!all.length){
    el.innerHTML = '<div class="empty-state">No rounds saved yet.<br>Finish a game to see standings here.</div>';
    return;
  }

  // Collect all known players
  let playerSet = new Set();
  all.forEach(r=>{ if(r.players) r.players.forEach(n=>{ if(n) playerSet.add(n); }); });
  let players = [...playerSet];

  // ── Table 1: Player Summary ──────────────────────────────────
  // For each player: rounds played, avg score vs par, best round, worst round, handicap index
  let summary = {};
  players.forEach(n=>{ summary[n]={rounds:0,totalScore:0,totalPar:0,parRounds:0,best:null,worst:null,diffs:[]}; });

  let strokeAndStab = all.filter(r=>(r.game==='stroke'||r.game==='stableford') && r.players && r.playerTotals);
  strokeAndStab.forEach(r=>{
    let pd = r.holeParDist||[];
    let par = pd.length ? pd.reduce((s,h)=>s+(h.par||4),0) : null;
    let slope = r.courseSlope||113, rating = r.courseRating||(par||72);
    r.players.forEach((name,i)=>{
      if(!name||!summary[name]) return;
      let raw = r.playerTotals[i];
      if(!raw) return;
      // for stableford, reconstruct raw stroke score from scoreHistory
      let score = raw;
      if(r.game==='stableford' && r.scoreHistory && r.scoreHistory.length){
        score = r.scoreHistory.reduce((s,hole)=>s+(hole[i]??0),0);
      }
      summary[name].rounds++;
      summary[name].totalScore += score;
      if(par){
        summary[name].totalPar += par;
        summary[name].parRounds++;
        let diff = +((score - rating)*113/slope).toFixed(1);
        summary[name].diffs.push(diff);
        let vp = score - par;
        if(summary[name].best===null || vp < summary[name].best) summary[name].best = vp;
        if(summary[name].worst===null || vp > summary[name].worst) summary[name].worst = vp;
      } else {
        if(summary[name].best===null || score < summary[name].best) summary[name].best = score;
        if(summary[name].worst===null || score > summary[name].worst) summary[name].worst = score;
      }
    });
  });

  // Compute handicap index
  function hcpIndex(diffs){
    if(!diffs.length) return null;
    let recent = diffs.slice(-20);
    let sorted = [...recent].sort((a,b)=>a-b);
    let use = Math.min(8, Math.max(1, Math.floor(recent.length*0.4)));
    return +(sorted.slice(0,use).reduce((s,d)=>s+d,0)/use*0.96).toFixed(1);
  }

  let summaryPlayers = players.filter(n=>summary[n].rounds>0)
    .sort((a,b)=>{
      let pa=summary[a], pb=summary[b];
      let avgA = pa.parRounds>0?(pa.totalScore-pa.totalPar)/pa.parRounds:pa.totalScore/pa.rounds;
      let avgB = pb.parRounds>0?(pb.totalScore-pb.totalPar)/pb.parRounds:pb.totalScore/pb.rounds;
      return avgA-avgB;
    });

  let hasPar = summaryPlayers.some(n=>summary[n].parRounds>0);

  let summaryRows = summaryPlayers.map((name,rank)=>{
    let p = summary[name];
    let avgDisp, bestDisp, worstDisp;
    if(p.parRounds>0){
      let avg = (p.totalScore-p.totalPar)/p.parRounds;
      avgDisp = `<span class="${avg<0?'tag-good':avg>0?'tag-bad':'ins-muted'}">${avg>=0?'+':''}${avg.toFixed(1)}</span>`;
      bestDisp = `<span class="tag-good">${p.best>0?'+':''}${p.best}</span>`;
      worstDisp = `<span class="tag-bad">${p.worst>0?'+':''}${p.worst}</span>`;
    } else {
      avgDisp = `<span class="ins-muted">${(p.totalScore/p.rounds).toFixed(1)}</span>`;
      bestDisp = `<span class="ins-muted">${p.best??'—'}</span>`;
      worstDisp = `<span class="ins-muted">${p.worst??'—'}</span>`;
    }
    let hcp = hcpIndex(p.diffs);
    let hcpDisp = hcp===null?'—':String(hcp);
    let avgVal = p.parRounds>0 ? (p.totalScore-p.totalPar)/p.parRounds : p.totalScore/p.rounds;
    return {
      cells: [
        `<span class="rank-num">${rank+1}</span>`,
        `<span style="font-weight:bold">${esc(name)}</span>`,
        avgDisp,
        bestDisp,
        worstDisp,
        `<span class="ins-muted">${hcpDisp}</span>`,
        `<span class="ins-muted">${p.rounds}</span>`
      ],
      vals: [rank+1, name, avgVal, p.best??9999, p.worst??-9999, hcp??9999, p.rounds]
    };
  });

  // ── Table 2: Format Standings ────────────────────────────────
  let fmt = {};
  players.forEach(n=>{ fmt[n]={sfRnds:0,sfTotal:0,sfWins:0,scrWins:0,scrRnds:0,bkNet:0,bkRnds:0,pinWins:0,pinPar3s:0}; });

  // Stableford
  all.filter(r=>r.game==='stableford'&&r.players&&r.playerTotals).forEach(r=>{
    let max=Math.max(...r.playerTotals);
    r.players.forEach((name,i)=>{
      if(!name||!fmt[name]) return;
      fmt[name].sfRnds++;
      fmt[name].sfTotal += r.playerTotals[i]||0;
      if(r.playerTotals[i]===max) fmt[name].sfWins++;
    });
  });

  // Scramble wins (count per player on winning team)
  all.filter(r=>r.game==='scramble'&&r.teamScores&&r.players).forEach(r=>{
    let min=Math.min(...r.teamScores);
    let winTi = r.teamScores.indexOf(min);
    // unique winner only
    if(r.teamScores.filter(s=>s===min).length!==1) return;
    let getTeam = ti => {
      if(Array.isArray(r.scrTeams?.a)&&Array.isArray(r.scrTeams?.b)) return ti===0?r.scrTeams.a:r.scrTeams.b;
      if(r.players) return [r.players[ti*2],r.players[ti*2+1]].filter(Boolean);
      return [];
    };
    getTeam(winTi).forEach(name=>{
      if(!name||!fmt[name]) return;
      fmt[name].scrWins++;
    });
    // count rounds for all players
    [0,1].forEach(ti=>getTeam(ti).forEach(name=>{
      if(!name||!fmt[name]) return;
      fmt[name].scrRnds++;
    }));
  });

  // Banker net — standalone banker rounds use playerNetTotals; side-bet on other formats uses bkPlayerNetTotals
  all.filter(r=>r.players&&(r.playerNetTotals||r.bkPlayerNetTotals)).forEach(r=>{
    let nets = r.bkPlayerNetTotals || r.playerNetTotals;
    r.players.forEach((name,i)=>{
      if(!name||!fmt[name]) return;
      let net = nets[i]||0;
      if(net===0) return;
      fmt[name].bkNet += net;
      fmt[name].bkRnds++;
    });
  });

  // Closest to pin
  all.filter(r=>r.pinHistory&&r.pinHistory.length&&r.players).forEach(r=>{
    r.pinHistory.forEach(h=>{
      if(h.winner==null) return;
      let name = r.players[h.winner];
      if(!name||!fmt[name]) return;
      fmt[name].pinWins++;
    });
    // count par 3s played by each player
    let par3s = (r.holeParDist||[]).filter(h=>h.par===3).length;
    r.players.forEach(name=>{
      if(!name||!fmt[name]) return;
      fmt[name].pinPar3s += par3s;
    });
  });

  let hasStab = players.some(n=>fmt[n].sfRnds>0);
  let hasScr  = players.some(n=>fmt[n].scrRnds>0);
  let hasBk   = players.some(n=>fmt[n].bkRnds>0||fmt[n].bkNet!==0);
  let hasPin  = players.some(n=>fmt[n].pinPar3s>0);
  let hasFmt  = hasStab||hasScr||hasBk||hasPin;

  let fmtRows = players
    .filter(n=>fmt[n].sfRnds>0||fmt[n].scrRnds>0||fmt[n].bkRnds>0||fmt[n].bkNet!==0||fmt[n].pinPar3s>0)
    .sort((a,b)=>{
      // sort by stableford avg desc, then banker net desc
      let sa = fmt[a].sfRnds>0?fmt[a].sfTotal/fmt[a].sfRnds:0;
      let sb = fmt[b].sfRnds>0?fmt[b].sfTotal/fmt[b].sfRnds:0;
      return sb-sa||fmt[b].bkNet-fmt[a].bkNet;
    })
    .map((name,rank)=>{
      let f = fmt[name];
      let sfDisp = f.sfRnds>0 ? `<span class="ins-val">${(f.sfTotal/f.sfRnds).toFixed(1)}</span>` : '<span class="ins-muted">—</span>';
      let scrDisp = f.scrRnds>0 ? `<span class="ins-muted">${f.scrWins}W</span>` : '<span class="ins-muted">—</span>';
      let bkDisp = f.bkRnds>0
        ? `<span class="${f.bkNet>0?'tag-good':f.bkNet<0?'tag-bad':'ins-muted'}">${f.bkNet>=0?'+$':'-$'}${Math.abs(f.bkNet)}</span>`
        : '<span class="ins-muted">—</span>';
      let pinDisp = f.pinPar3s>0 ? `<span class="ins-muted">${f.pinWins}/${f.pinPar3s}</span>` : '<span class="ins-muted">—</span>';
      let cells = [`<span class="rank-num">${rank+1}</span>`, `<span style="font-weight:bold">${esc(name)}</span>`];
      let vals  = [rank+1, name];
      if(hasStab){ cells.push(sfDisp);  vals.push(f.sfRnds>0?f.sfTotal/f.sfRnds:-9999); }
      if(hasScr) { cells.push(scrDisp); vals.push(f.scrWins); }
      if(hasBk)  { cells.push(bkDisp);  vals.push(f.bkNet); }
      if(hasPin) { cells.push(pinDisp); vals.push(f.pinPar3s>0?f.pinWins/f.pinPar3s:-1); }
      return {cells, vals};
    });

  let fmtHeaders = ['#','Player'];
  if(hasStab) fmtHeaders.push('Stbfd');
  if(hasScr)  fmtHeaders.push('Scr');
  if(hasBk)   fmtHeaders.push('Banker');
  if(hasPin)  fmtHeaders.push('Pin');

  let html = '';

  if(summaryRows.length){
    html += `<div class="ins-panel">
      <div class="ins-panel-title">Player Summary</div>
      ${sboardTable(['#','Player','Avg','Best','Worst','HCP','Rnds'], summaryRows, 'summaryTable')}
    </div>`;
  }

  if(hasFmt && fmtRows.length){
    html += `<div class="ins-panel">
      <div class="ins-panel-title">Format Standings</div>
      ${sboardTable(fmtHeaders, fmtRows, 'fmtTable')}
    </div>`;
  }

  if(!html){
    el.innerHTML = '<div class="empty-state">No data yet.</div>';
    return;
  }

  el.innerHTML = html;
  attachSortHandlers(document.getElementById('summaryTable'));
  attachSortHandlers(document.getElementById('fmtTable'));
}

renderInsights();

</script>
