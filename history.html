<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Scorecards & Stats</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#5c3317;--font:'Georgia','Times New Roman',serif;}
body{font-family:var(--font);background:var(--bg);margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;overscroll-behavior:none;}

.tab-bar{display:flex;background:var(--bg-card);border-bottom:1px solid rgba(255,212,71,0.15);flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,212,71,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-user-select:none;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── Scroll area ── */
.scroll-area{flex:1;overflow-y:auto;padding:14px 14px 110px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.empty-state{text-align:center;color:rgba(255,255,255,0.35);padding:50px 20px;font-size:14px;line-height:2;}

/* ── Season cards ── */
.season-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.25);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:#fff;display:block;transition:border-color .15s;}
.season-card:hover,.season-card:active{border-color:rgba(255,212,71,0.6);}
.season-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.season-name{font-size:14px;font-weight:bold;color:var(--gold);letter-spacing:.3px;}
.season-status{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
.season-status.active{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3);}
.season-status.complete{background:rgba(255,212,71,0.12);color:var(--gold);border:1px solid rgba(255,212,71,0.25);}
.season-meta{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;}
.season-progress{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.season-progress-fill{height:100%;background:#2eb450;border-radius:2px;transition:width .3s;}
.season-players{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.s-chip{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.55);}
.s-chip.leader{background:rgba(255,212,71,0.15);color:var(--gold);font-weight:bold;}

/* ── Filter pills ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 8px;margin-bottom:4px;justify-content:center;}
.filter-bar::-webkit-scrollbar{display:none;}
.pill{display:inline-block;padding:5px 12px;border-radius:18px;font-size:11px;font-weight:bold;letter-spacing:.4px;cursor:pointer;border:1px solid rgba(255,212,71,0.2);color:rgba(255,255,255,0.45);background:transparent;transition:all .15s;-webkit-user-select:none;}
.pill.active{background:rgba(255,212,71,0.14);color:var(--gold);border-color:rgba(255,212,71,0.5);}

/* ── Round cards ── */
.round-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:13px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.round-card:hover,.round-card:active{border-color:rgba(255,212,71,0.55);}
.round-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.round-game{font-size:12px;font-weight:bold;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;}
.round-date{font-size:11px;color:rgba(255,255,255,0.38);}
.round-course{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.round-players{display:flex;flex-wrap:wrap;gap:4px;}
.player-chip{font-size:10px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);}
.player-chip.winner{background:rgba(255,212,71,0.14);color:var(--gold);font-weight:bold;}
.expand-chevron{font-size:9px;color:rgba(255,212,71,0.35);margin-left:5px;display:inline-block;transition:transform .2s;}
.round-card.expanded .expand-chevron{transform:rotate(180deg);}
.round-expand{display:none;margin-top:10px;border-top:1px solid rgba(255,212,71,0.1);padding-top:10px;overflow-x:auto;}
.round-card.expanded .round-expand{display:block;}
.round-expand table{width:100%;border-collapse:collapse;font-size:11px;}
.round-expand th{background:rgba(0,0,0,0.4);color:var(--gold);border:1px solid rgba(139,94,60,0.15);padding:5px 4px;text-align:center;font-size:9px;letter-spacing:.8px;text-transform:uppercase;}
.round-expand th:first-child{text-align:left;}
.round-expand td{border:1px solid rgba(139,94,60,0.08);padding:4px 3px;text-align:center;color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:11px;}
.round-expand td:first-child{color:rgba(255,212,71,0.55);font-family:inherit;}
.round-expand tfoot td{background:rgba(0,0,0,0.3);color:var(--gold);font-weight:bold;}
.round-footer{display:flex;justify-content:flex-end;margin-top:7px;}
.edit-link{font-size:11px;color:rgba(255,212,71,0.5);text-decoration:none;border:1px solid rgba(255,212,71,0.18);border-radius:4px;padding:2px 8px;}

/* ── Insights ── */
.section-title{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.55);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(255,212,71,0.12);}
.section-title:first-child{margin-top:0;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-tile{background:var(--bg-card);border:2px solid var(--border);border-top:3px solid var(--gold);border-radius:8px;padding:12px;text-align:center;}
.stat-tile .sv{font-size:22px;font-weight:bold;color:var(--gold);font-family:'Courier New',monospace;}
.stat-tile .sl{font-size:9px;color:rgba(255,212,71,0.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.ins-panel{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.ins-panel-title{color:var(--gold);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px 7px;border-bottom:1px solid rgba(255,212,71,0.1);}
.ins-row{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
.ins-row:last-child{border-bottom:none;}
.ins-name{font-weight:bold;flex:1;}
.ins-val{font-family:'Courier New',monospace;font-weight:bold;color:var(--gold);}
.ins-muted{font-size:11px;color:rgba(255,255,255,0.85);}
.tag-good{color:#2ecc71;font-weight:bold;}
.tag-bad{color:#ff4d4d;font-weight:bold;}
.sboard{width:100%;border-collapse:collapse;font-size:13px;padding:4px 0;}
.sboard th{font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:#ffd447;padding:8px 12px 6px;border-bottom:1px solid rgba(255,212,71,0.1);}
.sboard td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;vertical-align:top;}
.sboard tr:last-child td{border-bottom:none;}
.rank-num{display:inline-block;width:18px;font-size:11px;color:rgba(255,255,255,0.85);font-family:'Courier New',monospace;}
.mono{font-family:'Courier New',monospace;}
/* ── Pill nav ── */
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;pointer-events:none;}
.nav-pill{display:flex;align-items:center;gap:2px;background:#0e1a12;border:1px solid rgba(255,212,71,0.28);border-radius:50px;padding:6px 10px;box-shadow:0 4px 24px rgba(0,0,0,0.6);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:40px;cursor:pointer;text-decoration:none;color:rgba(255,212,71,0.35);font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;transition:color .15s,background .15s;-webkit-user-select:none;}
.nav-item:hover,.nav-item:active{color:rgba(255,212,71,0.7);}
.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;}
.nav-center svg{width:36px;height:36px;}
.page-header{padding:16px 16px 4px;font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;text-align:center;}
</style>
</head>
<body>

<div class="page-header">Round Statistics</div>

<div class="scroll-area">

  <!-- ── INSIGHTS ── -->
  <div class="tab-panel active" id="tab-insights">
    <div class="filter-bar" id="insightsFilterBar">
      <span class="pill active" data-game="all">All</span>
      <span class="pill" data-game="stroke">Stroke Play</span>
      <span class="pill" data-game="scramble">Scramble</span>
      <span class="pill" data-game="stableford">Stableford</span>
      <span class="pill" data-game="banker">Banker</span>
    </div>
    <div id="insightsContent"></div>
  </div>

</div>

<script src="season.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

const GAME_LABELS = {
  stableford:'Stableford', banker:'Banker',
  matchplay:'Match Play', scramble:'Scramble', stroke:'Stroke Play'
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d) return ''; let dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function fmtVsPar(v){ return v>0?'+'+v:v===0?'E':String(v); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }

let insightsFilter = 'all';
document.getElementById('insightsFilterBar').addEventListener('click', e=>{
  let pill = e.target.closest('.pill');
  if(!pill) return;
  document.querySelectorAll('#insightsFilterBar .pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  insightsFilter = pill.dataset.game;
  renderInsights();
});

/* ══════════════════════════════════════
   INSIGHTS TAB
══════════════════════════════════════ */
function sboardTable(headers, rows){
  let n = headers.length;
  let statW = n > 3 ? Math.floor(52/(n-2)) : 20;
  let cols = `<colgroup><col style="width:5%"><col style="width:${100-5-(statW*(n-2))}%">${headers.slice(2).map(()=>`<col style="width:${statW}%">`).join('')}</colgroup>`;
  let th = headers.map((h,i)=>`<th style="text-align:${i===0||i===1?'left':'right'};${i===headers.length-1?'padding-right:12px;':''}">${h}</th>`).join('');
  let tr = rows.map(cells=>{
    let tds = cells.map((c,i)=>`<td style="text-align:${i===0||i===1?'left':'right'};${i===cells.length-1?'padding-right:12px;':''}">${c}</td>`).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="sboard">${cols}<thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

function renderInsights(){
  let el = document.getElementById('insightsContent');
  let all = loadHistory();
  if(!all.length){
    el.innerHTML = '<div class="empty-state">No rounds saved yet.<br>Finish a game to see insights here.</div>';
    return;
  }

  let sections = '';
  let gamesToShow = insightsFilter === 'all'
    ? ['stroke','scramble','stableford','banker']
    : [insightsFilter];

  // Stableford — individual
  if(gamesToShow.includes('stableford')){
    let rounds = all.filter(r=>r.game==='stableford' && r.players && r.playerTotals);
    if(rounds.length){
      let players = {};
      rounds.forEach(r=>{
        let max = Math.max(...r.playerTotals);
        r.players.forEach((name,i)=>{
          if(!players[name]) players[name]={rounds:0,total:0,wins:0};
          players[name].rounds++;
          players[name].total += r.playerTotals[i]||0;
          if(r.playerTotals[i]===max) players[name].wins++;
        });
      });
      let rows = Object.entries(players)
        .sort((a,b)=>(b[1].total/b[1].rounds)-(a[1].total/a[1].rounds))
        .map(([name,p],rank)=>{
          let avg = (p.total/p.rounds).toFixed(1);
          return [
            `<span class="rank-num">${rank+1}</span>`,
            esc(name),
            `<span class="ins-val mono">${avg}</span>`,
            p.wins,
            p.rounds
          ];
        });
      // Score distribution sub-table
      let dist = {};
      rounds.forEach(r=>{
        if(!r.scoreHistory || !r.holeParDist) return;
        r.players.forEach((name,pi)=>{
          if(!dist[name]) dist[name]={eagle:0,birdie:0,par:0,bogey:0,double:0,holes:0};
          r.scoreHistory.forEach((hole,hi)=>{
            let s=hole[pi], par=r.holeParDist[hi]?.par;
            if(s==null||par==null) return;
            let d=s-par;
            dist[name].holes++;
            if(d<=-2) dist[name].eagle++;
            else if(d===-1) dist[name].birdie++;
            else if(d===0) dist[name].par++;
            else if(d===1) dist[name].bogey++;
            else dist[name].double++;
          });
        });
      });
      let pct=(n,t)=>t?Math.round(n/t*100)+'%':'–';
      let dRows = Object.entries(dist)
        .sort((a,b)=>(players[b[0]]?.total/players[b[0]]?.rounds||0)-(players[a[0]]?.total/players[a[0]]?.rounds||0))
        .map(([name,d],rank)=>[
          `<span class="rank-num">${rank+1}</span>`,
          esc(name),
          `<span class="ins-muted">${pct(d.par,d.holes)}</span>`,
          `<span class="ins-muted">${pct(d.bogey,d.holes)}</span>`,
          `<span class="ins-muted">${pct(d.double,d.holes)}</span>`
        ]);
      sections += `<div class="section-title">Stableford</div>
        <div class="ins-panel">${sboardTable(['#','Player','Pts/Rnd','Wins','Rounds'], rows)}</div>
        <div class="section-title" style="margin-top:4px;">Score Distribution</div>
        <div class="ins-panel">${sboardTable(['#','Player','Par%','Bogey%','Dbl+%'], dRows)}</div>`;
    }
  }

  // Scramble — player-pair standings
  if(gamesToShow.includes('scramble')){
    let rounds = all.filter(r=>r.game==='scramble' && r.teamScores);
    if(rounds.length){
      let teams = {};
      rounds.forEach(r=>{
        let getTeamLabel = (ti) => {
          if(r.players && r.players[ti*2])
            return [r.players[ti*2], r.players[ti*2+1]].filter(Boolean).join(' & ');
          if(Array.isArray(r.playerNames) && Array.isArray(r.playerNames[ti]))
            return r.playerNames[ti].filter(Boolean).join(' & ');
          return `Team ${String.fromCharCode(65+ti)}`;
        };
        let minScore = Math.min(...r.teamScores);
        [0,1].forEach(ti=>{
          let label = getTeamLabel(ti);
          let key = label.split(' & ').sort().join('|');
          let vp = r.teamVsPar?.[ti]??null;
          if(!teams[key]) teams[key]={label,rounds:0,wins:0,totalScore:0,vpRounds:0,totalVsPar:0};
          teams[key].rounds++;
          teams[key].totalScore += r.teamScores[ti]||0;
          if(vp!=null){ teams[key].totalVsPar+=vp; teams[key].vpRounds++; }
          if(r.teamScores[ti]===minScore && r.teamScores.filter(s=>s===minScore).length===1) teams[key].wins++;
        });
      });
      let rows = Object.entries(teams)
        .sort((a,b)=>b[1].wins-a[1].wins||(a[1].totalScore/a[1].rounds)-(b[1].totalScore/b[1].rounds))
        .map(([,t],rank)=>{
          let avgScore = (t.totalScore/t.rounds).toFixed(1);
          let vpStr='—', vpCls='ins-muted';
          if(t.vpRounds>0){
            let avg=t.totalVsPar/t.vpRounds, r=Math.round(avg);
            vpStr=r===0?'E':r>0?'+'+r:String(r);
            vpCls=avg<0?'tag-good':avg>0?'tag-bad':'ins-muted';
          }
          return [
            `<span class="rank-num">${rank+1}</span>`,
            esc(t.label),
            `<span class="ins-muted mono">${avgScore}</span>`,
            `<span class="${vpCls}">${vpStr}</span>`,
            t.wins,
            t.rounds
          ];
        });
      sections += `<div class="section-title">Team Scramble</div>
        <div class="ins-panel">${sboardTable(['#','Players','Avg','vPar','Wins','Rnds'], rows)}</div>`;
    }
  }

  // Banker — individual (money only)
  if(gamesToShow.includes('banker')){
    let rounds = all.filter(r=>r.game==='banker' && r.players && r.playerNetTotals);
    if(rounds.length){
      let players = {};
      rounds.forEach(r=>{
        let nets = r.playerNetTotals;
        let max = Math.max(...nets);
        let min = Math.min(...nets);
        r.players.forEach((name,i)=>{
          if(!players[name]) players[name]={rounds:0,net:0,wins:0,losses:0};
          players[name].rounds++;
          players[name].net += nets[i]||0;
          if(nets[i]===max && max>0) players[name].wins++;
          if(nets[i]===min && min<0) players[name].losses++;
        });
      });
      let rows = Object.entries(players)
        .sort((a,b)=>b[1].net-a[1].net)
        .map(([name,p],rank)=>{
          let sign = p.net>0?'+':p.net<0?'-':'';
          let netStr = sign+'$'+Math.abs(p.net);
          let netCls = p.net>0?'tag-good':p.net<0?'tag-bad':'ins-muted';
          let winPct = p.wins+p.losses>0 ? Math.round(p.wins/(p.wins+p.losses)*100)+'%' : '—';
          let winCls = p.wins+p.losses>0 ? (p.wins/(p.wins+p.losses)>=0.5?'tag-good':'tag-bad') : 'ins-muted';
          return [
            `<span class="rank-num">${rank+1}</span>`,
            esc(name),
            `<span class="${netCls} mono" style="font-weight:bold">${netStr}</span>`,
            `<span class="${winCls}">${winPct}</span>`,
            p.wins+p.losses
          ];
        });
      sections += `<div class="section-title">Banker</div>
        <div class="ins-panel">${sboardTable(['#','Player','Net $','Win%','Rounds'], rows)}</div>`;

      // Banker performance sub-table (requires holeHistory)
      let bankerRoundsWithHistory = all.filter(r=>r.game==='banker' && r.players && r.holeHistory);
      if(bankerRoundsWithHistory.length){
        let bperf = {};
        bankerRoundsWithHistory.forEach(r=>{
          r.players.forEach(name=>{ if(!bperf[name]) bperf[name]={holesAsBank:0,doubles:0,bankWins:0,bankLosses:0,netAsBank:0}; });
          (r.holeHistory||[]).forEach(h=>{
            let bankerName = r.players[h.bankerIdx];
            if(!bankerName) return;
            bperf[bankerName].holesAsBank++;
            let anyDouble = (h.matchups||[]).some(m=>m.doubled||m.bankerDoubled);
            if(anyDouble) bperf[bankerName].doubles++;
            let wins = (h.matchups||[]).filter(m=>m.result==='banker').length;
            let losses = (h.matchups||[]).filter(m=>m.result==='player').length;
            if(wins > losses) bperf[bankerName].bankWins++;
            else if(losses > wins) bperf[bankerName].bankLosses++;
            // net $ earned as banker this hole
            (h.matchups||[]).forEach(m=>{
              if(m.result==='banker') bperf[bankerName].netAsBank += m.amount||0;
              else if(m.result==='player') bperf[bankerName].netAsBank -= m.amount||0;
            });
          });
        });
        let bRows = Object.entries(bperf)
          .filter(([,p])=>p.holesAsBank>0)
          .sort((a,b)=>b[1].holesAsBank-a[1].holesAsBank)
          .map(([name,p],rank)=>{
            let doubleRate = Math.round(p.doubles/p.holesAsBank*100)+'%';
            let netSign = p.netAsBank>=0?'+':'-';
            let netStr = netSign+'$'+Math.abs(p.netAsBank);
            let netCls = p.netAsBank>0?'tag-good':p.netAsBank<0?'tag-bad':'ins-muted';
            return [
              `<span class="rank-num">${rank+1}</span>`,
              esc(name),
              p.holesAsBank,
              `<span class="${netCls} mono">${netStr}</span>`,
              doubleRate
            ];
          });
        if(bRows.length){
          sections += `<div class="section-title" style="margin-top:4px;">Banker — As Dealer</div>
            <div class="ins-panel">${sboardTable(['#','Player','Holes','Net $','Double%'], bRows)}</div>`;
        }
      }
    }
  }

  // Stroke Play
  if(gamesToShow.includes('stroke')){
    let rounds = all.filter(r=>r.game==='stroke' && r.players && r.playerTotals);
    if(rounds.length){
      let players = {};
      rounds.forEach(r=>{
        // par: from holeParDist (hole-by-hole) or top-level coursePar field
        let pd = r.holeParDist||[];
        let totalPar = pd.length ? pd.reduce((s,h)=>s+(h.par||4),0) : (r.coursePar||null);
        let min = Math.min(...r.playerTotals);
        r.players.forEach((name,i)=>{
          if(!players[name]) players[name]={rounds:0,totalScore:0,totalParRounds:0,totalPar:0,wins:0,bestScore:null};
          players[name].rounds++;
          let score = r.playerTotals[i]||0;
          players[name].totalScore += score;
          if(score===min) players[name].wins++;
          if(players[name].bestScore===null || score < players[name].bestScore) players[name].bestScore=score;
          if(totalPar){ players[name].totalPar += totalPar; players[name].totalParRounds++; }
        });
      });
      let rows = Object.entries(players)
        .sort((a,b)=>(a[1].totalScore/a[1].rounds)-(b[1].totalScore/b[1].rounds))
        .map(([name,p],rank)=>{
          let avgScore = (p.totalScore/p.rounds).toFixed(1);
          // show vs-par avg only if we have par data
          let avgDisp = avgScore;
          let avgCls = 'ins-muted';
          if(p.totalParRounds>0){
            let avgVp = (p.totalScore - p.totalPar) / p.totalParRounds;
            avgDisp = (avgVp>=0?'+':'')+avgVp.toFixed(1);
            avgCls = avgVp<0?'tag-good':avgVp>0?'tag-bad':'ins-muted';
          }
          return [
            `<span class="rank-num">${rank+1}</span>`,
            esc(name),
            `<span class="${avgCls}">${avgDisp}</span>`,
            `<span class="ins-muted">${p.bestScore??'—'}</span>`,
            p.wins,
            `<span class="ins-muted">${p.rounds}</span>`
          ];
        });
      sections += `<div class="section-title">Stroke Play</div>
        <div class="ins-panel">${sboardTable(['#','Player','Avg','Best','Wins','Rounds'], rows)}</div>`;
    }
  }

  if(!sections){
    el.innerHTML = '<div class="empty-state">No data for this game format yet.</div>';
    return;
  }

  el.innerHTML = sections;
}

// Init
renderInsights();
</script>
