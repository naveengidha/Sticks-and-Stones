<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Scorecards & Stats</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--border:#8B6914;--font:'Georgia','Times New Roman',serif;}
body{font-family:var(--font);background:var(--bg);margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;}

.tab-bar{display:flex;background:var(--bg-card);border-bottom:1px solid rgba(255,212,71,0.15);flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:bold;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,212,71,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-user-select:none;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── Scroll area ── */
.scroll-area{flex:1;overflow-y:auto;padding:14px 14px 110px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.empty-state{text-align:center;color:rgba(255,255,255,0.35);padding:50px 20px;font-size:14px;line-height:2;}

/* ── Season cards ── */
.season-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.25);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:#fff;display:block;transition:border-color .15s;}
.season-card:hover,.season-card:active{border-color:rgba(255,212,71,0.6);}
.season-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.season-name{font-size:14px;font-weight:bold;color:var(--gold);letter-spacing:.3px;}
.season-status{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
.season-status.active{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3);}
.season-status.complete{background:rgba(255,212,71,0.12);color:var(--gold);border:1px solid rgba(255,212,71,0.25);}
.season-meta{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;}
.season-progress{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.season-progress-fill{height:100%;background:#2eb450;border-radius:2px;transition:width .3s;}
.season-players{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.s-chip{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.55);}
.s-chip.leader{background:rgba(255,212,71,0.15);color:var(--gold);font-weight:bold;}

/* ── Filter pills ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 8px;margin-bottom:4px;justify-content:center;}
.filter-bar::-webkit-scrollbar{display:none;}
.pill{display:inline-block;padding:5px 12px;border-radius:18px;font-size:11px;font-weight:bold;letter-spacing:.4px;cursor:pointer;border:1px solid rgba(255,212,71,0.2);color:rgba(255,255,255,0.45);background:transparent;transition:all .15s;-webkit-user-select:none;}
.pill.active{background:rgba(255,212,71,0.14);color:var(--gold);border-color:rgba(255,212,71,0.5);}

/* ── Round cards ── */
.round-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:13px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.round-card:hover,.round-card:active{border-color:rgba(255,212,71,0.55);}
.round-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.round-game{font-size:12px;font-weight:bold;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;}
.round-date{font-size:11px;color:rgba(255,255,255,0.38);}
.round-course{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.round-players{display:flex;flex-wrap:wrap;gap:4px;}
.player-chip{font-size:10px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);}
.player-chip.winner{background:rgba(255,212,71,0.14);color:var(--gold);font-weight:bold;}
.expand-chevron{font-size:9px;color:rgba(255,212,71,0.35);margin-left:5px;display:inline-block;transition:transform .2s;}
.round-card.expanded .expand-chevron{transform:rotate(180deg);}
.round-expand{display:none;margin-top:10px;border-top:1px solid rgba(255,212,71,0.1);padding-top:10px;overflow-x:auto;}
.round-card.expanded .round-expand{display:block;}
.round-expand table{width:100%;border-collapse:collapse;font-size:11px;}
.round-expand th{background:rgba(0,0,0,0.4);color:var(--gold);border:1px solid rgba(184,150,46,0.15);padding:5px 4px;text-align:center;font-size:9px;letter-spacing:.8px;text-transform:uppercase;}
.round-expand th:first-child{text-align:left;}
.round-expand td{border:1px solid rgba(184,150,46,0.08);padding:4px 3px;text-align:center;color:rgba(255,255,255,0.7);font-family:'Courier New',monospace;font-size:11px;}
.round-expand td:first-child{color:rgba(255,212,71,0.55);font-family:inherit;}
.round-expand tfoot td{background:rgba(0,0,0,0.3);color:var(--gold);font-weight:bold;}
.round-footer{display:flex;justify-content:flex-end;margin-top:7px;}
.edit-link{font-size:11px;color:rgba(255,212,71,0.5);text-decoration:none;border:1px solid rgba(255,212,71,0.18);border-radius:4px;padding:2px 8px;}

/* ── Insights ── */
.section-title{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.55);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(255,212,71,0.12);}
.section-title:first-child{margin-top:0;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-tile{background:var(--bg-card);border:2px solid var(--border);border-top:3px solid var(--gold);border-radius:8px;padding:12px;text-align:center;}
.stat-tile .sv{font-size:22px;font-weight:bold;color:var(--gold);font-family:'Courier New',monospace;}
.stat-tile .sl{font-size:9px;color:rgba(255,212,71,0.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.ins-panel{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.ins-panel-title{color:var(--gold);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px 7px;border-bottom:1px solid rgba(255,212,71,0.1);}
.ins-row{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
.ins-row:last-child{border-bottom:none;}
.ins-name{font-weight:bold;flex:1;}
.ins-val{font-family:'Courier New',monospace;font-weight:bold;color:var(--gold);}
.ins-muted{font-size:11px;color:rgba(255,255,255,0.38);}
.tag-good{color:#2ecc71;font-weight:bold;}
.tag-bad{color:#ff4d4d;font-weight:bold;}
/* ── Pill nav ── */
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;pointer-events:none;}
.nav-pill{display:flex;align-items:center;gap:2px;background:#0e1a12;border:1px solid rgba(255,212,71,0.28);border-radius:50px;padding:6px 10px;box-shadow:0 4px 24px rgba(0,0,0,0.6);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:40px;cursor:pointer;text-decoration:none;color:rgba(255,212,71,0.35);font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;transition:color .15s,background .15s;-webkit-user-select:none;}
.nav-item:hover,.nav-item:active{color:rgba(255,212,71,0.7);}
.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(184,150,46,0.5);flex-shrink:0;text-decoration:none;}
.nav-center svg{width:26px;height:26px;}
.page-header{padding:16px 16px 4px;font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;text-align:center;}
</style>
</head>
<body>

<div class="page-header">Insights</div>

<div class="scroll-area">

  <!-- ── INSIGHTS ── -->
  <div class="tab-panel active" id="tab-insights">
    <div class="filter-bar" id="insightsFilterBar">
      <span class="pill active" data-game="all">All</span>
      <span class="pill" data-game="f1">Grand Prix</span>
      <span class="pill" data-game="stableford">Stableford</span>
      <span class="pill" data-game="wolf">Wolf</span>
      <span class="pill" data-game="scramble">Scramble</span>
      <span class="pill" data-game="matchplay">Match Play</span>
      <span class="pill" data-game="foursomes">Foursomes</span>
      <span class="pill" data-game="vegas">Vegas</span>
      <span class="pill" data-game="banker">Banker</span>
      <span class="pill" data-game="stroke">Stroke Play</span>
    </div>
    <div id="insightsContent"></div>
  </div>

</div>

<script src="season.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

const GAME_LABELS = {
  f1:'Grand Prix', stableford:'Stableford', wolf:'Wolf', banker:'Banker',
  matchplay:'Match Play', scramble:'Scramble', foursomes:'Foursomes', vegas:'Vegas', stroke:'Stroke Play'
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d) return ''; let dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function fmtVsPar(v){ return v>0?'+'+v:v===0?'E':String(v); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }

let insightsFilter = 'all';
document.getElementById('insightsFilterBar').addEventListener('click', e=>{
  let pill = e.target.closest('.pill');
  if(!pill) return;
  document.querySelectorAll('#insightsFilterBar .pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  insightsFilter = pill.dataset.game;
  renderInsights();
});

/* ══════════════════════════════════════
   INSIGHTS TAB
══════════════════════════════════════ */
function renderInsights(){
  let el = document.getElementById('insightsContent');
  let all = loadHistory();
  if(!all.length){
    el.innerHTML = '<div class="empty-state">No rounds saved yet.<br>Finish a game to see insights here.</div>';
    return;
  }

  let sections = '';
  let gamesToShow = insightsFilter === 'all'
    ? ['f1','stableford','wolf','scramble','banker','stroke']
    : [insightsFilter];

  // Formats where higher total = better (f1, stableford, wolf)
  ['f1','stableford','wolf'].filter(g=>gamesToShow.includes(g)).forEach(game=>{
    let rounds = all.filter(r=>r.game===game && r.players && r.playerTotals);
    if(!rounds.length) return;
    let players = {};
    rounds.forEach(r=>{
      let max = Math.max(...r.playerTotals);
      r.players.forEach((name,i)=>{
        if(!players[name]) players[name]={rounds:0,total:0,wins:0};
        players[name].rounds++;
        players[name].total += r.playerTotals[i]||0;
        if(r.playerTotals[i]===max) players[name].wins++;
      });
    });
    let rows = Object.entries(players).sort((a,b)=>(b[1].total/b[1].rounds)-(a[1].total/a[1].rounds))
      .map(([name,p])=>{
        let avg = (p.total/p.rounds).toFixed(1);
        let winPct = Math.round(p.wins/p.rounds*100)+'%';
        return `<div class="ins-row">
          <span class="ins-name">${esc(name)} <span class="ins-muted">${p.rounds}r</span></span>
          <span style="text-align:right;">
            <span class="ins-val">${avg}</span>
            <span class="ins-muted"> avg &nbsp;</span>
            <span class="${p.wins>0?'tag-good':''}">${winPct}</span>
            <span class="ins-muted"> W</span>
          </span>
        </div>`;
      }).join('');
    sections += `<div class="section-title">${GAME_LABELS[game]}</div>
      <div class="ins-panel"><div class="ins-panel-title">Avg pts · Win %</div>${rows}</div>`;
  });

  // Scramble
  if(gamesToShow.includes('scramble')){
    let scrambleRounds = all.filter(r=>r.game==='scramble' && r.teamNames && r.teamScores);
    if(scrambleRounds.length){
      let teams = {};
      scrambleRounds.forEach(r=>{
        r.teamNames.forEach((name,ti)=>{
          if(!teams[name]) teams[name]={rounds:0,wins:0,totalScore:0};
          teams[name].rounds++;
          teams[name].totalScore += r.teamScores[ti]||0;
          let won = r.teamScores[ti] < r.teamScores[1-ti];
          if(won) teams[name].wins++;
        });
      });
      let rows = Object.entries(teams).sort((a,b)=>b[1].wins-a[1].wins)
        .map(([name,t])=>{
          let avg = (t.totalScore/t.rounds).toFixed(1);
          let winPct = Math.round(t.wins/t.rounds*100)+'%';
          return `<div class="ins-row">
            <span class="ins-name">${esc(name)} <span class="ins-muted">${t.rounds}r</span></span>
            <span style="text-align:right;">
              <span class="ins-val">${avg}</span>
              <span class="ins-muted"> avg &nbsp;</span>
              <span class="${t.wins>0?'tag-good':''}">${winPct}</span>
              <span class="ins-muted"> W</span>
            </span>
          </div>`;
        }).join('');
      sections += `<div class="section-title">Scramble</div>
        <div class="ins-panel"><div class="ins-panel-title">Avg score · Win %</div>${rows}</div>`;
    }
  }

  // Stroke Play (lowest total wins)
  if(gamesToShow.includes('stroke')){
    let strokeRounds = all.filter(r=>r.game==='stroke' && r.players && r.playerTotals);
    if(strokeRounds.length){
      let players = {};
      strokeRounds.forEach(r=>{
        let min = Math.min(...r.playerTotals);
        r.players.forEach((name,i)=>{
          if(!players[name]) players[name]={rounds:0,total:0,wins:0};
          players[name].rounds++;
          players[name].total += r.playerTotals[i]||0;
          if(r.playerTotals[i]===min) players[name].wins++;
        });
      });
      let rows = Object.entries(players).sort((a,b)=>(a[1].total/a[1].rounds)-(b[1].total/b[1].rounds))
        .map(([name,p])=>{
          let avg = (p.total/p.rounds).toFixed(1);
          let winPct = Math.round(p.wins/p.rounds*100)+'%';
          return `<div class="ins-row">
            <span class="ins-name">${esc(name)} <span class="ins-muted">${p.rounds}r</span></span>
            <span style="text-align:right;">
              <span class="ins-val">${avg}</span>
              <span class="ins-muted"> avg &nbsp;</span>
              <span class="${p.wins>0?'tag-good':''}">${winPct}</span>
              <span class="ins-muted"> W</span>
            </span>
          </div>`;
        }).join('');
      sections += `<div class="section-title">Stroke Play</div>
        <div class="ins-panel"><div class="ins-panel-title">Avg strokes · Win %</div>${rows}</div>`;
    }
  }

  // Banker
  if(gamesToShow.includes('banker')){
    let bankerRounds = all.filter(r=>r.game==='banker' && r.players && r.playerNetTotals);
    if(bankerRounds.length){
      let players = {};
      bankerRounds.forEach(r=>{
        let max=Math.max(...r.playerNetTotals);
        r.players.forEach((name,i)=>{
          if(!players[name]) players[name]={rounds:0,net:0,wins:0};
          players[name].rounds++;
          players[name].net += r.playerNetTotals[i]||0;
          if(r.playerNetTotals[i]===max) players[name].wins++;
        });
      });
      let rows = Object.entries(players).sort((a,b)=>b[1].net-a[1].net)
        .map(([name,p])=>{
          let sign=p.net>0?'+':p.net<0?'-':'';
          let balStr=sign+'$'+Math.abs(p.net).toFixed(2).replace(/\.00$/,'');
          let cls=p.net>0?'tag-good':p.net<0?'tag-bad':'';
          let winPct=Math.round(p.wins/p.rounds*100)+'%';
          return `<div class="ins-row">
            <span class="ins-name">${esc(name)} <span class="ins-muted">${p.rounds}r</span></span>
            <span style="text-align:right;">
              <span class="${cls}" style="font-family:'Courier New';font-weight:bold;">${balStr}</span>
              <span class="ins-muted"> &nbsp;</span>
              <span class="${p.wins>0?'tag-good':''}">${winPct}</span>
              <span class="ins-muted"> W</span>
            </span>
          </div>`;
        }).join('');
      sections += `<div class="section-title">Banker</div>
        <div class="ins-panel"><div class="ins-panel-title">Net balance · Win %</div>${rows}</div>`;
    }
  }

  // Most Played Together — only show on "all" filter
  if(insightsFilter === 'all'){
    let pairs = {};
    all.forEach(r=>{
      let ps = r.game==='scramble' ? (r.playerNames||[]).flat().filter(Boolean) : (r.players||[]);
      for(let a=0;a<ps.length;a++) for(let b=a+1;b<ps.length;b++){
        let k=[ps[a],ps[b]].sort().join('|||');
        pairs[k]=(pairs[k]||0)+1;
      }
    });
    let topPairs = Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(topPairs.length){
      let rows = topPairs.map(([k,n])=>`<div class="ins-row">
        <span class="ins-name">${esc(k.replace('|||',' & '))}</span>
        <span class="ins-val">${n}r</span>
      </div>`).join('');
      sections += `<div class="section-title">Most Played Together</div>
        <div class="ins-panel">${rows}</div>`;
    }
  }

  if(!sections){
    el.innerHTML = '<div class="empty-state">No data for this game format yet.</div>';
    return;
  }

  el.innerHTML = sections;
}

// Init
renderInsights();
</script>

      </svg>
      History
    </a>
    <a class="nav-center" href="games.html" title="Play a Game">
      <svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#1a1a0a"/><circle cx="12" cy="12" r="4" fill="white"/><circle cx="9.5" cy="10.5" r="1" fill="#ccc"/><circle cx="12" cy="9" r="1" fill="#ccc"/><circle cx="14.5" cy="11" r="1" fill="#ccc"/></svg>
    </a>
    <a class="nav-item" href="tournaments.html">

        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      Tourneys
    </a>
    <a class="nav-item" href="caddy.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/>
      </svg>
      Caddy
    </a>
  </div>
</nav>
</body>
</html>
