<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f0a">
<title>Stroke Play</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Georgia','Times New Roman',serif;background:#080f0a;margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none;}
.scroll-area{flex:1;overflow-y:auto;padding:12px 14px 110px;display:flex;justify-content:center;align-items:flex-start;}
.container{width:100%;max-width:480px;display:flex;flex-direction:column;}
.page-header{text-align:center;padding:20px 16px 4px;font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;}
.page-sub{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin:2px 0 16px;}
.setup-section{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.setup-section-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.45);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,212,71,0.1);}
.name-input,.course-input,.select-input{width:100%;padding:7px 10px;box-sizing:border-box;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#fff;font-size:14px;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;letter-spacing:.3px;margin-bottom:0;}
.name-input::placeholder,.course-input::placeholder{color:rgba(255,255,255,0.25);}
.name-input:focus,.course-input:focus,.select-input:focus{outline:none;border-color:rgba(255,212,71,0.7);background:rgba(0,0,0,0.55);}
.select-input{color:#ffd447;background:rgba(0,0,0,0.5);color-scheme:dark;}
.date-course-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0;}
input[type="date"].course-input{-webkit-appearance:none;appearance:none;color-scheme:dark;}
.player-row{display:grid;grid-template-columns:1fr 60px 70px 32px;gap:6px;align-items:center;margin-bottom:7px;}
.player-row:last-child{margin-bottom:0;}
.score-input{padding:7px 6px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#ffd447;font-size:15px;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;text-align:center;width:100%;}
.score-input:focus{outline:none;border-color:rgba(255,212,71,0.7);}
.score-input::placeholder{color:rgba(255,255,255,0.2);font-size:11px;}
.col-header{font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.4);padding-bottom:4px;}
.player-row-headers{display:grid;grid-template-columns:1fr 60px 70px 32px;gap:6px;margin-bottom:4px;}
.remove-btn{background:none;border:none;color:rgba(255,77,77,0.5);font-size:18px;cursor:pointer;padding:0;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.remove-btn:active{color:#ff4d4d;}
.add-player-row{width:100%;padding:8px;border:1px dashed rgba(255,212,71,0.3);border-radius:6px;background:none;color:rgba(255,212,71,0.6);font-size:13px;font-weight:bold;cursor:pointer;font-family:'Georgia','Times New Roman',serif;margin-top:6px;letter-spacing:.5px;}
.add-player-row:active{border-color:#ffd447;color:#ffd447;}
.start-btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;margin-top:4px;}
.start-btn:active{opacity:.85;}
.error-msg{color:#ff6b6b;font-size:13px;text-align:center;margin:6px 0;display:none;}
/* Confirmation screen */
.confirm-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 24px 110px;text-align:center;}
.confirm-icon{font-size:48px;margin-bottom:16px;}
.confirm-title{font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;margin-bottom:8px;}
.confirm-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:32px;}
.confirm-result{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:12px 16px;width:100%;max-width:360px;margin-bottom:24px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px;}
.result-row:last-child{border-bottom:none;}
.result-name{color:#fff;font-weight:bold;}
.result-score{font-family:'Courier New',monospace;color:#ffd447;font-weight:bold;font-size:16px;}
.done-btn{width:100%;max-width:360px;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.done-btn:active{opacity:.85;}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;pointer-events:none;}
.nav-pill{display:flex;align-items:center;gap:2px;background:#0e1a12;border:1px solid rgba(255,212,71,0.28);border-radius:50px;padding:6px 10px;box-shadow:0 4px 24px rgba(0,0,0,0.6);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:40px;cursor:pointer;text-decoration:none;color:rgba(255,212,71,0.35);font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;transition:color .15s;}
.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;border:none;}
.nav-center svg{width:36px;height:36px;}
.hidden{display:none!important;}
</style>
</head>
<body>

<div id="setupScreen" style="display:flex;flex-direction:column;flex:1;">
  <div class="page-header">Stroke Play</div>
  <div class="page-sub">Post-round results</div>
  <div class="scroll-area">
    <div class="container">

      <!-- Round details -->
      <div class="setup-section">
        <div class="setup-section-label">Round Details</div>
        <div class="date-course-row" style="margin-bottom:8px;">
          <input type="date" class="course-input" id="roundDate" style="color-scheme:dark;">
          <select class="select-input" id="seasonSelect" onchange="onSeasonPick()">
            <option value="">— No Season —</option>
          </select>
        </div>
        <div class="date-course-row">
          <input class="course-input" id="courseInput" placeholder="Course name">
          <input type="number" class="course-input" id="parInput" placeholder="Par 72" min="18" max="100" inputmode="numeric">
        </div>
      </div>

      <!-- Players -->
      <div class="setup-section">
        <div class="setup-section-label">Players &amp; Scores</div>
        <div class="player-row-headers">
          <div class="col-header">Name</div>
          <div class="col-header" style="text-align:center;">HCP</div>
          <div class="col-header" style="text-align:center;">Score</div>
          <div></div>
        </div>
        <div id="playerRows"></div>
        <button class="add-player-row" id="addBtn" onclick="addPlayer()">+ Add Player</button>
      </div>

      <div class="error-msg" id="nameError">Enter at least one player name and score.</div>
      <button class="start-btn" onclick="saveRound()">Save Round</button>

    </div>
  </div>
</div>

<div id="confirmScreen" class="confirm-screen">
  <div class="confirm-icon">⛳</div>
  <div class="confirm-title">Round Saved</div>
  <div class="confirm-sub" id="confirmSub">Results recorded.</div>
  <div class="confirm-result" id="confirmResult"></div>
  <button class="done-btn" onclick="location.href='games.html'">Done</button>
</div>

<nav class="bottom-nav">
  <div class="nav-pill">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/><line x1="4" y1="14" x2="20" y2="14" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
      Rounds
    </a>
    <a class="nav-item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      Stats
    </a>
    <a class="nav-center" href="games.html">
      <svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="#1a1a0a"/><circle cx="12" cy="12" r="6.2" fill="white"/><circle cx="10.2" cy="11.2" r="1" fill="#ccc"/><circle cx="12" cy="9.5" r="1" fill="#ccc"/><circle cx="13.8" cy="11.2" r="1" fill="#ccc"/></svg>
    </a>
    <a class="nav-item" href="tournaments.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Tourneys
    </a>
    <a class="nav-item" href="caddy.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      Caddy
    </a>
  </div>
</nav>

<script src="season.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

let playerCount = 0;
const MAX_PLAYERS = 8;

function makeRow(index){
  const div = document.createElement('div');
  div.className = 'player-row';
  div.id = 'prow' + index;
  div.innerHTML = `
    <input class="name-input" id="pname${index}" placeholder="Player ${index+1}">
    <input type="number" class="score-input" id="phcp${index}" placeholder="HCP" min="0" max="54" inputmode="numeric">
    <input type="number" class="score-input" id="pscore${index}" placeholder="Score" min="18" max="200" inputmode="numeric">
    <button class="remove-btn" onclick="removePlayer(${index})" title="Remove">×</button>`;
  return div;
}

function addPlayer(){
  if(playerCount >= MAX_PLAYERS){ document.getElementById('addBtn').style.display='none'; return; }
  document.getElementById('playerRows').appendChild(makeRow(playerCount));
  playerCount++;
  if(playerCount >= MAX_PLAYERS) document.getElementById('addBtn').style.display='none';
}

function removePlayer(index){
  const row = document.getElementById('prow'+index);
  if(row) row.remove();
  document.getElementById('addBtn').style.display='';
  // Renumber remaining visible rows
  const rows = document.querySelectorAll('.player-row');
  if(rows.length === 0){ addPlayer(); }
}

function getPlayers(){
  return Array.from(document.querySelectorAll('.player-row')).map(row=>{
    const idx = row.id.replace('prow','');
    const name = (document.getElementById('pname'+idx)||{}).value?.trim()||'';
    const hcp = parseInt((document.getElementById('phcp'+idx)||{}).value)||0;
    const score = parseInt((document.getElementById('pscore'+idx)||{}).value)||null;
    return {name, hcp, score};
  }).filter(p=>p.name&&p.score!==null);
}

// Populate season picker
(function(){
  try{
    const seasons = JSON.parse(localStorage.getItem('seasons')||'[]')
      .filter(s=>s.status==='active'&&(!s.allowedGames||s.allowedGames.includes('stroke')));
    const sel = document.getElementById('seasonSelect');
    seasons.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; sel.appendChild(o); });
    const urlSeasonId = new URLSearchParams(location.search).get('seasonId');
    if(urlSeasonId){ sel.value=urlSeasonId; if(sel.value==urlSeasonId) onSeasonPick(); }
  }catch(e){}
})();

function onSeasonPick(){
  try{
    const seasonId = parseInt(document.getElementById('seasonSelect').value);
    if(!seasonId) return;
    const season = JSON.parse(localStorage.getItem('seasons')||'[]').find(s=>s.id===seasonId);
    if(!season||!season.players) return;
    document.getElementById('playerRows').innerHTML='';
    playerCount=0;
    season.players.forEach((p,i)=>{
      addPlayer();
      const idx = document.querySelectorAll('.player-row')[i]?.id.replace('prow','');
      if(idx!==undefined){ document.getElementById('pname'+idx).value=p.name||''; document.getElementById('phcp'+idx).value=p.handicap||''; }
    });
  }catch(e){}
}

function saveRound(){
  const players = getPlayers();
  const err = document.getElementById('nameError');
  if(!players.length){ err.style.display='block'; setTimeout(()=>err.style.display='none',2500); return; }
  err.style.display='none';

  const dateVal = document.getElementById('roundDate').value;
  const course = document.getElementById('courseInput').value.trim();
  const coursePar = parseInt(document.getElementById('parInput').value) || null;
  const record = {
    id: Date.now(),
    game: 'stroke',
    date: new Date(dateVal+'T12:00:00').toISOString(),
    course,
    coursePar,
    players: players.map(p=>p.name),
    playerTotals: players.map(p=>p.score),
    handicaps: players.map(p=>p.hcp),
    scoreHistory: null,
    holeParDist: null,
    holes: null
  };

  try{
    const existing = JSON.parse(localStorage.getItem('gameHistory')||'[]');
    existing.push(record);
    localStorage.setItem('gameHistory', JSON.stringify(existing));
  }catch(e){}

  // Save to season
  try{
    const seasonId = parseInt(document.getElementById('seasonSelect').value);
    if(seasonId && typeof _addRoundToSeason==='function'){
      const ranked = record.playerTotals.map((t,i)=>({i,t})).sort((a,b)=>a.t-b.t);
      const positions = ranked.map((s,rank)=>({name:record.players[s.i],position:rank+1}));
      _addRoundToSeason(seasonId, record, positions);
    }
  }catch(e){}

  showConfirm(players, course, dateVal);
}

function showConfirm(players, course, dateVal){
  document.getElementById('setupScreen').style.display='none';
  const cs = document.getElementById('confirmScreen');
  cs.style.display='flex';
  const d = dateVal ? new Date(dateVal+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  document.getElementById('confirmSub').textContent = (course||'Round') + (d?' · '+d:'');
  const sorted = [...players].sort((a,b)=>a.score-b.score);
  document.getElementById('confirmResult').innerHTML = sorted.map((p,i)=>
    `<div class="result-row">
      <span class="result-name">${i===0?'🏆 ':''}${p.name}</span>
      <span class="result-score">${p.score}</span>
    </div>`
  ).join('');
}

// Init date + 4 player rows
document.getElementById('roundDate').value = new Date().toLocaleDateString('en-CA');
for(let i=0;i<4;i++) addPlayer();
</script>
</body>
</html>
