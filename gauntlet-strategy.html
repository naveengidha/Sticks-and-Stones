*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#080f0a;--bg-card:#0e1a12;--gold:#ffd447;--gold-dim:rgba(255,212,71,0.45);--emerald:#2d9e6b;--ruby:#c0404a;--bar-hi:#2d9e6b;--bar-mid:#3a6899;--bar-lo:#4a6070;--bar-warn:#c0404a;}
body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;}

.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;}.nav-center svg{width:36px;height:36px;}

/* Player cards */
.player-card{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-user-select:none;}
.player-header:active{background:rgba(255,212,71,0.04);}
.player-name{font-size:16px;font-weight:bold;color:var(--gold);}
.player-rounds{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;}
.player-chevron{font-size:11px;color:rgba(255,212,71,0.4);transition:transform .2s;}
.player-body{border-top:1px solid rgba(255,212,71,0.1);}

/* Insight sections */
.insight-section{padding:8px 14px 10px;}
.insight-section+.insight-section{padding-top:8px;}
.insight-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.section-divider{display:flex;align-items:center;justify-content:center;gap:0;padding:18px 14px 12px;}
.section-divider::before,.section-divider::after{content:'';flex:0 0 60px;height:1px;background:rgba(255,212,71,0.45);}
.section-divider-label{font-size:13px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.9);white-space:nowrap;padding:0 12px;border-left:2px solid rgba(255,212,71,0.55);border-right:2px solid rgba(255,212,71,0.55);}
.insight-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dim);}
.insight-verdict{font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
.verdict-threat{background:rgba(45,158,107,0.18);color:#4dda9a;border:1px solid rgba(45,158,107,0.4);}
.verdict-good{background:rgba(180,30,42,0.22);color:#e8445a;border:1px solid rgba(180,30,42,0.45);}
.verdict-neutral{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);}
.insight-bullets{list-style:none;margin:0;padding:0;}
.insight-bullets li{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.45;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04);}
.insight-bullets li:last-child{border-bottom:none;}
.insight-bullets li::before{content:'·';position:absolute;left:4px;color:var(--gold-dim);font-size:16px;line-height:1;}
.insight-bullets li strong{color:#fff;}
.root-cause{display:none;}

/* Par breakdown bar */
.par-bars{display:flex;gap:8px;margin-top:4px;padding:0 2px;}
.par-bar-wrap{flex:1;text-align:center;}
.par-bar-label{font-size:9px;color:rgba(255,255,255,0.75);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.par-bar-track{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;position:relative;width:80%;margin:0 auto;}
.par-bar-track::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,0.25);z-index:1;}
.par-bar-track.no-mid::after{display:none;}
.par-bar-fill{position:absolute;top:0;height:100%;}
.par-bar-val{font-size:11px;color:rgba(255,255,255,0.6);margin-top:3px;}
</style>

<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('gameHistory')||'[]'); }catch(e){ return []; } }

function pct(n,d){ return d ? Math.round(n/d*100) : 0; }
function fmtVsPar(v){ return v===0?'E':v>0?'+'+v:String(v); }

function analyse(){
  let all = loadHistory();
  let area = document.getElementById('scrollArea');

  // Gather per-player data across stableford, stroke, mixed, banker
  let players = {};

  function ensurePlayer(name){
    if(!players[name]) players[name] = {
      rounds: 0,
      // Par breakdown: for each par type, track total vs-par diff and hole count
      parBreak: {3:{diff:0,holes:0}, 4:{diff:0,holes:0}, 5:{diff:0,holes:0}},
      // Score distribution
      scoreDist: {eagle:0,birdie:0,par:0,bogey:0,double:0,worse:0,total:0},
      // Stableford: 0-point holes (struggle holes)
      sfZeros: 0, sf1pt: 0, sf2pts: 0, sf3pts: 0, sf4pts: 0, sfHoles: 0,
      // Banker: wins/losses as player, wins/losses as banker
      bankerNet: 0, bankerPlayerHoles: 0, bankerWins: 0,
      bankerBankerHoles: 0, bankerSweeps: 0,
      // Pin: wins on par 3s
      pinWins: 0, pinHoles: 0,
      // Mixed gauntlet net
      gauntletNet: 0, gauntletRounds: 0
    };
    return players[name];
  }

  function trackDist(p, diff){
    p.scoreDist.total++;
    if(diff <= -2) p.scoreDist.eagle++;
    else if(diff === -1) p.scoreDist.birdie++;
    else if(diff === 0) p.scoreDist.par++;
    else if(diff === 1) p.scoreDist.bogey++;
    else if(diff === 2) p.scoreDist.double++;
    else p.scoreDist.worse++;
  }

  // Stableford rounds
  all.filter(r=>r.game==='stableford' && r.players && r.scoreHistory && r.holeParDist).forEach(r=>{
    r.players.forEach((name,pi)=>{
      let p = ensurePlayer(name);
      p.rounds++;
      r.scoreHistory.forEach((hole,hi)=>{
        let score = hole[pi], par = r.holeParDist[hi]?.par;
        if(score==null || !par) return;
        let diff = score - par;
        p.parBreak[par] && (p.parBreak[par].diff += diff, p.parBreak[par].holes++);
        p.sfHoles++;
        if(diff >= 2)       p.sfZeros++;
        else if(diff === 1) p.sf1pt++;
        else if(diff === 0) p.sf2pts++;
        else if(diff ===-1) p.sf3pts++;
        else                p.sf4pts++;
        trackDist(p, diff);
      });
    });
  });

  // Stroke rounds
  all.filter(r=>r.game==='stroke' && r.players && r.scoreHistory && r.holeParDist).forEach(r=>{
    r.players.forEach((name,pi)=>{
      let p = ensurePlayer(name);
      p.rounds++;
      r.scoreHistory.forEach((hole,hi)=>{
        let score = hole[pi], par = r.holeParDist[hi]?.par;
        if(score==null || !par) return;
        let diff = score - par;
        p.parBreak[par] && (p.parBreak[par].diff += diff, p.parBreak[par].holes++);
        trackDist(p, diff);
      });
    });
  });

  // Banker rounds
  all.filter(r=>r.game==='banker' && r.players && r.holeHistory).forEach(r=>{
    r.players.forEach(name=>ensurePlayer(name));
    (r.holeHistory||[]).forEach(h=>{
      let bankerName = r.players[h.bankerIdx];
      if(bankerName){
        let bp = ensurePlayer(bankerName);
        bp.bankerBankerHoles++;
        let playerWins = (h.matchups||[]).filter(m=>m.result==='player').length;
        if(playerWins===0) bp.bankerSweeps++;
      }
      (h.matchups||[]).forEach(m=>{
        let name = r.players[m.playerIdx];
        if(!name) return;
        let p = ensurePlayer(name);
        p.bankerPlayerHoles++;
        if(m.result==='player') p.bankerWins++;
      });
    });
    r.players.forEach((name,i)=>{
      ensurePlayer(name).bankerNet += r.playerNetTotals?.[i]||0;
    });
  });

  // Gambler's Gauntlet (mixed) rounds
  all.filter(r=>r.game==='mixed' && r.players).forEach(r=>{
    r.players.forEach((name,i)=>{
      let p = ensurePlayer(name);
      p.rounds++;
      p.gauntletNet += r.moneyNet?.[i]||0;
      p.gauntletRounds++;
    });
    (r.holeHistory||[]).forEach(h=>{
      if(!h.par) return;

      // parBreak + scoreDist for all scored formats
      if(h.format !== 'pin'){
        r.players.forEach((name,i)=>{
          let score = h.scores?.[i];
          if(score == null) return;
          let p = ensurePlayer(name);
          let diff = score - h.par;
          p.parBreak[h.par] && (p.parBreak[h.par].diff += diff, p.parBreak[h.par].holes++);
          trackDist(p, diff);
        });
      }

      // Stableford-specific stats
      if(h.format === 'stableford'){
        r.players.forEach((name,i)=>{
          let score = h.scores?.[i];
          if(score == null) return;
          let p = ensurePlayer(name);
          let diff = score - h.par;
          p.sfHoles++;
          if(diff >= 2)       p.sfZeros++;
          else if(diff === 1) p.sf1pt++;
          else if(diff === 0) p.sf2pts++;
          else if(diff ===-1) p.sf3pts++;
          else                p.sf4pts++;
        });
      }

      // Banker-specific stats
      if(h.format === 'banker'){
        let bankerName = r.players[h.bankerIdx];
        if(bankerName){
          let bp = ensurePlayer(bankerName);
          bp.bankerBankerHoles++;
          let playerWins = (h.matchups||[]).filter(m=>m.result==='player').length;
          if(playerWins === 0) bp.bankerSweeps++;
        }
        (h.matchups||[]).forEach(m=>{
          let name = r.players[m.playerIdx];
          if(!name) return;
          let p = ensurePlayer(name);
          p.bankerPlayerHoles++;
          if(m.result === 'player') p.bankerWins++;
        });
      }

      // Pin stats
      if(h.format === 'pin' && h.pinWinner){
        ensurePlayer(h.pinWinner).pinWins++;
        r.players.forEach(n=>ensurePlayer(n).pinHoles++);
      }
    });
  });

  let playerNames = Object.keys(players).filter(n=>
    Object.values(players[n]).some(v=>typeof v==='number'&&v!==0)
  );

  if(!playerNames.length){
    area.innerHTML = '<div class="empty-state">No round data yet.<br>Play some rounds to unlock dossiers.</div>';
    return;
  }

  // Sort by most rounds played
  playerNames.sort((a,b)=>players[b].gauntletRounds - players[a].gauntletRounds);

  let html = `<div style="font-size:11px;color:rgba(255,255,255,0.25);text-align:center;margin-bottom:14px;letter-spacing:.5px;">TAP A PLAYER TO EXPAND</div>`;

  playerNames.forEach((name,idx)=>{
    let p = players[name];
    let insights = buildInsights(name, p, players);
    let id = 'pc-'+idx;
    html += `<div class="player-card">
      <div class="player-header" onclick="toggleCard('${id}')">
        <div>
          <div class="player-name">${esc(name)}</div>
          <div class="player-rounds">${p.gauntletRounds} Gauntlet round${p.gauntletRounds!==1?'s':''} on record</div>
        </div>
        <span class="player-chevron" id="${id}-chev">▼</span>
      </div>
      <div class="player-body" id="${id}" style="display:none;">
        ${insights}
      </div>
    </div>`;
  });

  area.innerHTML = html;
}

function toggleCard(id){
  let body = document.getElementById(id);
  let chev = document.getElementById(id+'-chev');
  let open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  chev.style.transform = open ? 'rotate(180deg)' : '';
}

function rootCause(causes){
  if(!causes||!causes.length) return '';
  let items = causes.map(c=>`<span>[ ${c} ]</span>`).join('');
  return `<div class="root-cause"><span class="root-cause-label">Weapons / Tools</span>${items}</div>`;
}

function buildInsights(name, p, allPlayers){
  let sections = '';

  function sectionDiv(label){
    return `<div class="section-divider"><span class="section-divider-label">${label}</span></div>`;
  }

  function distBar(label, val, color){
    let fill = Math.min(100, Math.round(val));
    return `<div class="par-bar-wrap">
      <div class="par-bar-label">${label}</div>
      <div class="par-bar-track no-mid"><div class="par-bar-fill" style="left:0;width:${fill}%;background:${color};border-radius:3px;"></div></div>
      <div class="par-bar-val" style="color:${color};">${val}%</div>
    </div>`;
  }

  function section(label, verdictCls, verdictText, bullets){
    let hdr = `<div class="insight-header"><div class="insight-label">${label}</div>${verdictText?`<div class="insight-verdict ${verdictCls}">${verdictText}</div>`:''}</div>`;
    let li = bullets.map(b=>`<li>${b}</li>`).join('');
    let pre = sections ? sectionDiv(label) : `<div class="section-divider"><span class="section-divider-label">${label}</span></div>`;
    return `${pre}<div class="insight-section"><ul class="insight-bullets">${li}</ul></div>`;
  }

  // ── Par Breakdown ──
  let parData = [3,4,5].map(par=>{
    let d = p.parBreak[par];
    return {par, avg: d.holes ? d.diff/d.holes : null, holes: d.holes};
  }).filter(d=>d.holes > 0);

  if(parData.length){
    let worst = [...parData].sort((a,b)=>b.avg-a.avg)[0];
    let best  = [...parData].sort((a,b)=>a.avg-b.avg)[0];

    let barHtml = `<div class="par-bars">`;
    [3,4,5].forEach(par=>{
      let d = p.parBreak[par];
      if(!d.holes){ barHtml += `<div class="par-bar-wrap"><div class="par-bar-label">Par ${par}</div><div class="par-bar-track"><div class="par-bar-fill" style="width:0%;background:rgba(255,255,255,0.1);"></div></div><div class="par-bar-val">—</div></div>`; return; }
      let avg = d.diff/d.holes;
      let dispStr = (avg>=0?'+':'')+avg.toFixed(1);
      let color = avg < -0.1 ? 'var(--bar-hi)' : avg < 0.5 ? 'var(--bar-mid)' : avg < 1.2 ? 'var(--bar-warn)' : 'var(--bar-lo)';
      let halfPct = Math.min(50, Math.abs(avg) / 2 * 50);
      let fillStyle = avg < 0
        ? `left:${50-halfPct}%;width:${halfPct}%;background:${color};border-radius:3px 0 0 3px;`
        : `left:50%;width:${halfPct}%;background:${color};border-radius:0 3px 3px 0;`;
      barHtml += `<div class="par-bar-wrap">
        <div class="par-bar-label">Par ${par}</div>
        <div class="par-bar-track"><div class="par-bar-fill" style="${fillStyle}"></div></div>
        <div class="par-bar-val" style="color:${color};">${dispStr}</div>
      </div>`;
    });
    barHtml += `</div>`;

    let bullets = [];
    bullets.push(`Weakest on par ${worst.par}s — avg <strong>${(worst.avg>=0?'+':'')+worst.avg.toFixed(1)}</strong> per hole <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
    if(best.par !== worst.par) bullets.push(`Strongest on par ${best.par}s — avg <strong>${(best.avg>=0?'+':'')+best.avg.toFixed(1)}</strong> per hole`);

    let parCauses = {
      3: ['Mid/short irons','Tee shot accuracy','Green reading'],
      4: ['Driver off tee','Approach iron','Lay-up decision'],
      5: ['Driver distance','Fairway wood/hybrid','Third shot wedge'],
    };
    let worstCauses = worst.avg > 1.5
      ? parCauses[worst.par]
      : parCauses[worst.par].slice(0,2);

    // ── Score distribution stats (only if enough holes) ──
    let distHtml = '';
    let sd = p.scoreDist;
    if(sd.total >= 9){
      let birdiePct    = pct(sd.birdie + sd.eagle, sd.total);
      let parPct       = pct(sd.par, sd.total);
      let bogeypct     = pct(sd.bogey, sd.total);
      let blowupPct    = pct(sd.double + sd.worse, sd.total);

      let birdieColor = birdiePct >= 25 ? 'var(--bar-hi)' : birdiePct >= 10 ? 'var(--bar-mid)' : 'var(--bar-lo)';
      let parColor    = 'var(--bar-mid)';
      let bogeyColor  = bogeypct  <= 25 ? 'var(--bar-mid)' : 'var(--bar-warn)';
      let blowupColor = blowupPct >= 25 ? 'var(--bar-warn)' : blowupPct <= 10 ? 'var(--bar-hi)' : 'var(--bar-mid)';

      distHtml = `${sectionDiv('Stroke Play')}<div class="insight-section"><div class="par-bars">
          ${distBar('Birdie+', birdiePct, birdieColor)}
          ${distBar('Par', parPct, parColor)}
          ${distBar('Bogey', bogeypct, bogeyColor)}
          ${distBar('Dbl+', blowupPct, blowupColor)}
        </div></div>`;
    }

    sections += `${sections?sectionDiv('Scoring by Par'):sectionDiv('Scoring by Par')}<div class="insight-section">
      ${barHtml}
    </div>${distHtml}`;
  }

  // ── Stableford tendencies ──
  if(p.sfHoles > 0){
    let zeroPct    = pct(p.sfZeros, p.sfHoles);
    let onePct     = pct(p.sf1pt,   p.sfHoles);
    let twoPct     = pct(p.sf2pts,  p.sfHoles);
    let threePlusPct = pct(p.sf3pts + p.sf4pts, p.sfHoles);
    let avgPts = ((p.sf4pts * 4) + (p.sf3pts * 3) + (p.sf2pts * 2) + (p.sf1pt * 1)) / p.sfHoles;
    let avgColor = avgPts >= 2.5 ? 'var(--bar-hi)' : avgPts >= 1.8 ? 'var(--bar-mid)' : 'var(--bar-warn)';
    let sfBarHtml = `<div class="par-bars">
      ${distBar('3+ pts', threePlusPct, threePlusPct >= 25 ? 'var(--bar-hi)' : threePlusPct >= 10 ? 'var(--bar-mid)' : 'var(--bar-lo)')}
      ${distBar('2 pts',  twoPct,       'var(--bar-mid)')}
      ${distBar('1 pt',   onePct,       'var(--bar-mid)')}
      ${distBar('0 pts',  zeroPct,      zeroPct >= 30 ? 'var(--bar-warn)' : zeroPct <= 15 ? 'var(--bar-hi)' : 'var(--bar-mid)')}
    </div>
    <div style="text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,0.45);">Avg <strong style="color:${avgColor};">${avgPts.toFixed(2)}</strong> pts / hole</div>`;
    sections += `${sectionDiv('Stableford')}<div class="insight-section">${sfBarHtml}</div>`;
  }

  // ── Banker tendencies ──
  if(p.bankerPlayerHoles > 0 || p.bankerBankerHoles > 0){
    let bankerCauses = [];
    let bankerBarHtml = '';

    if(p.bankerPlayerHoles > 0){
      let winPct  = pct(p.bankerWins, p.bankerPlayerHoles);
      let losePct = 100 - winPct;
      let vcls = winPct >= 55 ? 'verdict-good' : winPct <= 35 ? 'verdict-threat' : 'verdict-neutral';
      let winColor  = winPct >= 55 ? 'var(--bar-hi)' : winPct <= 35 ? 'var(--bar-warn)' : 'var(--bar-mid)';
      let loseColor = losePct >= 65 ? 'var(--bar-warn)' : losePct >= 50 ? 'var(--bar-mid)' : 'var(--bar-lo)';
      bankerBarHtml += `<div style="font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;text-align:center;">As Player</div>
        <div class="par-bars">
          ${distBar('Win', winPct, winColor)}
          ${distBar('Loss', losePct, loseColor)}
        </div>`;
      if(winPct <= 35) bankerCauses = ['Scoring consistency under pressure','Mid-iron approach play','Short game & up-and-down'];
      else if(winPct >= 55) bankerCauses = ['Banker selection timing','Knowing when to double','Pressure putting'];
    }

    if(p.bankerBankerHoles > 0){
      let sweepPct   = pct(p.bankerSweeps, p.bankerBankerHoles);
      let noSweepPct = 100 - sweepPct;
      let sweepColor = sweepPct >= 50 ? 'var(--bar-hi)' : 'var(--bar-mid)';
      bankerBarHtml += `${p.bankerPlayerHoles > 0 ? '<div style="height:10px;"></div>' : ''}
        <div style="font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;text-align:center;">As Banker</div>
        <div class="par-bars">
          ${distBar('Sweep', sweepPct, sweepColor)}
          ${distBar('Beaten', noSweepPct, 'var(--bar-lo)')}
        </div>`;
      if(sweepPct >= 50 && !bankerCauses.length) bankerCauses = ['Opponent reads banker poorly','Strong iron play as banker','Course management advantage'];
    }

    let bankerBullets = [];
    if(p.bankerPlayerHoles > 0){
      let winPct = pct(p.bankerWins, p.bankerPlayerHoles);
      if(winPct <= 35) bankerBullets.push(`Wins only <strong>${winPct}%</strong> vs the banker — predictable target <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
      else if(winPct >= 55) bankerBullets.push(`Beats the banker <strong>${winPct}%</strong> of the time — dangerous opponent <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
      else bankerBullets.push(`Wins <strong>${winPct}%</strong> of holes as player vs banker`);
    }
    if(p.bankerBankerHoles > 0){
      let sweepPct = pct(p.bankerSweeps, p.bankerBankerHoles);
      if(sweepPct >= 50) bankerBullets.push(`Sweeps the field on <strong>${sweepPct}%</strong> of banker holes — dominant when holding <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
      else bankerBullets.push(`Sweeps <strong>${sweepPct}%</strong> of holes as banker`);
    }
    if(p.bankerNet !== 0){
      let netStr = (p.bankerNet>0?'+$':'-$')+Math.abs(p.bankerNet);
      let clr = p.bankerNet>0?'var(--bar-hi)':'var(--bar-warn)';
      bankerBullets.push(`Overall banker net: <strong style="color:${clr};">${netStr}</strong>`);
    }
    sections += `${sectionDiv('Banker')}<div class="insight-section">${bankerBarHtml}</div>`;
  }

  // ── Pin tendencies ──
  if(p.pinHoles > 0){
    let pinPct    = pct(p.pinWins, p.pinHoles);
    let pinMissPct = 100 - pinPct;
    let vcls = pinPct >= 40 ? 'verdict-good' : pinPct <= 10 ? 'verdict-threat' : 'verdict-neutral';
    let vtxt = pinPct >= 40 ? 'Avoid' : pinPct <= 10 ? 'Target' : '';
    let pinColor  = pinPct >= 40 ? 'var(--bar-hi)' : pinPct <= 10 ? 'var(--bar-warn)' : 'var(--bar-mid)';
    let missColor = 'var(--bar-lo)';
    let pinCauses = pinPct >= 40
      ? ['Dangerous tee iron / hybrid','Accurate distance control','Reads greens well from tee']
      : pinPct <= 10
      ? ['Short iron accuracy','Tee club selection on par 3s','Distance control with irons']
      : [];
    let pinBarHtml = `<div class="par-bars" style="justify-content:center;">
      <div class="par-bar-wrap" style="flex:0 0 70%;">
        <div class="par-bar-label">Pin Win Rate</div>
        <div class="par-bar-track no-mid"><div class="par-bar-fill" style="left:0;width:${pinPct}%;background:${pinColor};border-radius:3px;"></div></div>
        <div class="par-bar-val" style="color:${pinColor};">${pinPct}% — ${p.pinWins}/${p.pinHoles} holes</div>
      </div>
    </div>`;
    let pinBullets = [];
    if(pinPct >= 40) pinBullets.push(`Wins the pin on <strong>${pinPct}%</strong> of par 3s — elite proximity from the tee <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
    else if(pinPct <= 10) pinBullets.push(`Only <strong>${pinPct}%</strong> pin wins — irons rarely threaten the flag <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
    else pinBullets.push(`${p.pinWins} win${p.pinWins!==1?'s':''} from ${p.pinHoles} pin holes`);
    sections += `${sectionDiv('Closest to Pin')}<div class="insight-section">${pinBarHtml}</div>`;
  }

  // ── Gauntlet Notes ──
  {
    let notes = [];

    // Money record
    if(p.gauntletRounds > 0){
      let netStr = (p.gauntletNet>=0?'+$':'-$')+Math.abs(p.gauntletNet);
      if(p.gauntletNet < -5)
        notes.push(`Down <strong style="color:var(--bar-warn);">${netStr}</strong> across ${p.gauntletRounds} round${p.gauntletRounds!==1?'s':''} — consistently losing money`);
      else if(p.gauntletNet > 5)
        notes.push(`Up <strong style="color:var(--bar-hi);">${netStr}</strong> across ${p.gauntletRounds} round${p.gauntletRounds!==1?'s':''} — extracting value from the group`);
      else
        notes.push(`Net <strong>${netStr}</strong> across ${p.gauntletRounds} round${p.gauntletRounds!==1?'s':''} — roughly breaking even`);
    }

    // Weakest par type (scoring by par)
    let parTypes = [3,4,5].map(par=>{
      let d = p.parBreak[par];
      return {par, avg: d.holes >= 3 ? d.diff/d.holes : null, holes: d.holes};
    }).filter(d=>d.avg !== null);
    if(parTypes.length){
      let worst = [...parTypes].sort((a,b)=>b.avg-a.avg)[0];
      let best  = [...parTypes].sort((a,b)=>a.avg-b.avg)[0];
      if(worst.avg > 0.2)
        notes.push(`Struggles on par ${worst.par}s — avg <strong>${worst.avg>=0?'+':''}${worst.avg.toFixed(1)}</strong> per hole <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
      else if(best.avg < -0.1)
        notes.push(`Strongest on par ${best.par}s — avg <strong>${best.avg>=0?'+':''}${best.avg.toFixed(1)}</strong> per hole <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
    }

    // Stableford consistency
    if(p.sfHoles >= 6){
      let zeroPct   = pct(p.sfZeros, p.sfHoles);
      let birdiePct = pct(p.sf3pts + p.sf4pts, p.sfHoles);
      if(zeroPct >= 30)
        notes.push(`Gives up <strong>${zeroPct}%</strong> of stableford holes — inconsistent scorer <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
      else if(birdiePct >= 35)
        notes.push(`Birdies or better on <strong>${birdiePct}%</strong> of stableford holes — elite points generator <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
    }

    // Banker tendencies
    if(p.bankerPlayerHoles >= 4){
      let winPct = pct(p.bankerWins, p.bankerPlayerHoles);
      if(winPct <= 30)
        notes.push(`Wins only <strong>${winPct}%</strong> as player vs the banker — easy to bank against <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
      else if(winPct >= 55)
        notes.push(`Beats the banker <strong>${winPct}%</strong> of the time — difficult to hold against <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
    }
    if(p.bankerBankerHoles >= 4){
      let sweepPct = pct(p.bankerSweeps, p.bankerBankerHoles);
      if(sweepPct >= 50)
        notes.push(`Sweeps <strong>${sweepPct}%</strong> of holes as banker — dominant when holding <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
    }

    // Pin tendencies
    if(p.pinHoles >= 4){
      let pinPct = pct(p.pinWins, p.pinHoles);
      if(pinPct >= 40)
        notes.push(`Wins the pin on <strong>${pinPct}%</strong> of par 3s — elite proximity <span class="insight-verdict verdict-good" style="margin-left:6px;">Avoid</span>`);
      else if(pinPct <= 10)
        notes.push(`Only <strong>${pinPct}%</strong> pin wins — irons rarely threaten the flag <span class="insight-verdict verdict-threat" style="margin-left:6px;">Target</span>`);
    }

    if(notes.length){
      // Show top 3 most actionable notes
      let top = notes.slice(0, 3);
      let notesHtml = `<div style="display:flex;flex-direction:column;gap:8px;">${top.map(n=>`<div style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.45;">${n}</div>`).join('')}</div>`;
      sections += `${sectionDiv('Gauntlet Notes')}<div class="insight-section">${notesHtml}</div>`;
    }
  }

  if(!sections) sections = `<div style="padding:16px 14px;font-size:13px;color:rgba(255,255,255,0.3);">Not enough data yet.</div>`;

  return sections + '<div style="height:6px;"></div>';
}

try{ analyse(); }catch(e){
  document.getElementById('scrollArea').innerHTML = `<div class="empty-state">Error loading dossier.<br><small style="font-size:11px;opacity:.5;">${e.message}</small></div>`;
}
</script>
</body>
</html>
