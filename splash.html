<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sticks &amp; Stones">
<meta name="theme-color" content="#080f0a">
<title>Sticks &amp; Stones</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#080f0a;font-family:'Georgia','Times New Roman',serif;color:#fff;overscroll-behavior:none;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;}
.crest{margin-bottom:28px;opacity:0;animation:fadeUp .8s ease forwards .2s;}
.title{font-size:28px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;color:#ffd447;text-align:center;margin:0 0 8px;opacity:0;animation:fadeUp .7s ease forwards .55s;}
.subtitle{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,212,71,0.4);text-align:center;margin:0;opacity:0;animation:fadeUp .7s ease forwards .75s;}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,212,71,0.5),transparent);margin:20px auto 0;opacity:0;animation:fadeUp .6s ease forwards .9s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
</style>
<script>
if(!sessionStorage.getItem('ssSplashSeen')){
  sessionStorage.setItem('ssSplashSeen','1');
  setTimeout(()=>{ window.location.replace('index.html'); }, 3500);
} else {
  window.location.replace('index.html');
}
</script>
</head>
<body>

<!-- Club crest SVG -->
<svg class="crest" width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rings -->
  <circle cx="60" cy="60" r="57" stroke="rgba(184,150,46,0.4)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="50" stroke="rgba(184,150,46,0.2)" stroke-width="1"/>
  <!-- Laurel leaves along ring border (r=53.5, 15 leaves at 24° intervals) -->
  <g fill="rgba(212,180,80,0.35)" stroke="rgba(212,180,80,0.15)" stroke-width="0.3">
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(0,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(24,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(48,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(72,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(96,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(120,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(144,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(168,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(192,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(216,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(240,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(264,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(288,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(312,60,60)"/>
    <ellipse cx="60" cy="6.5" rx="2.2" ry="1.1" transform="rotate(336,60,60)"/>
  </g>
  <!-- Shield -->
  <path d="M60 23 L83 35 L83 63 Q83 81 60 93 Q37 81 37 63 L37 35 Z"
        fill="rgba(255,212,71,0.05)" stroke="#8B6914" stroke-width="1.5"/>
  <!-- Golf flag pin -->
  <line x1="60" y1="73" x2="60" y2="47" stroke="rgba(255,212,71,0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M60 47 L73 52 L60 57 Z" fill="rgba(255,212,71,0.75)"/>
  <!-- Hole/green circle -->
  <ellipse cx="60" cy="74" rx="10" ry="3.5" fill="rgba(46,180,80,0.25)" stroke="rgba(46,180,80,0.4)" stroke-width="1"/>
  <!-- Golf ball -->
  <circle cx="53" cy="72" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="52" cy="71" r="0.7" fill="#ccc"/>
  <circle cx="54.5" cy="70.5" r="0.7" fill="#ccc"/>
  <circle cx="53.5" cy="73" r="0.7" fill="#ccc"/>
  <!-- Curved title text path (bottom arc) -->
  <path id="bottomArc" d="M 19,73 A 42,42 0 0,0 101,73" fill="none"/>
  <text font-family="Georgia,'Times New Roman',serif" font-size="9" font-weight="bold"
        fill="rgba(255,212,71,0.85)" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">STICKS &amp; STONES</textPath>
  </text>
</svg>

<h1 class="title">Sticks &amp; Stones</h1>
<p class="subtitle">Your digital clubhouse</p>
<div class="divider"></div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
