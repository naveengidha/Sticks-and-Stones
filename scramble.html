<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Georgia','Times New Roman',serif;background:#080f0a;margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none;}
.scroll-area{flex:1;overflow-y:auto;padding:12px 14px 110px;display:flex;justify-content:center;align-items:flex-start;}
.container{width:100%;max-width:480px;display:flex;flex-direction:column;}
.page-header{text-align:center;padding:20px 16px 4px;font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;font-family:'Georgia','Times New Roman',serif;}
.page-sub{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin:2px 0 16px;}
.setup-section{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.setup-section.team-a{border-left:3px solid rgba(255,212,71,0.5);}
.setup-section.team-b{border-left:3px solid rgba(100,160,220,0.5);}
.setup-section-label{font-size:9px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.45);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,212,71,0.1);}
.setup-section-label.b{color:rgba(100,160,220,0.55);}
.field-input{width:100%;padding:7px 10px;box-sizing:border-box;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#fff;font-size:14px;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;letter-spacing:.3px;margin-bottom:0;}
.field-input::placeholder{color:rgba(255,255,255,0.25);}
.field-input:focus{outline:none;border-color:rgba(255,212,71,0.7);background:rgba(0,0,0,0.55);}
.ac-dropdown{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:200;background:#0e1a12;border:1px solid rgba(255,212,71,0.35);border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.6);}
.ac-item{padding:9px 11px;font-size:13px;font-family:'Courier New',monospace;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);}
.ac-item:last-child{border-bottom:none;}
.ac-item:active,.ac-item.focused{background:rgba(255,212,71,0.12);color:#ffd447;}
.select-input{width:100%;padding:7px 10px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#ffd447;font-size:14px;background:rgba(0,0,0,0.5);font-family:'Courier New',monospace;color-scheme:dark;}
.date-course-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
input[type="date"].field-input{-webkit-appearance:none;appearance:none;color-scheme:dark;}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
.score-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:4px;}
.score-input{width:100%;padding:9px 6px;border-radius:4px;border:1px solid rgba(255,212,71,0.2);border-bottom:2px solid rgba(255,212,71,0.4);color:#ffd447;font-size:20px;font-weight:bold;background:rgba(0,0,0,0.4);font-family:'Courier New',monospace;text-align:center;-webkit-appearance:none;appearance:none;}
.score-input:focus{outline:none;border-color:rgba(255,212,71,0.7);}
.score-input::placeholder{color:rgba(255,255,255,0.2);font-size:14px;}
.score-input.team-b{border-color:rgba(100,160,220,0.2);border-bottom-color:rgba(100,160,220,0.4);color:#64a0dc;}
.score-input.team-b:focus{border-color:rgba(100,160,220,0.7);}
.vspar-row{text-align:center;font-family:'Courier New',monospace;font-size:12px;font-weight:bold;margin-top:4px;min-height:16px;}
.vspar-under{color:#2ecc71;}
.vspar-over{color:#ff6b6b;}
.vspar-even{color:rgba(255,255,255,0.4);}
.save-btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;margin-top:4px;}
.save-btn:active{opacity:.85;}
.set-teams-btn{width:100%;padding:11px;border:1px solid rgba(255,212,71,0.4);border-radius:8px;font-size:13px;font-weight:bold;background:rgba(255,212,71,0.07);color:#ffd447;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;margin-bottom:10px;}
.set-teams-btn:active{background:rgba(255,212,71,0.14);}
.error-msg{color:#ff6b6b;font-size:13px;text-align:center;margin:6px 0;display:none;}
.confirm-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 24px 110px;text-align:center;}
.confirm-icon{font-size:48px;margin-bottom:16px;}
.confirm-title{font-size:22px;font-weight:bold;color:#ffd447;letter-spacing:.5px;margin-bottom:8px;}
.confirm-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:32px;}
.confirm-result{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.03) 0,rgba(255,212,71,0.03) 1px,transparent 1px,transparent 10px),#0e1a12;border:1px solid rgba(255,212,71,0.2);border-radius:10px;padding:12px 16px;width:100%;max-width:360px;margin-bottom:24px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px;}
.result-row:last-child{border-bottom:none;}
.result-name{color:#fff;font-weight:bold;}
.result-score{font-family:'Courier New',monospace;color:#ffd447;font-weight:bold;font-size:16px;}
.done-btn{width:100%;max-width:360px;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;background:linear-gradient(135deg,#5c3317,#ffd447,#5c3317);color:#0a0a00;cursor:pointer;box-shadow:0 2px 16px rgba(139,94,60,0.5);letter-spacing:2px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.done-btn:active{opacity:.85;}
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;pointer-events:none;}
.nav-pill{display:flex;align-items:center;gap:2px;background:#0e1a12;border:1px solid rgba(255,212,71,0.28);border-radius:50px;padding:6px 10px;box-shadow:0 4px 24px rgba(0,0,0,0.6);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:40px;cursor:pointer;text-decoration:none;color:rgba(255,212,71,0.35);font-size:9px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;transition:color .15s;}
.nav-item.active{color:#ffd447;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;border:none;}
.nav-center svg{width:36px;height:36px;}
/* player-row: input + hcp badge side by side */
.player-row{display:flex;align-items:center;gap:6px;position:relative;}
.player-row .field-input{flex:1;min-width:0;}
.hcp-badge{font-size:10px;font-family:'Courier New',monospace;font-weight:bold;color:rgba(255,212,71,0.5);background:rgba(255,212,71,0.07);border:1px solid rgba(255,212,71,0.2);border-radius:5px;padding:3px 6px;white-space:nowrap;min-width:36px;text-align:center;flex-shrink:0;}
/* team name display inside team cards after set */
.team-names{font-size:16px;font-weight:bold;color:#fff;margin-bottom:10px;line-height:1.4;}
.accept-btn{width:100%;padding:11px;border:1px solid rgba(76,200,120,0.4);border-radius:8px;font-size:13px;font-weight:bold;background:rgba(76,200,120,0.07);color:#2ecc71;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;margin-bottom:10px;}
.accept-btn:active{background:rgba(76,200,120,0.14);}
.accepted-banner{text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#2ecc71;margin-bottom:10px;padding:8px;border:1px solid rgba(76,200,120,0.25);border-radius:6px;background:rgba(76,200,120,0.06);}
</style>

        <div class="vspar-row" id="vspA"></div>

      <div class="setup-section team-b" id="teamBCard" style="display:none;">

        <div class="vspar-row" id="vspB"></div>

      <div class="error-msg" id="errorMsg">Enter player names and scores for both teams.</div>

</div>

<script src="season.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

document.getElementById('roundDate').value = new Date().toLocaleDateString('en-CA');

(function(){
  try{
    const seasons = JSON.parse(localStorage.getItem('seasons')||'[]')
      .filter(s=>s.status==='active'&&(!s.allowedGames||s.allowedGames.includes('scramble')));
    const sel = document.getElementById('seasonSelect');
    if(sel) seasons.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; sel.appendChild(o); });
    const urlSeasonId = new URLSearchParams(location.search).get('seasonId');
    if(urlSeasonId && sel){ sel.value=urlSeasonId; if(sel.value==urlSeasonId) onSeasonPick(); }
  }catch(e){}
})();

// ── Handicap index lookup ──────────────────────────────────────────────────

function getHandicapIndex(name){
  try{
    const hist = JSON.parse(localStorage.getItem('gameHistory')||'[]');
    const rounds = hist.filter(r=>
      r.game==='stroke' && r.players && r.playerTotals &&
      ((r.holeParDist && r.holeParDist.length) || r.coursePar) &&
      r.players.includes(name)
    ).map(r=>{
      const idx = r.players.indexOf(name);
      const score = r.playerTotals[idx];
      const par = (r.holeParDist && r.holeParDist.length)
        ? r.holeParDist.reduce((s,h)=>s+(h.par||4),0) : r.coursePar;
      const slope = r.courseSlope||113;
      const rating = r.courseRating||par;
      return {date:r.date, diff:+((score-rating)*113/slope).toFixed(1)};
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));

    if(!rounds.length) return null;
    const recent = rounds.slice(-20);
    const useCount = Math.min(8, Math.max(1, Math.floor(recent.length*0.4)));
    const best = [...recent].sort((a,b)=>a.diff-b.diff).slice(0, useCount);
    return +(best.reduce((s,r)=>s+r.diff,0)/best.length*0.96).toFixed(1);
  }catch(e){ return null; }
}

// ── Known player names ─────────────────────────────────────────────────────

function getKnownPlayers(){
  try{
    const hist = JSON.parse(localStorage.getItem('gameHistory')||'[]');
    const names = new Set();
    hist.forEach(r=>{ if(r.players) r.players.forEach(n=>{ if(n) names.add(n.trim()); }); });
    return [...names].sort((a,b)=>a.localeCompare(b));
  }catch(e){ return []; }
}

// ── Autocomplete ───────────────────────────────────────────────────────────

const playerIds = ['p1','p2','p3','p4'];

function setupPlayerAutocomplete(){
  const allNames = getKnownPlayers();
  if(!allNames.length) return;
  let activeDropdown = null;

  function closeDropdown(){
    if(activeDropdown){ activeDropdown.remove(); activeDropdown=null; }
  }

  function openDropdown(input, matches){
    closeDropdown();
    if(!matches.length) return;
    const wrap = input.closest('.player-row');
    const dd = document.createElement('div');
    dd.className = 'ac-dropdown';
    matches.forEach(name=>{
      const item = document.createElement('div');
      item.className = 'ac-item';
      item.textContent = name;
      item.addEventListener('mousedown', e=>{ e.preventDefault(); input.value=name; updateHcpBadge(input.id); closeDropdown(); });
      item.addEventListener('touchstart', e=>{ e.preventDefault(); input.value=name; updateHcpBadge(input.id); closeDropdown(); input.blur(); }, {passive:false});
      dd.appendChild(item);
    });
    wrap.appendChild(dd);
    activeDropdown = dd;
  }

  playerIds.forEach(id=>{
    const input = document.getElementById(id);
    if(!input) return;
    input.addEventListener('input', ()=>{
      updateHcpBadge(id);
      const val = input.value.trim().toLowerCase();
      if(!val){ closeDropdown(); return; }
      const otherVals = new Set(playerIds.filter(x=>x!==id).map(x=>document.getElementById(x)?.value.trim()).filter(Boolean));
      const matches = allNames.filter(n=>n.toLowerCase().startsWith(val) && !otherVals.has(n));
      if(matches.length===1 && matches[0].toLowerCase()===val){ closeDropdown(); return; }
      openDropdown(input, matches.slice(0,5));
    });
    input.addEventListener('blur', ()=>setTimeout(closeDropdown, 150));
  });

  document.addEventListener('touchstart', e=>{
    if(activeDropdown && !activeDropdown.contains(e.target)) closeDropdown();
  });
}

function updateHcpBadge(inputId){
  const num = inputId.replace('p','');
  const badge = document.getElementById('hcp'+num);
  if(!badge) return;
  const name = document.getElementById(inputId).value.trim();
  if(!name){ badge.textContent='—'; return; }
  const idx = getHandicapIndex(name);
  badge.textContent = idx!==null ? String(idx) : '—';
}

setupPlayerAutocomplete();

// ── Set Teams ──────────────────────────────────────────────────────────────

let teamAssignment = null; // {a:[name,name], b:[name,name]}

restoreActiveRound();

function setTeams(){
  const names = playerIds.map(id=>document.getElementById(id).value.trim()).filter(Boolean);
  if(names.length < 2){
    const err = document.getElementById('errorMsg');
    err.textContent = 'Enter at least 2 player names.';
    err.style.display='block';
    setTimeout(()=>err.style.display='none', 2500);
    return;
  }
  document.getElementById('errorMsg').style.display='none';

  // Attach handicap index (null = no history, treated as mid-range for pairing)
  const withHcp = names.map(name=>({ name, hcp: getHandicapIndex(name) }));

  // Sort by handicap: nulls go to the middle
  withHcp.sort((a,b)=>{
    if(a.hcp===null && b.hcp===null) return 0;
    if(a.hcp===null) return 1;
    if(b.hcp===null) return -1;
    return a.hcp - b.hcp;
  });

  // Snake draft: rank 1+4 vs 2+3 (best balanced pairing)
  let teamA, teamB;
  if(withHcp.length === 4){
    teamA = [withHcp[0].name, withHcp[3].name];
    teamB = [withHcp[1].name, withHcp[2].name];
  } else if(withHcp.length === 3){
    teamA = [withHcp[0].name, withHcp[2].name];
    teamB = [withHcp[1].name];
  } else {
    teamA = [withHcp[0].name];
    teamB = [withHcp[1].name];
  }

  teamAssignment = {a: teamA, b: teamB};

  // Render team name labels
  document.getElementById('teamANames').innerHTML =
    teamA.map(n=>`<span style="color:#ffd447;">${esc(n)}</span>`).join('<span style="color:rgba(255,255,255,0.3);margin:0 4px;">&</span>');
  document.getElementById('teamBNames').innerHTML =
    teamB.map(n=>`<span style="color:#64a0dc;">${n}</span>`).join('<span style="color:rgba(255,255,255,0.3);margin:0 4px;">&</span>');

  document.getElementById('teamACard').style.display='block';
  document.getElementById('teamBCard').style.display='block';
  document.getElementById('acceptBtn').style.display='block';
  document.getElementById('acceptedBanner').style.display='none';
  document.getElementById('saveBtn').style.display='none';
}

// ── Accept & active round ──────────────────────────────────────────────────

function acceptTeams(){
  if(!teamAssignment) return;
  saveActiveRound();
  document.getElementById('acceptBtn').style.display='none';
  document.getElementById('acceptedBanner').style.display='block';
  document.getElementById('saveBtn').style.display='block';
  // lock player inputs and Set Teams button
  document.getElementById('playersSection').style.pointerEvents='none';
  document.getElementById('playersSection').style.opacity='0.5';
}

function saveActiveRound(){
  if(!teamAssignment) return;
  const course = document.getElementById('courseInput').value.trim();
  const dateVal = document.getElementById('roundDate').value;
  const par = document.getElementById('parInput').value;
  localStorage.setItem('activeGame_scramble', JSON.stringify({
    teamAssignment,
    course,
    dateVal,
    par,
    players: [...teamAssignment.a, ...teamAssignment.b],
    startedAt: new Date().toISOString()
  }));
}

function clearActiveRound(){
  localStorage.removeItem('activeGame_scramble');
}

function restoreActiveRound(){
  try{
    const s = JSON.parse(localStorage.getItem('activeGame_scramble')||'null');
    if(!s || !s.teamAssignment) return false;

    teamAssignment = s.teamAssignment;

    // Restore round detail fields
    if(s.course) document.getElementById('courseInput').value = s.course;
    if(s.dateVal) document.getElementById('roundDate').value = s.dateVal;
    if(s.par) document.getElementById('parInput').value = s.par;

    // Fill player inputs (greyed out) and hcp badges
    const allPlayers = [...s.teamAssignment.a, ...s.teamAssignment.b];
    playerIds.forEach((id,i)=>{
      const el = document.getElementById(id);
      if(el && allPlayers[i]){ el.value = allPlayers[i]; updateHcpBadge(id); }
    });

    // Render team cards
    document.getElementById('teamANames').innerHTML =
      s.teamAssignment.a.map(n=>`<span style="color:#ffd447;">${esc(n)}</span>`).join('<span style="color:rgba(255,255,255,0.3);margin:0 6px;">&</span>');
    document.getElementById('teamBNames').innerHTML =
      s.teamAssignment.b.map(n=>`<span style="color:#64a0dc;">${esc(n)}</span>`).join('<span style="color:rgba(255,255,255,0.3);margin:0 6px;">&</span>');

    document.getElementById('teamACard').style.display='block';
    document.getElementById('teamBCard').style.display='block';
    document.getElementById('acceptBtn').style.display='none';
    document.getElementById('acceptedBanner').style.display='block';
    document.getElementById('saveBtn').style.display='block';
    document.getElementById('playersSection').style.pointerEvents='none';
    document.getElementById('playersSection').style.opacity='0.5';
    return true;
  }catch(e){ return false; }
}

function onSeasonPick(){
  try{
    const seasonId = parseInt(document.getElementById('seasonSelect').value);
    if(!seasonId) return;
    const season = JSON.parse(localStorage.getItem('seasons')||'[]').find(s=>s.id===seasonId);
    if(!season||!season.players||season.players.length<2) return;
    const p = season.players;
    playerIds.forEach((id,i)=>{
      const el=document.getElementById(id);
      if(el&&p[i]){ el.value=p[i].name||''; updateHcpBadge(id); }
    });
  }catch(e){}
}

// ── Utils ──────────────────────────────────────────────────────────────────

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtVsPar(v){ return v>0?'+'+v:v===0?'E':String(v); }

function updateVsPar(){
  const sA=parseInt(document.getElementById('scoreA').value);
  const sB=parseInt(document.getElementById('scoreB').value);
  const par=parseInt(document.getElementById('parInput').value);
  const vspA=document.getElementById('vspA');
  const vspB=document.getElementById('vspB');
  if(!isNaN(sA)&&!isNaN(par)){
    const v=sA-par;
    vspA.className='vspar-row '+(v<0?'vspar-under':v>0?'vspar-over':'vspar-even');
    vspA.textContent=fmtVsPar(v)+' vs par';
  } else { vspA.className='vspar-row'; vspA.textContent=''; }
  if(!isNaN(sB)&&!isNaN(par)){
    const v=sB-par;
    vspB.className='vspar-row '+(v<0?'vspar-under':v>0?'vspar-over':'vspar-even');
    vspB.textContent=fmtVsPar(v)+' vs par';
  } else { vspB.className='vspar-row'; vspB.textContent=''; }
}

// ── Save ───────────────────────────────────────────────────────────────────

function saveRound(){
  if(!teamAssignment){ return; }
  const teamA = teamAssignment.a;
  const teamB = teamAssignment.b;
  const sA=parseInt(document.getElementById('scoreA').value);
  const sB=parseInt(document.getElementById('scoreB').value);
  const par=parseInt(document.getElementById('parInput').value);
  const err=document.getElementById('errorMsg');

  if(!teamA.length||!teamB.length||isNaN(sA)||isNaN(sB)){
    err.textContent='Enter scores for both teams.';
    err.style.display='block';
    setTimeout(()=>err.style.display='none',2500);
    return;
  }
  err.style.display='none';

  const teamNameA=teamA.join(' & ');
  const teamNameB=teamB.join(' & ');
  const dateVal=document.getElementById('roundDate').value;
  const course=document.getElementById('courseInput').value.trim();

  const record={
    id:Date.now(), game:'scramble',
    date:new Date(dateVal+'T12:00:00').toISOString(),
    course,
    teamNames:[teamNameA,teamNameB],
    players:[...teamA,...teamB],
    teamScores:[sA,sB],
    teamVsPar:[!isNaN(par)?sA-par:null,!isNaN(par)?sB-par:null],
    holeHistory:null
  };

  try{
    const existing=JSON.parse(localStorage.getItem('gameHistory')||'[]');
    existing.push(record);
    localStorage.setItem('gameHistory',JSON.stringify(existing));
  }catch(e){}

  try{
    const seasonId=parseInt(document.getElementById('seasonSelect')?.value);
    if(seasonId&&typeof _addRoundToSeason==='function'){
      const aWins=sA<sB, tied=sA===sB;
      const positions=[
        {name:teamNameA, position:tied?1:(aWins?1:2)},
        {name:teamNameB, position:tied?1:(aWins?2:1)}
      ];
      _addRoundToSeason(seasonId,record,positions);
    }
  }catch(e){}

  clearActiveRound();
  showConfirm(teamNameA,teamNameB,sA,sB,par,course,dateVal);
}

function showConfirm(nameA,nameB,sA,sB,par,course,dateVal){
  document.getElementById('setupScreen').style.display='none';
  const cs=document.getElementById('confirmScreen');
  cs.style.display='flex';
  const d=dateVal?new Date(dateVal+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
  document.getElementById('confirmSub').textContent=(course||'Round')+(d?' · '+d:'');
  const aWins=sA<sB, tied=sA===sB;
  const rows=(!aWins&&!tied)?[[nameB,sB],[nameA,sA]]:[[nameA,sA],[nameB,sB]];
  document.getElementById('confirmResult').innerHTML=rows.map((r,i)=>{
    const vpStr=!isNaN(par)?' <span style="font-size:12px;color:rgba(255,255,255,0.4);">('+fmtVsPar(r[1]-par)+')</span>':'';
    return `<div class="result-row">
      <span class="result-name">${i===0&&!tied?'🏆 ':''}${r[0]}</span>
      <span class="result-score">${r[1]}${vpStr}</span>
    </div>`;
  }).join('')+(tied?'<div style="text-align:center;font-size:12px;color:rgba(255,255,255,0.35);padding-top:6px;">Tied</div>':'');
}
</script>
